openapi: 3.1.0
info:
  title: He Is Real Today — worker job contract
  version: 1.0.0-draft
  description: |
    **Internal async jobs (M7).** Not a public API: nothing on GKE accepts inbound connections.

    The primary transport is message-based (D34): the APIs publish CloudEvents-format messages to
    Pub/Sub with the GCP client (e.g. `story-submitted`), and the GKE **`workflow`**
    (Dapr Workflow) dispatches to **`inference-worker`s** over Dapr pub/sub (`inference-task` /
    `inference-result`). The queue choice itself is deferred to M7 (D11). This HTTP contract describes
    the job set and payloads; the `/v1/tasks/{job}` endpoint is only the Cloud Tasks fallback, and the
    payloads are the same either way.

    - **`workflow`** (Dapr Workflow, GKE): orchestration and light I/O jobs: `thumbnail`, `captions`,
      `email`, `translation`. Emails look up the address in Clerk at send time (D16).
    - **`inference-worker`** (Python + Dapr, on-prem and GKE, no database credentials): GPU/LLM jobs:
      `transcribe`, `correct`, `summary`, `screen`.
    - Handlers are idempotent (at-least-once delivery), keyed on `(storyId, jobType)`. A stored story is
      processed only after a fresh consent-ledger check (D21).
    - Paths are under `/v1` except `/health` (D30); errors are RFC 9457 `application/problem+json`.

    **Media ready (M2 plan item 13; D78, D129).** Built now, ahead of the M7 jobs above. api-user's
    Bunny webhook publishes a `MediaJob` to Pub/Sub topic `media-jobs`; the media worker (Dapr's
    Pub/Sub building block only, off Google Cloud, outbound only) pulls it, asks Bunny itself and
    publishes a `MediaResult` to `media-results`. Jobs and answers carry the story's id as their
    Pub/Sub ordering key, so a story's messages are delivered in order (a job for a video no file row
    names has none). Pub/Sub pushes
    each answer to the result writer (`workflow` on Cloud Run, private), `POST /v1/media-results`.
    Messages are JSON in the message's `data` (no CloudEvents envelope).
  contact:
    name: He Is Real Today
    url: https://www.heisreal.today

servers:
  - url: https://workflow.internal
    description: 'workflow: the media result writer (Cloud Run, internal traffic only)'
  - url: https://inference-worker.internal
    description: 'inference-worker (on-prem and GKE, internal only)'

security:
  - cloudTasksOidc: []

tags:
  - name: Health
    description: 'Liveness and readiness.'
  - name: Jobs
    description: 'Async jobs (M7).'
  - name: Media ready
    description: "The media worker's answers about Bunny videos (M2)."

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealthWorker
      summary: Liveness and readiness probe
      security: []
      x-milestone: M0
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Health'
        '503':
          $ref: './components.yaml#/components/responses/HealthDown'

  /v1/media-results:
    post:
      tags: [Media ready]
      operationId: writeMediaResult
      summary: Record the media worker's answer about one Bunny video (Pub/Sub push)
      description: |
        Pub/Sub's push of one `media-results` message (subscription `media-results-writer`). The answer
        is written to the storyFile row of that video, signed in as `service:workflow`, only while its
        story still shows it (unknown, replaced and removed videos, and a `ready` answer whose `title`
        isn't the story's id, are dropped), and only what differs (a repeated answer writes nothing).
        `ready` sets `processing` and, for a video, its width, height, length and Bunny's thumbnail;
        for an audio file only its length (its picture comes from the default-picture step). `encoding`
        sets `processing` to `processing`; `failed` and `gone` set `failed`. The database then hides an
        approved story whose file isn't ready and shows it again when the same file is.
        Any `2xx` acknowledges; anything else is retried and after 5 tries dead-lettered.
      security:
        - pubsubPushOidc: []
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PubSubPush'
      responses:
        '204':
          description: Written, already so, or dropped as not a file any story shows now.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/tasks/{job}:
    post:
      tags: [Jobs]
      operationId: runTask
      summary: Run one job (Cloud Tasks fallback transport)
      description: |
        Valid `job` values depend on the deploy target:
          - workflow: thumbnail | captions | email | translation
          - inference-worker: transcribe | correct | summary | screen
      x-milestone: M7
      parameters:
        - name: job
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                thumbnail,
                captions,
                email,
                translation,
                transcribe,
                correct,
                summary,
                screen,
              ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                Inference jobs take an `InferenceTask` and publish an `InferenceResult` to
                `inference-result`. Other jobs take `storyId`.
              anyOf:
                - $ref: '#/components/schemas/InferenceTask'
                - $ref: '#/components/schemas/WorkflowJob'
      responses:
        '204':
          description: Processed (or already processed).
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

components:
  securitySchemes:
    cloudTasksOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token (Cloud Tasks fallback), verified against the worker service account.
    pubsubPushOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token of the `media-results-push` service account, checked by Cloud Run (run.invoker).
  schemas:
    MediaJob:
      type: object
      description: 'A job on `media-jobs`: go and look at this Bunny video. JSON in the message data.'
      required: [videoId]
      properties:
        videoId:
          type: string
          description: The Bunny video id (a GUID).
        eventId:
          type: string
          description: Bunny's webhook event id, for the logs.
    MediaResult:
      type: object
      description: |
        The media worker's answer on `media-results` (ordering key: the story's id). JSON in the message
        data. `ready` needs every fact below; the others carry only the ids.
      required: [videoId, outcome]
      properties:
        videoId:
          type: string
          description: The Bunny video id (a GUID).
        eventId:
          type: string
        outcome:
          type: string
          enum: [ready, failed, encoding, gone]
        title:
          type: string
          description: The video's title at Bunny, which is its story's id (D69).
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        lengthSeconds:
          type: integer
          minimum: 1
        thumbnailFileName:
          type: string
          description: Bunny's thumbnail file in the video's folder, e.g. `thumbnail.jpg`.
    PubSubPush:
      type: object
      description: Pub/Sub's push body; `message.data` is a base64 `MediaResult`.
      required: [message]
      properties:
        message:
          type: object
          required: [data]
          properties:
            data:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema:
                $ref: '#/components/schemas/MediaResult'
            messageId:
              type: string
            orderingKey:
              type: string
        subscription:
          type: string
    WorkflowJob:
      type: object
      description: Payload of a `workflow` job.
      properties:
        storyId:
          type: string
          description: Opaque story ID.
        lang:
          type: string
          description: Target language (translation).
    MediaRef:
      type: object
      description: How an inference worker fetches the source media (outbound). Workers hold no Bunny credentials.
      required: [source, fetchUrl, format]
      properties:
        source:
          type: string
          enum: [bunny-stream, bunny-storage]
        fetchUrl:
          type: string
          format: uri
          description: Short-lived signed URL; TTL at least the retry window.
        bunnyVideoId:
          type: string
          description: Bunny Stream GUID (provenance).
        format:
          type: string
          enum: [video, audio]
        durationSeconds:
          type: number
          description: A hint; the worker probes authoritatively.
    Segment:
      type: object
      description: A timestamped transcript span (seconds).
      required: [start, end, text]
      properties:
        start:
          type: number
        end:
          type: number
        text:
          type: string
    InferenceTask:
      type: object
      description: |
        Dispatch payload for an inference job, on Dapr pub/sub topic `inference-task[.<jobType>]` (or the
        `/v1/tasks/{job}` body on the fallback). Idempotent per `(storyId, jobType)`. Fully specified for
        `transcribe`; `correct`/`summary`/`screen` carry the working transcript instead of `mediaRef`
        (bodies to be defined in M7).
      required: [storyId, jobType]
      properties:
        storyId:
          type: string
          description: Opaque story ID; also the workflow instance ID.
        jobType:
          type: string
          enum: [transcribe, correct, summary, screen]
        mediaRef:
          $ref: '#/components/schemas/MediaRef'
        language:
          type: string
          default: auto
          description: 'Whisper language hint; `auto` to detect.'
        attempt:
          type: integer
          minimum: 1
    InferenceResult:
      type: object
      description: |
        Published to Dapr pub/sub topic `inference-result`. The fields below are the `transcribe` outputs;
        other jobs share the `(storyId, jobType, status)` envelope.
      required: [storyId, jobType, status]
      properties:
        storyId:
          type: string
        jobType:
          type: string
          enum: [transcribe, correct, summary, screen]
        status:
          type: string
          enum: [ok, error]
        rawTranscriptText:
          type: string
          description: Verbatim ASR output (not the corrected `transcriptText`).
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        language:
          type: string
          description: Detected ISO language.
        durationSeconds:
          type: number
        provenance:
          type: object
          description: '`{ backend, model, computeType, device }`, for audit and re-runs.'
        metrics:
          type: object
          description: '`{ inferSeconds, rtf }`.'
        error:
          type: object
          description: Present when `status` is `error`; lets the workflow choose retry or dead-letter.
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
