openapi: 3.1.0
info:
  title: He Is Real Today — shared API components
  version: 1.0.0-draft
  description: |
    **Not a deployable API.** Shared schemas, parameters, headers and responses referenced by
    the per-service specs (`api-public-read.yaml`, `api-user.yaml`, `api-admin.yaml`,
    `worker.yaml`) through relative `$ref`s, e.g. `./components.yaml#/components/schemas/StoryPublic`.
    Conventions: `docs/api-conventions.md`. Decisions: `project/context/research/m0-schema-consent-decisions.html`.

# No paths: this file only provides reusable components.
paths: {}

components:
  parameters:
    limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `nextCursor`.
      schema:
        type: string
    storyId:
      name: id
      in: path
      required: true
      description: Story ID. Opaque (the SurrealDB record ID without the `story:` prefix); don't parse it. Commands and admin routes use IDs; public queries use slugs (D30).
      schema:
        type: string
    storyIdRelation:
      name: storyId
      in: path
      required: true
      description: ID of the related story (from `id` on a public story).
      schema:
        type: string
    storySlug:
      name: slug
      in: path
      required: true
      description: The story's current or a previous slug. A previous slug answers `301` to the current one (D30).
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    tagSlug:
      name: slug
      in: path
      required: true
      description: Tag slug; also the tag's ID (`tag:<slug>`).
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    consentType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsentType'
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the version being changed (D29). `412` if it isn't current, `428` if missing.
      schema:
        type: string
        example: '"3"'
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: A previously returned `ETag`; `304` if it is still current.
      schema:
        type: string
        example: '"3"'
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (a UUID) for this request (IETF draft-ietf-httpapi-idempotency-key-header).
        A retry with the same key and body returns the stored response; the same key with a different body
        returns `422`. Keys are kept for 24 hours (D29).
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    ETag:
      description: Strong entity tag holding a single resource's `version` (D29), e.g. `"3"`. Send it back in `If-Match`.
      schema:
        type: string
        example: '"3"'
    RepresentationETag:
      description: |
        Strong validator of exactly this representation: a hash of the response body (e.g.
        `"TrGj5Bl7BP-yfXFAo6OnhOCbXpL"`). For public reads of a resource that embeds others by
        reference (a story and its tags), so any change to what's sent gives a new value. Only for
        `If-None-Match` (`304`); public reads take no commands.
      schema:
        type: string
    CollectionETag:
      description: |
        Weak, representation-based validator (e.g. `W/"<hash of the response body>"`) for collections,
        composite views and resources without a database version. Use it only with `If-None-Match`
        (`304`), never with `If-Match`: commands take the individual resource's `version`.
      schema:
        type: string
        example: W/"5f2b9c"
    Location:
      description: URL of the created resource or of the current slug.
      schema:
        type: string
        format: uri-reference
    CacheControlPublic:
      description: |
        Public queries (D30). `no-store` unless shared caching is turned on
        (`PUBLIC_RESPONSE_CACHING=on`; D51: never in dev), so a hidden, withdrawn or erased story
        disappears on the next request. When on: `public, max-age=60, stale-while-revalidate=300`.
      schema:
        type: string
        enum: [no-store, 'public, max-age=60, stale-while-revalidate=300']
        example: no-store
    CacheControlPrivate:
      description: Personal and admin queries (D30).
      schema:
        type: string
        example: 'private, no-store'

  responses:
    BadRequest:
      description: The request is malformed or failed validation. Field errors are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid Clerk token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated, but the role, ownership or consent check failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource (or not visible to the caller).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource's state doesn't allow this command (e.g. not a draft, locked by another moderator).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "`If-Match` doesn't match the current version: re-read and retry (D29)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` is required on this command (D29).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: '`Idempotency-Key` was already used with a different request body (D29). Missing keys get `400`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: |
        The `If-None-Match` validator still matches. Echoes the same validator the matching `200`
        returned (RFC 9110 §15.4.5): the strong `ETag` for a single resource, the weak `CollectionETag`
        for a collection.
      headers:
        ETag:
          description: The validator the matching `200` returned, strong (`"3"`) or weak (`W/"5f2b9c"`).
          schema:
            type: string
    MovedToCurrentSlug:
      description: An old slug (from `slugHistory`); `Location` holds the current URL (D30).
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
    Accepted:
      description: Accepted; the work continues asynchronously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    CommandApplied:
      description: Command applied.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    ServerError:
      description: |
        The service couldn't answer (e.g. the database is unreachable). The body never says why:
        details stay in the service's logs. Clients show a friendly error and may retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Health:
      description: Service and database are up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    HealthDown:
      description: The database is unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details (D30), served as `application/problem+json`. Never echoes testimony
        text or other personal data.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type; `about:blank` when the status says it all.
          example: https://www.heisreal.today/problems/validation-failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable code
          example: validation_failed
        limit:
          type: integer
          description: |
            `story_text_too_long` and `too_many_tags` only: the limit in force that the story is over
            (characters, or themes).
        availableAt:
          type: string
          format: date-time
          description: |
            `weekly_submission_limit_reached` (D94): when the person may next submit a story for
            review, 7 days after their latest submission. `upload_limit_reached` (D113): when they
            may next start an upload.
        errors:
          type: array
          description: Field errors (validation failures only).
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) to the field
                example: /title
              code:
                type: string
                example: too_long
              message:
                type: string

    CommandResult:
      type: object
      description: |
        What every command returns (D28): the aggregate's ID and its version after the command. No
        read-model data: re-query instead (read models update in the same transaction, D25).
        `version` is `null` when the target has no version: append-only ledger events, and what Clerk
        holds (roles, account settings).
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: [integer, 'null']
          minimum: 1

    Page:
      type: object
      description: Cursor page. No total counts (anti-addictive design).
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page; `null` on the last page.

    Version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version (D29), +1 on every command. Also sent as the `ETag`.

    Role:
      type: string
      description: Viewer(0) < User(1) < Moderator(2) < Admin(3) < SuperAdmin(4). Held in Clerk `publicMetadata.role` (D1).
      enum: [Viewer, User, Moderator, Admin, SuperAdmin]

    StoryStatus:
      type: string
      description: |
        `draft` = saved, not submitted (created before upload); `pending` = submitted, in the moderation
        queue; then `in_review` / `approved` / `rejected` / `changes_requested` / `withdrawn`.
      enum:
        [
          draft,
          pending,
          in_review,
          approved,
          rejected,
          changes_requested,
          withdrawn,
        ]

    Format:
      type: string
      enum: [video, audio, written]

    Tag:
      type: object
      required: [slug, name, category, version]
      properties:
        slug:
          type: string
          description: "Also the tag's ID (`tag:<slug>`)."
          example: doubt
        name:
          type: string
          maxLength: 40
          example: Doubt
        category:
          type: string
          enum: [theme, journey, emotion]
        version:
          $ref: '#/components/schemas/Version'

    CreateTag:
      type: object
      required: [slug, name, category]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
          maxLength: 40
        category:
          type: string
          enum: [theme, journey, emotion]

    TagPatch:
      type: object
      description: JSON Merge Patch (RFC 7396). The slug (ID) can't change.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        category:
          type: string
          enum: [theme, journey, emotion]

    MediaPlayback:
      type: object
      description: |
        Playback-safe media info (no internal storage keys). URLs are Bunny.net links signed with
        token authentication (D52): Bunny refuses them without their `token` and `expires`, and after
        `expires`. Public views sign only published stories; links last at least 6 hours, longer than
        any cached response may be served. Never store them; fetch the story again for fresh ones.
      properties:
        format:
          type: string
          enum: [video, audio]
        playbackUrl:
          type: [string, 'null']
          format: uri
          description: |
            The Bunny Stream player for an iframe (video and audio):
            `https://player.mediadelivery.net/embed/{libraryId}/{videoId}?token=…&expires=…`. Clients
            may append player options (e.g. `autoplay=false`); the token covers only the video and
            expiry. `null` when signing is off or the media has no video yet.
          example: https://player.mediadelivery.net/embed/786537/b8a77258-abfd-469d-ba63-9b89b62fcce6?token=0f1e2d3c&expires=1792789200
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: The video's or audio file's thumbnail on Bunny's Stream CDN, signed (`token=HS256-…&expires=…`). For audio, the person's image or the site's default audio thumbnail. `null` when signing is off.
        width:
          type: [integer, 'null']
          minimum: 1
          description: |
            The real pixel width (D53, replacing `aspectRatio`): a video's encode result, or an audio
            file's thumbnail's size (the person's image or the site's default audio thumbnail, never
            Bunny's audio placeholder; Joel, 2026-10-24). With `height`, the shape: never beyond 1:3
            or 3:1 (the database refuses it); cards clamp it between 9:16 and 2:1. `null` until the
            media is processed; a published video or audio file always has it: approval waits for
            processing (A2).
          example: 1080
        height:
          type: [integer, 'null']
          minimum: 1
          description: The real pixel height (see `width`).
          example: 1920
        captionsUrl:
          type: [string, 'null']
          description: From M7 (transcription)
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
          description: |
            The clip's length in seconds (processing's result). A published clip always has it
            (A2); `null` before processing.
        processing:
          type: [string, 'null']
          enum: [processing, ready, failed, null]
          description: |
            How far processing (M7: size, duration and the safety checks) has got (A2); `null` = not
            processed yet. Only on the submitter's and moderators' views: a published item is always
            `ready`, so public views leave it out. Set by processing only; a new upload starts again.

    StoryImage:
      type: object
      description: |
        The optional image of a written story (D53): the person's own content, mirrored into the read
        model. Never beyond 1:3 or 3:1; cards clamp it between 9:16 and 2:1 (cropped around the centre).
      required: [url, width, height, alt]
      properties:
        url:
          type: [string, 'null']
          format: uri
          description: |
            The image on Bunny's `images` CDN, signed with token authentication (D52;
            `token=HS256-…&expires=…`, at least 6 hours). `null` when signing is off.
        width:
          type: integer
          minimum: 1
          example: 1200
        height:
          type: integer
          minimum: 1
          example: 1600
        alt:
          type: [string, 'null']
          maxLength: 500
          description: The person's short description of the image; `null` = none given (clients show a neutral default).
        processing:
          type: [string, 'null']
          enum: [processing, ready, failed, null]
          description: |
            The server-side check of the image (A2); `null` = not checked yet. Only on the submitter's
            and moderators' views (a published image is always `ready`). A changed image starts again.

    StorySummary:
      type: object
      description: |
        Card view for browse, related, favourites and feed. From `publicStory`; no metrics, no
        submitter data, no playback or storage data. Carries what D55's balanced masonry predicts a
        card's height from: the picture's size (`thumbnailWidth`/`thumbnailHeight` or `image`) and
        the `excerpt` to measure.
      required:
        [
          id,
          slug,
          title,
          excerpt,
          bylineName,
          primaryFormat,
          durationSeconds,
          thumbnailUrl,
          thumbnailWidth,
          thumbnailHeight,
          image,
          textLength,
          tags,
          publishedAt,
        ]
      properties:
        id:
          type: string
          description: For commands such as favouriting.
        slug:
          type: string
        title:
          type: string
          maxLength: 140
        excerpt:
          type: string
          maxLength: 241
          description: |
            The start of the description, or of the text when there is no description, on one
            line: at most 240 characters, cut at a word, then `…` when cut.
        bylineName:
          type: [string, 'null']
          description: '`null` = anonymous.'
        primaryFormat:
          $ref: '#/components/schemas/Format'
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
          description: The clip's length (video and audio); `null` for written stories.
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: The video's or audio file's thumbnail, signed like the story page's (`MediaPlayback.thumbnailUrl`, D52). `null` for written stories, or when signing is off. Cards never carry a player link.
        thumbnailWidth:
          type: [integer, 'null']
          minimum: 1
          description: |
            The pixel width of the card's picture, for its shape (D53, D55): the video's, or an
            audio story's thumbnail's (the person's image or the site's default audio thumbnail;
            Joel, 2026-10-24). `null` for written stories.
        thumbnailHeight:
          type: [integer, 'null']
          minimum: 1
          description: The picture's pixel height (see `thumbnailWidth`).
        image:
          description: A written story's image (D53); `null` otherwise or when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryImage'
            - type: 'null'
        textLength:
          type: integer
          minimum: 0
          maximum: 10000
          description: Characters in the story's text (0 = none), e.g. for "5 min read" (A3).
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        publishedAt:
          type: string
          format: date-time

    StoryPublic:
      type: object
      description: |
        Public detail view, read only from the `publicStory` read model (D26). Never holds the submitter,
        consent, raw transcript, moderation data or quality signal.
      required:
        [
          id,
          slug,
          title,
          description,
          primaryFormat,
          media,
          tags,
          publishedAt,
          version,
        ]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: [string, 'null']
          description: The story's text; required for written stories, optional for video and audio (D53).
        bylineName:
          type: [string, 'null']
          description: '`null` = anonymous.'
        primaryFormat:
          $ref: '#/components/schemas/Format'
        media:
          type: array
          description: Exactly one item of the story's format for video and audio stories; empty for written ones (D53).
          items:
            $ref: '#/components/schemas/MediaPlayback'
        image:
          description: A written story's image (D53); `null` otherwise or when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryImage'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    StoryMine:
      type: object
      description: |
        The submitter's own view (read as the person, D27), including lifecycle and moderation feedback.
        No consent object: a story stores no consent (D86); the person's consent is
        `GET /v1/account/consents`. A video or audio story's `media` holds its uploaded file once
        `/upload-url` has put one on it (M2 plan PR 7), but isn't signed for the person yet
        (`playbackUrl` and `thumbnailUrl` are `null`; a preview of your own upload comes later),
        and a written story's `image` is `null` until images.
      required:
        [id, version, status, title, primaryFormat, createdAt, updatedAt]
      properties:
        id:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        slug:
          type: string
        status:
          $ref: '#/components/schemas/StoryStatus'
        title:
          type: string
        description:
          type: string
        body:
          type: [string, 'null']
        bylineName:
          type: [string, 'null']
        primaryFormat:
          $ref: '#/components/schemas/Format'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaPlayback'
        image:
          description: A written story's image (D53); `null` otherwise or when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryImage'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        rejectionFeedback:
          type: [string, 'null']
          description: Pastoral feedback after reject or request-changes.
        submittedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoryModeration:
      description: Moderator view of the story write model, including lock state and the submitter reference.
      allOf:
        - $ref: '#/components/schemas/StoryMine'
        - type: object
          properties:
            submitterUserId:
              type: string
            lockedByUserId:
              type: [string, 'null']
            lockedAt:
              type: [string, 'null']
              format: date-time

    FlaggedStory:
      type: object
      properties:
        story:
          $ref: '#/components/schemas/StoryModeration'
        weightedConcernScore:
          type: number
          description: Trust-weighted; moderators only.
        concerns:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
              detail:
                type: [string, 'null']
              reporterTrust:
                type: number
              createdAt:
                type: string
                format: date-time

    CreateDraftStory:
      type: object
      description: |
        Creates a `draft` before any upload. The body carries no consent: consent stays in the person's
        ledger (D17), granted through `POST /v1/account/consents`, and is checked, not carried. Editing or
        uploading to a draft needs Art 9 consent that counts. Creating one, and `/submit`, also need the
        sign-up form in force accepted (its 18+ box, D93) and no newer testimony version requiring
        acceptance for new submissions; `/submit` also needs `publish`.
      required: [title, primaryFormat]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 5000
        body:
          type: string
          maxLength: 50000
          description: |
            Required when `primaryFormat` is `written`. At most the settings' maximum (W3: default
            10,000 characters, `GET /v1/account/limits`; 50,000 is the hard ceiling). A written story
            may be saved shorter, but needs the settings' minimum (default 200, not counting leading and
            trailing spaces) to be submitted.
        bylineName:
          type: [string, 'null']
          maxLength: 80
          description: |
            The optional first name shown on the story; `null` (or blank) = "Anonymous" (D16). There is
            no email field: Clerk holds it.
        primaryFormat:
          $ref: '#/components/schemas/Format'
        tagSlugs:
          type: array
          description: |
            Tags from `GET /v1/tags` (api-user), no repeats, at most the settings' maximum (W3:
            default 5; 20 is the hard ceiling). A draft may have none; `/submit` needs the settings'
            minimum (default 1).
          items:
            type: string
          maxItems: 20
          uniqueItems: true

    StoryPatch:
      type: object
      description: JSON Merge Patch (RFC 7396) on the editable fields. Never the status (D28).
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 5000
        body:
          type: [string, 'null']
          maxLength: 50000
          description: At most the settings' maximum (W3, default 10,000); the minimum applies at submit.
        bylineName:
          type: [string, 'null']
          maxLength: 80
        tagSlugs:
          type: array
          items:
            type: string
          maxItems: 20
          uniqueItems: true

    SubmissionLimits:
      type: object
      description: |
        The limits that apply to the signed-in person (W3, D94, D112): the text and theme limits an admin
        sets, and their own open-drafts and weekly-submission limits (the settings, or the admin's override
        for them; `null` = no limit, e.g. a trusted submitter).
      required: [storyText, tags, openDrafts, submissions, uploads]
      properties:
        storyText:
          type: object
          required: [min, max]
          description: A written story's text in characters, trimmed (to submit / at most).
          properties:
            min:
              type: integer
              minimum: 1
            max:
              type: integer
              minimum: 1
        tags:
          type: object
          required: [min, max]
          description: Themes per story (to submit / at most).
          properties:
            min:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 1
        openDrafts:
          type: object
          required: [max, open]
          properties:
            max:
              type: [integer, 'null']
              minimum: 1
            open:
              type: integer
              minimum: 0
              description: Their stories in `draft` now.
        submissions:
          type: object
          required: [per7Days, nextAvailableAt]
          properties:
            per7Days:
              type: [integer, 'null']
              minimum: 1
            nextAvailableAt:
              type: [string, 'null']
              format: date-time
              description: When they may next submit a story for review; `null` = now.
        uploads:
          type: object
          required:
            [
              videoMaxBytes,
              audioMaxBytes,
              maxDurationSeconds,
              perHour,
              per7Days,
              nextAvailableAt,
            ]
          description: |
            Video and audio uploads (D113; M2 plan PR 7): one file's size and length, and new uploads
            per rolling hour and 7 days (the settings, or the admin's override; a trusted submitter has
            no weekly limit and the ceilings for size and length).
          properties:
            videoMaxBytes:
              type: integer
              minimum: 1
            audioMaxBytes:
              type: integer
              minimum: 1
            maxDurationSeconds:
              type: integer
              minimum: 1
            perHour:
              type: integer
              minimum: 1
            per7Days:
              type: [integer, 'null']
              minimum: 1
            nextAvailableAt:
              type: [string, 'null']
              format: date-time
              description: When they may next start an upload; `null` = now.

    UploadUrlRequest:
      type: object
      description: |
        The file the person chose (M2 plan PR 7). The browser checks it against `SubmissionLimits.uploads`
        first; api-user checks again before it creates anything at Bunny, and the database when it
        records the upload (D113). The TUS link binds neither size nor type (D68), so these are the
        person's word: submit checks again, with Bunny's own length.
      required: [format, contentType, fileSizeBytes]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [video, audio]
          description: The story's own `primaryFormat`.
        contentType:
          type: string
          description: |
            Video: `video/mp4`, `video/quicktime` or `video/webm`. Audio: `audio/mpeg`, `audio/mp4`,
            `audio/x-m4a`, `audio/wav`, `audio/x-wav` or `audio/wave` (A4: MP4/MOV/WebM, MP3/M4A/WAV).
          example: video/mp4
        fileSizeBytes:
          type: integer
          minimum: 1
        durationSeconds:
          type: integer
          minimum: 1
          description: The file's length as the browser read it, rounded up; leave out if unknown.
        resume:
          type: boolean
          default: false
          description: |
            `true`: a new link for the draft's own video, to carry on an upload (after a reload, or once
            the last link expired). Only while nothing has arrived for it (else `409`
            `nothing_to_resume`); creates nothing and doesn't change the story. `false`: a new video,
            replacing the draft's (deleted at Bunny at once).

    UploadTarget:
      description: |
        The documented exception to "commands return only `{ id, version }`" (D28): a short-lived
        direct-upload link for the draft's own video (D80: api-user created it and put it on the
        draft; the browser never names one). Also carries the story's new version, for the next
        `If-Match` (unchanged for a resume). The browser starts a TUS upload (`POST uploadUrl` with
        `headers`, then `PATCH` the bytes to the `Location` it gets back) straight to Bunny Stream
        (D68, Frankfurt, D89). Video and audio both go there.
      allOf:
        - $ref: '#/components/schemas/CommandResult'
        - type: object
          required: [provider, uploadUrl, method, headers, expiresAt]
          properties:
            provider:
              type: string
              enum: [bunny_tus]
              description: Bunny Stream TUS upload.
            uploadUrl:
              type: string
              format: uri
              example: https://video.bunnycdn.com/tusupload
            method:
              type: string
              enum: [POST]
              description: The TUS creation request's method.
            headers:
              type: object
              description: Headers for the TUS creation request, exactly as given.
              required:
                [
                  AuthorizationSignature,
                  AuthorizationExpire,
                  VideoId,
                  LibraryId,
                ]
              additionalProperties: false
              properties:
                AuthorizationSignature:
                  type: string
                  description: sha256(libraryId + library key + AuthorizationExpire + VideoId), hex.
                AuthorizationExpire:
                  type: string
                  description: Unix seconds; about an hour away.
                VideoId:
                  type: string
                LibraryId:
                  type: string
            expiresAt:
              type: string
              format: date-time
              description: When the link stops working; ask again with `resume` to carry on after it.

    ModerationFeedback:
      type: object
      properties:
        feedbackToSubmitter:
          type: string
          maxLength: 2000
          description: Shown to the submitter. Pastoral tone expected.

    ModerationFeedbackRequired:
      type: object
      required: [feedbackToSubmitter]
      properties:
        feedbackToSubmitter:
          type: string
          minLength: 1
          maxLength: 2000
          description: Shown to the submitter. Pastoral tone expected.

    CreateConcern:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            [inappropriate, inaccurate, not_a_testimony, safeguarding, other]
        detail:
          type: string
          maxLength: 1000

    AssignRole:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    ConsentType:
      type: string
      description: |
        A consent type, which is also a statement (a box) on a consent form (D84, D93): the sign-up form has
        `age_18plus` and `account_data` (D73: "store my account and favourites"); the testimony form has
        `special_category_religious` and, if it covers publishing on heisreal.today, `publish`; the optional
        social sharing form has `share_socials`.
      enum:
        [
          special_category_religious,
          publish,
          share_socials,
          age_18plus,
          account_data,
        ]

    SiteVideoKey:
      type: string
      description: |
        A video that's part of the site itself, not a story, by a fixed key: `founder-intro` (the founder's
        introduction on About) or `next-steps` (the founder on taking a next step, on Next Steps). Its Bunny video sits in the library's `site-assets` collection and is set in
        OpenTofu (`site_videos`); a visitor can never name a video.
      enum: [founder-intro, next-steps]

    SiteVideo:
      type: object
      description: A signed, expiring player link for a site video (D52), as a story's `playbackUrl`.
      required: [key, playbackUrl, expiresAt]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SiteVideoKey'
        playbackUrl:
          type: string
          format: uri
          description: Bunny's player (`https://player.mediadelivery.net/embed/…?token=…&expires=…`).
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working (6–7 hours after it's issued). Don't keep it past this.

    ConsentForm:
      type: string
      description: |
        The three consent forms (D84, D93): `signup` (D73), `testimony` (D67: store my story and publish it on
        heisreal.today) and the optional `social` (sharing it beyond heisreal.today).
      enum: [signup, testimony, social]

    ConsentMechanism:
      type: string
      description: '`legacy_import` exists only for the migrator (D22); the API never accepts it.'
      enum: [web_form_submission, account_settings, reconsent_prompt]

    ConsentRecord:
      type: object
      description: One immutable event from the append-only consent ledger.
      required:
        [id, type, event, form, formVersion, dpaVersion, mechanism, occurredAt]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ConsentType'
        event:
          type: string
          enum: [granted, withdrawn]
        form:
          description: The form the person saw (D84); `null` on events from before forms.
          oneOf:
            - $ref: '#/components/schemas/ConsentForm'
            - type: 'null'
        formVersion:
          type: [string, 'null']
          description: Its version; `null` on events from before forms.
        dpaVersion:
          type: string
        mechanism:
          type: string
          enum:
            [
              web_form_submission,
              account_settings,
              reconsent_prompt,
              legacy_import,
            ]
        occurredAt:
          type: string
          format: date-time

    ConsentState:
      type: object
      description: The signed-in person's current consent per type, plus the ledger.
      required: [current, history]
      properties:
        current:
          type: array
          description: Latest state per consent type, one entry for every type (the one definition is `fn::consent::current`, D17).
          items:
            type: object
            required:
              [type, granted, form, formVersion, dpaVersion, occurredAt, counts]
            properties:
              type:
                $ref: '#/components/schemas/ConsentType'
              granted:
                type: boolean
                description: The latest event is a grant.
              form:
                oneOf:
                  - $ref: '#/components/schemas/ConsentForm'
                  - type: 'null'
              formVersion:
                type: [string, 'null']
              dpaVersion:
                type: [string, 'null']
              occurredAt:
                type: [string, 'null']
                format: date-time
              counts:
                type: boolean
                description: |
                  Granted, and it counts (`fn::consent::valid`): on a form version that is published or retired
                  and has this statement (D93: a newer version never stops an older grant counting). False for a
                  withdrawal, or e.g. an 18+ or share tick given on a testimony version before D93 moved them.
        signup:
          type: object
          description: |
            D73. Sign-in asks for it, and a new draft or submission needs it; a new sign-up version makes it false
            again until accepted (nothing already public changes, D93).
          required: [accepted, latestVersion]
          properties:
            accepted:
              type: boolean
              description: Both boxes ticked on the sign-up version in force.
            latestVersion:
              type: [string, 'null']
              description: The sign-up version in force; `null` while none is published.
        testimony:
          type: object
          description: |
            D85: testimony consent is per account. `version` is the form version of the person's current Art 9
            grant; accepting a newer version moves the account, covering all their stories. For the signed-in
            banner. Their stories stay public whatever this says (D93).
          required:
            [version, latestVersion, updateAvailable, acceptanceRequired]
          properties:
            version:
              type: [string, 'null']
            latestVersion:
              type: [string, 'null']
            updateAvailable:
              type: boolean
              description: A newer testimony version is published that the person hasn't accepted.
            acceptanceRequired:
              type: boolean
              description: |
                A version requiring acceptance for new submissions came after theirs: they must accept the one in
                force before starting a new draft or submitting.
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'

    GrantConsent:
      type: object
      description: |
        One ledger event: one statement ticked on the form version shown (D84). The version must be the one
        in force (`GET /v1/legal/forms/{form}` on api-public-read); the database refuses anything but a
        published version. The privacy document is the one the form version links. The server sets
        `occurredAt` and computes the evidence hash (`heisreal-consent-evidence/v3`, D114): sha256 of the form,
        its version, its text's sha256 and its statements file's sha256 (the words beside each box), the DPA
        version and its text's sha256, the statement, the event and the mechanism. No IP address (D19).
      required: [form, formVersion, statement, mechanism]
      properties:
        form:
          $ref: '#/components/schemas/ConsentForm'
        formVersion:
          type: string
          description: The form version shown (the one in force), e.g. `v1`.
        statement:
          $ref: '#/components/schemas/ConsentType'
        mechanism:
          $ref: '#/components/schemas/ConsentMechanism'

    DpaVersion:
      type: object
      description: A version of the data-subject-facing Data Processing Agreement (D20, D22).
      required: [id, status, materiality, contentHash, version]
      properties:
        id:
          type: string
          example: v1
        kind:
          type: string
          enum: [standard, legacy]
        status:
          type: string
          enum: [draft, published]
          description: Published versions are immutable.
        materiality:
          type: string
          enum: [minor, material]
          description: '`material` means re-consent is required.'
        documentUrl:
          type: string
          description: 'The DPA text (kept in the repo, `libs/legal/dpa/<id>.md`).'
        contentHash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 of the document.
        changeSummary:
          type: [string, 'null']
        supersedes:
          type: [string, 'null']
        effectiveFrom:
          type: [string, 'null']
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    DpaDocument:
      description: A published DPA version with its words (the text of `libs/legal/dpa/<id>.md`, D84).
      allOf:
        - $ref: '#/components/schemas/DpaVersion'
        - type: object
          required: [text]
          properties:
            text:
              type: string
              description: Markdown.

    ConsentFormVersion:
      type: object
      description: |
        A published version of a consent form (D84), frozen once published: its words (a document to read),
        the statements (boxes) it has as structured data (D114), the privacy document it links and, for the testimony and social sharing forms, its features.
        "18+" is on the sign-up form only (D77, D93).
      required:
        [
          form,
          id,
          status,
          publishedAt,
          dpaVersion,
          textHash,
          text,
          statements,
          boxes,
          statementsHash,
          version,
        ]
      properties:
        form:
          $ref: '#/components/schemas/ConsentForm'
        id:
          type: string
          example: v1
        status:
          type: string
          enum: [published]
        publishedAt:
          type: string
          format: date-time
        dpaVersion:
          type: string
          description: The privacy document this version links.
        textHash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 of `libs/legal/forms/<form>/<id>.md`.
        text:
          type: string
          description: Markdown.
        statements:
          type: array
          description: The statements (consent types) this version has.
          items:
            $ref: '#/components/schemas/ConsentType'
        boxes:
          type: array
          description: |
            D114: the version's boxes, in the order shown, each a statement with the exact words shown
            beside it, from the version's statements file (`libs/legal/forms/<form>/<id>.statements.json`).
            Pages draw the boxes from this, outside the document: nothing in `text` adds, removes or
            changes a box. Lists every statement in `statements`, once each.
          items:
            type: object
            required: [statement, label]
            additionalProperties: false
            properties:
              statement:
                $ref: '#/components/schemas/ConsentType'
              label:
                type: string
                minLength: 1
        statementsHash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 of the statements file; consent evidence v3 covers it (D114).
        version:
          $ref: '#/components/schemas/Version'
        features:
          description: The testimony form's or the social sharing form's features; absent for `signup`.
          oneOf:
            - $ref: '#/components/schemas/TestimonyFormFeatures'
            - $ref: '#/components/schemas/SocialSharingFormFeatures'

    TestimonyFormFeatures:
      type: object
      required:
        [
          requiresAcceptanceForNewSubmissions,
          coversPublicPublishing,
          draftRetentionMonths,
        ]
      additionalProperties: false
      properties:
        requiresAcceptanceForNewSubmissions:
          type: boolean
          description: |
            People on an older version must accept this one before starting a new draft or submitting (D93).
            Their existing stories stay public, and their older grants keep counting.
        coversPublicPublishing:
          type: boolean
          description: Asks to publish on heisreal.today (the `publish` statement).
        draftRetentionMonths:
          type: integer
          description: Untouched drafts are deleted after this many months (D71).

    SocialSharingFormFeatures:
      type: object
      description: |
        What the media team may do with a story beyond heisreal.today under this version (D93), with the
        person's `share_socials` tick on it. Anything not listed, or `false`, is not allowed; a platform or use
        added later is `false` for older versions (people opt into a new version).
      required:
        [
          shareYouTube,
          shareInstagram,
          shareTikTok,
          shareFacebook,
          allowEditingAndClipping,
          allowChurchAndPartnerMedia,
          allowPrintAndEvents,
          allowPaidPromotion,
        ]
      additionalProperties: false
      properties:
        shareYouTube:
          type: boolean
        shareInstagram:
          type: boolean
        shareTikTok:
          type: boolean
        shareFacebook:
          type: boolean
        allowEditingAndClipping:
          type: boolean
          description: Shorter clips, still images, captions, subtitles and translations.
        allowChurchAndPartnerMedia:
          type: boolean
          description: Given to partner churches and ministries for their own media.
        allowPrintAndEvents:
          type: boolean
          description: Shown at events and services, and in printed material.
        allowPaidPromotion:
          type: boolean
          description: Used in paid adverts promoting He Is Real Today.

    CreateDpaDraft:
      type: object
      description: Creates a `draft`. The document lives in the repo; the server computes `contentHash` from it.
      required: [id, materiality]
      properties:
        id:
          type: string
          pattern: '^v[0-9]+$'
          example: v2
        materiality:
          type: string
          enum: [minor, material]
        changeSummary:
          type: string
        supersedes:
          type: string
        effectiveFrom:
          type: string
          format: date-time

    Account:
      type: object
      description: |
        The signed-in person's account bootstrap (M2), built from the verified Clerk token and the
        SurrealDB `user` record only, with no call to Clerk's servers: `id` and `createdAt` come from
        the record (created on the person's first call), `role` from the token's claim (D1). Email and
        name stay in Clerk and are edited in Clerk's own account panel (D16, D81). There are no
        notification settings in M2 (D81: no emails in M2, D79), so `notificationPrefs` is absent.
      required: [id, role, createdAt, signupConsent, testimonyConsent]
      properties:
        id:
          type: string
        version:
          type: 'null'
          description: Always `null`; the account has no database version, so it takes no `If-Match`.
        role:
          $ref: '#/components/schemas/Role'
        notificationPrefs:
          type: object
          description: |
            Not sent in M2 (D81). Reserved for notification settings, which would live in Clerk
            `privateMetadata` (D16), never in SurrealDB.
          additionalProperties:
            type: boolean
        createdAt:
          type: string
          format: date-time
        signupConsent:
          type: object
          description: |
            The sign-up consent form (D73, D84): whether the person has accepted the latest published
            version. Every new published version needs accepting again before the site can be used
            signed in. `accepted` is `false` while no sign-up form is published.
          required: [accepted]
          properties:
            accepted:
              type: boolean
        testimonyConsent:
          type: object
          description: |
            The testimony consent form (D85, D93), for the banner after sign-in: `acceptanceRequired` is
            `ConsentState.testimony.acceptanceRequired`. A version requiring acceptance for new
            submissions came after the person's own, so they must accept the one in force before
            starting a new draft or submitting. Their stories stay public either way. `false` for
            someone who never gave testimony consent.
          required: [acceptanceRequired]
          properties:
            acceptanceRequired:
              type: boolean

    AccountPatch:
      type: object
      description: JSON Merge Patch (RFC 7396), applied to Clerk `privateMetadata` through Clerk's Backend API.
      additionalProperties: false
      properties:
        notificationPrefs:
          type: object
          additionalProperties:
            type: boolean

    UserAdmin:
      type: object
      description: Joins the `user` record with Clerk (fetched at read time, never stored, D16).
      properties:
        id:
          type: string
        clerkUserId:
          type: [string, 'null']
          description: '`null` for a legacy person without a Clerk account (D22).'
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        acceptedSubmissions:
          type: integer
        createdAt:
          type: string
          format: date-time
        gdprDeletedAt:
          type: [string, 'null']
          format: date-time

    Health:
      type: object
      required: [status, service, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: api-public-read
        db:
          type: string
          enum: [up, down]
        consentChecksRelaxed:
          type: boolean
          description: |
            D48: `true` only in dev while consent checks are relaxed for dummy data (the database's own
            setting, read with this service's login). Present when the database is up. The dev site's
            footer shows it.
