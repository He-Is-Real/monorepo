openapi: 3.1.0
info:
  title: He Is Real Today — shared API components
  version: 1.0.0-draft
  description: |
    **Not a deployable API.** Shared schemas, parameters, headers and responses referenced by
    the per-service specs (`api-public-read.yaml`, `api-user.yaml`, `api-admin.yaml`,
    `worker.yaml`) through relative `$ref`s, e.g. `./components.yaml#/components/schemas/StoryPublic`.
    Conventions: `docs/api-conventions.md`. Decisions: `project/context/research/m0-schema-consent-decisions.html`.

# No paths: this file only provides reusable components.
paths: {}

components:
  parameters:
    limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `nextCursor`.
      schema:
        type: string
    storyId:
      name: id
      in: path
      required: true
      description: Story ID. Opaque (the SurrealDB record ID without the `story:` prefix); don't parse it. Commands and admin routes use IDs; public queries use slugs (D30).
      schema:
        type: string
    storyIdRelation:
      name: storyId
      in: path
      required: true
      description: ID of the related story (from `id` on a public story).
      schema:
        type: string
    storySlug:
      name: slug
      in: path
      required: true
      description: The story's current or a previous slug. A previous slug answers `301` to the current one (D30).
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the version being changed (D29). `412` if it isn't current, `428` if missing.
      schema:
        type: string
        example: '"3"'
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: A previously returned `ETag`; `304` if it is still current.
      schema:
        type: string
        example: '"3"'
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (a UUID) for this request (IETF draft-ietf-httpapi-idempotency-key-header).
        A retry with the same key and body returns the stored response; the same key with a different body
        returns `422`. Keys are kept for 24 hours (D29).
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    ETag:
      description: Strong entity tag holding a single resource's `version` (D29), e.g. `"3"`. Send it back in `If-Match`.
      schema:
        type: string
        example: '"3"'
    RepresentationETag:
      description: |
        Strong validator of exactly this representation: a hash of the response body (e.g.
        `"TrGj5Bl7BP-yfXFAo6OnhOCbXpL"`). For public reads of a resource that embeds others by
        reference (a story and its themes), so any change to what's sent gives a new value. Only for
        `If-None-Match` (`304`); public reads take no commands.
      schema:
        type: string
    CollectionETag:
      description: |
        Weak, representation-based validator (e.g. `W/"<hash of the response body>"`) for collections,
        composite views and resources without a database version. Use it only with `If-None-Match`
        (`304`), never with `If-Match`: commands take the individual resource's `version`.
      schema:
        type: string
        example: W/"5f2b9c"
    Location:
      description: URL of the created resource or of the current slug.
      schema:
        type: string
        format: uri-reference
    CacheControlPublic:
      description: |
        Public queries (D30). `no-store` unless shared caching is turned on
        (`PUBLIC_RESPONSE_CACHING=on`; D51: never in dev), so a hidden, withdrawn or erased story
        disappears on the next request. When on: `public, max-age=60, stale-while-revalidate=300`.
      schema:
        type: string
        enum: [no-store, 'public, max-age=60, stale-while-revalidate=300']
        example: no-store
    CacheControlPrivate:
      description: Personal and admin queries (D30).
      schema:
        type: string
        example: 'private, no-store'

  responses:
    BadRequest:
      description: The request is malformed or failed validation. Field errors are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid Clerk token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Authenticated, but the role or ownership check failed, or the person must agree first (plan 4e:
        `terms_agreement_required`, `testimony_consent_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource (or not visible to the caller).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource's state doesn't allow this command (e.g. not a draft, locked by another moderator).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "`If-Match` doesn't match the current version: re-read and retry (D29)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` is required on this command (D29).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: '`Idempotency-Key` was already used with a different request body (D29). Missing keys get `400`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: |
        The `If-None-Match` validator still matches. Echoes the same validator the matching `200`
        returned (RFC 9110 §15.4.5): the strong `ETag` for a single resource, the weak `CollectionETag`
        for a collection.
      headers:
        ETag:
          description: The validator the matching `200` returned, strong (`"3"`) or weak (`W/"5f2b9c"`).
          schema:
            type: string
    MovedToCurrentSlug:
      description: An old slug (from `slugHistory`); `Location` holds the current URL (D30).
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
    Accepted:
      description: Accepted; the work continues asynchronously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    CommandApplied:
      description: Command applied.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    ServerError:
      description: |
        The service couldn't answer (e.g. the database is unreachable). The body never says why:
        details stay in the service's logs. Clients show a friendly error and may retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Health:
      description: Service and database are up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    HealthDown:
      description: The database is unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details (D30), served as `application/problem+json`. Never echoes testimony
        text or other personal data.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type; `about:blank` when the status says it all.
          example: https://www.heisreal.today/problems/validation-failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable code
          example: validation_failed
        limit:
          type: integer
          description: |
            `story_text_too_long` only: the limit in force that the story is over (characters).
        availableAt:
          type: string
          format: date-time
          description: |
            `weekly_submission_limit_reached` (D94): when the person may next submit a story for
            review, 7 days after their latest submission. `upload_limit_reached` (D113): when they
            may next start an upload.
        errors:
          type: array
          description: Field errors (validation failures only).
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) to the field
                example: /title
              code:
                type: string
                example: too_long
              message:
                type: string

    CommandResult:
      type: object
      description: |
        What every command returns (D28): the aggregate's ID and its version after the command. No
        read-model data: re-query instead (read models update in the same transaction, D25).
        `version` is `null` when the target has no version: append-only ledger events, and what Clerk
        holds (roles, account settings).
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: [integer, 'null']
          minimum: 1

    Page:
      type: object
      description: Cursor page. No total counts (anti-addictive design).
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page; `null` on the last page.

    Version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version (D29), +1 on every command. Also sent as the `ETag`.

    Role:
      type: string
      description: Viewer(0) < User(1) < Moderator(2) < Admin(3) < SuperAdmin(4). Held in Clerk `publicMetadata.role` (D1).
      enum: [Viewer, User, Moderator, Admin, SuperAdmin]

    StoryStatus:
      type: string
      description: |
        `draft` = saved, not submitted (created before upload); `pending` = submitted, in the moderation
        queue; then `in_review` / `approved` / `rejected` / `changes_requested` / `withdrawn`.
      enum:
        [
          draft,
          pending,
          in_review,
          approved,
          rejected,
          changes_requested,
          withdrawn,
        ]

    Format:
      type: string
      enum: [video, audio, written]

    ThemeRef:
      type: object
      description: A theme as a story carries it (stories link themes and read their names, D15).
      required: [id, name]
      properties:
        id:
          type: string
          description: "The theme's ULID (`theme:<id>`); `?theme=` on browse takes it."
          example: 01JC0Q4Z8N3XG5V2K7T9W1M6RB
        name:
          type: string
          maxLength: 40
          example: Doubt

    Theme:
      type: object
      required: [id, name, highlighted]
      properties:
        id:
          type: string
          example: 01JC0Q4Z8N3XG5V2K7T9W1M6RB
        name:
          type: string
          maxLength: 40
          example: Doubt
        highlighted:
          type: boolean
          description: Shown first, under its category's name, wherever people choose or browse themes.

    ThemeCategory:
      type: object
      description: |
        A category and its themes, A–Z (themes plan v3). Categories come A–Z with `other` (Other, the
        fixed category) last.
      required: [id, name, themes]
      properties:
        id:
          type: string
          description: '`other` for the fixed Other category, else a ULID.'
          example: other
        name:
          type: string
          maxLength: 40
          example: Other
        themes:
          type: array
          items:
            $ref: '#/components/schemas/Theme'

    MediaPlayback:
      type: object
      description: |
        Playback-safe media info (no internal storage keys). URLs are Bunny.net links signed with
        token authentication (D52): Bunny refuses them without their `token` and `expires`, and after
        `expires`. Public views sign only published stories; links last at least 6 hours, longer than
        any cached response may be served. Never store them; fetch the story again for fresh ones.
      properties:
        format:
          type: string
          enum: [video, audio]
        playbackUrl:
          type: [string, 'null']
          format: uri
          description: |
            The Bunny Stream player for an iframe (video and audio):
            `https://player.mediadelivery.net/embed/{libraryId}/{videoId}?token=…&expires=…`. Clients
            may append player options (e.g. `autoplay=false`); the token covers only the video and
            expiry. `null` when signing is off or the media has no video yet.
          example: https://player.mediadelivery.net/embed/786537/b8a77258-abfd-469d-ba63-9b89b62fcce6?token=0f1e2d3c&expires=1792789200
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: The video's or audio file's thumbnail on Bunny's Stream CDN, signed (`token=HS256-…&expires=…`). For audio, the person's image or the site's default audio thumbnail. `null` when signing is off.
        width:
          type: [integer, 'null']
          minimum: 1
          description: |
            The real pixel width (D53, replacing `aspectRatio`): a video's encode result, or an audio
            file's thumbnail's size (the person's image or the site's default audio thumbnail, never
            Bunny's audio placeholder; Joel, 2026-10-24). With `height`, the shape: never beyond 1:3
            or 3:1 (the database refuses it); cards clamp it between 9:16 and 2:1. `null` until the
            media is processed; a published video or audio file always has it: approval waits for
            processing (A2).
          example: 1080
        height:
          type: [integer, 'null']
          minimum: 1
          description: The real pixel height (see `width`).
          example: 1920
        captionsUrl:
          type: [string, 'null']
          description: From M7 (transcription)
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
          description: |
            The clip's length in seconds (processing's result). A published clip always has it
            (A2); `null` before processing.
        processing:
          type: [string, 'null']
          enum: [processing, ready, failed, null]
          description: |
            How far processing (M7: size, duration and the safety checks) has got (A2); `null` = not
            processed yet. Only on the submitter's and moderators' views: a published item is always
            `ready`, so public views leave it out. Set by processing only; a new upload starts again.

    StoryMineImage:
      description: The person's own picture on their story, with what the share flow needs to manage it.
      allOf:
        - $ref: '#/components/schemas/StoryImage'
        - type: object
          required: [path, uploaded]
          properties:
            path:
              type: string
              description: |
                Its file's path in the images storage zone, `stories/<story id>/<32 hex>.webp`
                (server-assigned, D80): what `UploadUrlRequest.expectedImage` names.
              example: stories/01JB/0f1e2d3c4b5a69788796a5b4c3d2e1f0.webp
            uploaded:
              type: [boolean, 'null']
              description: |
                Whether its file has arrived in the storage zone: GetStory checks the zone itself
                until it has (`false` until the browser's `PUT` landed, or when the zone gave no
                clear answer; once there, a file stays as long as its story).
                Its arrival doesn't step the story's version, so GetStory never answers `304` while
                it's `false`. `null` where it isn't checked: lists, and with image uploads off.

    StoryImage:
      type: object
      description: |
        The optional image of a written story (D53), or an audio story's own picture (M2 plan PR 10; it
        becomes the clip's thumbnail through processing, so clients show the thumbnail for audio): the
        person's own content, mirrored into the read model. Its file is server-assigned (D80), a WebP
        re-encoded in the browser without metadata. Never beyond 1:3 or 3:1; cards clamp it between 9:16
        and 2:1 (cropped around the centre).
      required: [url, width, height, alt]
      properties:
        url:
          type: [string, 'null']
          format: uri
          description: |
            The image on Bunny's `images` CDN, signed with token authentication (D52;
            `token=HS256-…&expires=…`, at least 6 hours). `null` when signing is off.
        width:
          type: integer
          minimum: 1
          example: 1200
        height:
          type: integer
          minimum: 1
          example: 1600
        alt:
          type: [string, 'null']
          maxLength: 500
          description: The person's short description of the image; `null` = none given (clients show a neutral default).
        processing:
          type: [string, 'null']
          enum: [processing, ready, failed, null]
          description: |
            The server-side check of the image (A2); `null` = not checked yet. Only on the submitter's
            and moderators' views (a published image is always `ready`). A changed image starts again.

    StorySummary:
      type: object
      description: |
        Card view for browse, related, favourites and feed. From `publicStory`; no metrics, no
        submitter data, no playback or storage data. Carries what D55's balanced masonry predicts a
        card's height from: the picture's size (`thumbnailWidth`/`thumbnailHeight` or `image`) and
        the `excerpt` to measure.
      required:
        [
          id,
          slug,
          title,
          excerpt,
          bylineName,
          primaryFormat,
          durationSeconds,
          thumbnailUrl,
          thumbnailWidth,
          thumbnailHeight,
          image,
          textLength,
          themes,
          publishedAt,
        ]
      properties:
        id:
          type: string
          description: For commands such as favouriting.
        slug:
          type: string
        title:
          type: string
          maxLength: 140
        excerpt:
          type: string
          maxLength: 241
          description: |
            The start of the description, or of the text when there is no description, on one
            line: at most 240 characters, cut at a word, then `…` when cut.
        bylineName:
          type: [string, 'null']
          description: '`null` = anonymous.'
        primaryFormat:
          $ref: '#/components/schemas/Format'
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
          description: The clip's length (video and audio); `null` for written stories.
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: The video's or audio file's thumbnail, signed like the story page's (`MediaPlayback.thumbnailUrl`, D52). `null` for written stories, or when signing is off. Cards never carry a player link.
        thumbnailWidth:
          type: [integer, 'null']
          minimum: 1
          description: |
            The pixel width of the card's picture, for its shape (D53, D55): the video's, or an
            audio story's thumbnail's (the person's image or the site's default audio thumbnail;
            Joel, 2026-10-24). `null` for written stories.
        thumbnailHeight:
          type: [integer, 'null']
          minimum: 1
          description: The picture's pixel height (see `thumbnailWidth`).
        image:
          description: A written story's image (D53); `null` otherwise or when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryImage'
            - type: 'null'
        textLength:
          type: integer
          minimum: 0
          maximum: 10000
          description: Characters in the story's text (0 = none), e.g. for "5 min read" (A3).
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeRef'
        publishedAt:
          type: string
          format: date-time

    StoryPublic:
      type: object
      description: |
        Public detail view, read only from the `publicStory` read model (D26). Never holds the submitter,
        consent, raw transcript, moderation data or quality signal.
      required:
        [
          id,
          slug,
          title,
          description,
          primaryFormat,
          media,
          themes,
          publishedAt,
          version,
        ]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: [string, 'null']
          description: The story's text; required for written stories, optional for video and audio (D53).
        bylineName:
          type: [string, 'null']
          description: '`null` = anonymous.'
        primaryFormat:
          $ref: '#/components/schemas/Format'
        media:
          type: array
          description: Exactly one item of the story's format for video and audio stories; empty for written ones (D53).
          items:
            $ref: '#/components/schemas/MediaPlayback'
        image:
          description: A written story's image (D53); `null` otherwise or when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryImage'
            - type: 'null'
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeRef'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    StoryMine:
      type: object
      description: |
        The submitter's own view (read as the person, D27), including lifecycle and moderation feedback.
        The person's own agreements are on `GET /v1/account`; the one agreement made per story, the social
        media sharing consent (plan 4e), is `socialMediaSharingConsent`. A video or audio story's `media` holds its uploaded file once
        `/upload-url` has put one on it (M2 plan PR 7), but isn't signed for the person yet
        (`playbackUrl` and `thumbnailUrl` are `null`; a preview of your own upload comes later),
        and a written story's `image` is `null` until images.
      required:
        [id, version, status, title, primaryFormat, createdAt, updatedAt]
      properties:
        id:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        slug:
          type: string
        status:
          $ref: '#/components/schemas/StoryStatus'
        title:
          type: string
        description:
          type: string
        body:
          type: [string, 'null']
        bylineName:
          type: [string, 'null']
        primaryFormat:
          $ref: '#/components/schemas/Format'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaPlayback'
        image:
          description: |
            The story's own picture (D53; M2 plan PR 10): a written story's image, an audio story's
            picture or a video's own thumbnail, signed for its owner (D52; `url` is `null` when
            signing is off); `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/StoryMineImage'
            - type: 'null'
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeRef'
        rejectionFeedback:
          type: [string, 'null']
          description: Pastoral feedback after reject or request-changes.
        submittedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        draftExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            A draft's deletion date if nobody touches it again (D71, R5): the nightly housekeeping
            Job deletes it after this. The database's one rule (`fn::story::draft_expires_at`): 6
            months (186 days) after the draft's last edit or the last time an upload link was
            signed for it again. `null` for anything that isn't a draft. Clients show it as it is;
            they never recompute it. Sent by api-user only.
        socialMediaSharingConsent:
          description: |
            Plan 4e: the version of the social media sharing consent ticked for this story at the end of
            its upload, and when; `null` if the box wasn't ticked. It can't be withdrawn: withdrawing or
            deleting the story stops any future use.
          oneOf:
            - $ref: '#/components/schemas/Agreement'
            - type: 'null'

    StoryModeration:
      description: Moderator view of the story write model, including lock state and the submitter reference.
      allOf:
        - $ref: '#/components/schemas/StoryMine'
        - type: object
          properties:
            submitterUserId:
              type: string
            lockedByUserId:
              type: [string, 'null']
            lockedAt:
              type: [string, 'null']
              format: date-time

    FlaggedStory:
      type: object
      properties:
        story:
          $ref: '#/components/schemas/StoryModeration'
        weightedConcernScore:
          type: number
          description: Trust-weighted; moderators only.
        concerns:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
              detail:
                type: [string, 'null']
              reporterTrust:
                type: number
              createdAt:
                type: string
                format: date-time

    CreateDraftStory:
      type: object
      description: |
        Creates a `draft` before any upload. The body carries no consent: the person's agreements are on
        their account (plan 4e), and the database checks the latest terms of use and testimony consent are
        agreed before it stores anything.
      required: [title, primaryFormat]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 5000
        body:
          type: string
          maxLength: 50000
          description: |
            Required when `primaryFormat` is `written`. At most the settings' maximum (W3: default
            10,000 characters, `GET /v1/account/limits`; 50,000 is the hard ceiling). A written story
            may be saved shorter, but needs the settings' minimum (default 200, not counting leading and
            trailing spaces) to be submitted.
        bylineName:
          type: [string, 'null']
          maxLength: 80
          description: |
            The optional first name shown on the story; `null` (or blank) = "Anonymous" (D16). There is
            no email field: Clerk holds it.
        primaryFormat:
          $ref: '#/components/schemas/Format'
        themeIds:
          type: array
          description: |
            Theme ids from `GET /v1/themes` (api-user), no repeats, at most 20 (the hard ceiling). A draft
            may have any number up to that; only `/submit` checks the settings' minimum and maximum
            (themesMin–themesMax, default 1–5).
          items:
            type: string
          maxItems: 20
          uniqueItems: true

    StoryPatch:
      type: object
      description: JSON Merge Patch (RFC 7396) on the editable fields. Never the status (D28).
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 5000
        body:
          type: [string, 'null']
          maxLength: 50000
          description: At most the settings' maximum (W3, default 10,000); the minimum applies at submit.
        bylineName:
          type: [string, 'null']
          maxLength: 80
        themeIds:
          type: array
          items:
            type: string
          maxItems: 20
          uniqueItems: true
        image:
          description: |
            M2 plan PR 10: `null` removes the story's image (its file stays for the clean-up sweep: an
            approved copy may still show it); `{ alt }` changes its description, `null` or blank
            clearing it (`400` `/image` if the story has none; a description is never required). Only `/upload-url` puts an
            image on a story (D80).
          oneOf:
            - type: 'null'
            - type: object
              required: [alt]
              additionalProperties: false
              properties:
                alt:
                  type: [string, 'null']
                  maxLength: 500

    SubmissionLimits:
      type: object
      description: |
        The limits that apply to the signed-in person (W3, D94, D112): the text and theme limits an admin
        sets, and their own open-drafts and weekly-submission limits (the settings, or the admin's override
        for them; `null` = no limit, e.g. a trusted submitter).
      required: [storyText, themes, openDrafts, submissions, uploads]
      properties:
        storyText:
          type: object
          required: [min, max]
          description: A written story's text in characters, trimmed (to submit / at most).
          properties:
            min:
              type: integer
              minimum: 1
            max:
              type: integer
              minimum: 1
        themes:
          type: object
          required: [min, max]
          description: |
            How many themes a story needs when it is submitted (the admin's themesMin and themesMax).
            Checked only at submit.
          properties:
            min:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        openDrafts:
          type: object
          required: [max, open]
          properties:
            max:
              type: [integer, 'null']
              minimum: 1
            open:
              type: integer
              minimum: 0
              description: Their stories in `draft` now.
        submissions:
          type: object
          required: [per7Days, usedIn7Days, nextAvailableAt]
          properties:
            per7Days:
              type: [integer, 'null']
              minimum: 1
            usedIn7Days:
              type: integer
              minimum: 0
              description: |
                Their submissions for review in the last 7 days, which count against `per7Days` (the
                share page says how many they have left).
            nextAvailableAt:
              type: [string, 'null']
              format: date-time
              description: When they may next submit a story for review; `null` = now.
        uploads:
          type: object
          required:
            [
              videoMaxBytes,
              audioMaxBytes,
              maxDurationSeconds,
              perHour,
              per7Days,
              usedIn7Days,
              nextAvailableAt,
            ]
          description: |
            Video and audio uploads (D113; M2 plan PR 7): one file's size and length, and new uploads
            per rolling hour and 7 days (the settings, or the admin's override; a trusted submitter has
            no weekly limit and the ceilings for size and length).
          properties:
            videoMaxBytes:
              type: integer
              minimum: 1
            audioMaxBytes:
              type: integer
              minimum: 1
            maxDurationSeconds:
              type: integer
              minimum: 1
            perHour:
              type: integer
              minimum: 1
            per7Days:
              type: [integer, 'null']
              minimum: 1
            usedIn7Days:
              type: integer
              minimum: 0
              description: |
                The video and audio uploads they started in the last 7 days, which count against
                `per7Days` (pictures never count).
            nextAvailableAt:
              type: [string, 'null']
              format: date-time
              description: When they may next start an upload; `null` = now.

    UploadUrlRequest:
      type: object
      description: |
        The file the person chose (M2 plan PR 7). The browser checks it against `SubmissionLimits.uploads`
        first; api-user checks again before it creates anything at Bunny, and the database when it
        records the upload (D113). The TUS link binds neither size nor type (D68), so these are the
        person's word: submit checks again, with Bunny's own length.

        **Images (M2 plan PR 10; D53):** `format: image`, `contentType: image/webp`, the WebP's exact
        `fileSizeBytes` (at most 5 MiB; the PUT binds it), its real `width` and `height` (200 to 4096
        pixels each, within 1:3..3:1), `expectedImage` (the picture the page showed) and optionally
        `alt`, its description (never required, on any story type: Joel, 2026-10-30). The browser re-encodes the picture to WebP
        without metadata (no EXIF or GPS), at most 2048 pixels on its longer side. No `resume` or
        `durationSeconds`.
      required: [format, contentType, fileSizeBytes]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [video, audio, image]
          description: |
            The story's own `primaryFormat`, or `image` for a story's own picture (a written story's
            image, an audio story's picture or a video's own thumbnail).
        contentType:
          type: string
          description: |
            Video: `video/mp4`, `video/quicktime` or `video/webm`. Audio: `audio/mpeg`, `audio/mp4`,
            `audio/x-m4a`, `audio/wav`, `audio/x-wav` or `audio/wave` (A4: MP4/MOV/WebM, MP3/M4A/WAV). Image: `image/webp`.
          example: video/mp4
        fileSizeBytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
          description: Images only; the picture's real width in pixels.
        height:
          type: integer
          minimum: 1
          description: Images only; the picture's real height in pixels.
        alt:
          type: string
          maxLength: 500
          description: Images only, optional on every story type; the person's short description of the picture.
        expectedImage:
          type: [string, 'null']
          description: |
            Images only, required: the `path` of the story's picture as the person's page showed it
            when they chose theirs (`StoryMine.image.path`), or `null` if it showed none. If the
            story's picture is another one by then (another tab or window put one on or took it
            off), the request is `409` `image_changed`, whatever the story's version: replacing it
            is the person's choice, made with the picture they now see.
        durationSeconds:
          type: integer
          minimum: 1
          description: The file's length as the browser read it, rounded up; leave out if unknown.
        resume:
          type: boolean
          default: false
          description: |
            `true`: a new link for the draft's own video, to carry on an upload (after a reload, or once
            the last link expired). Only while nothing has arrived for it (else `409`
            `nothing_to_resume`); creates nothing and doesn't change the story. `false`: a new video,
            replacing the draft's (deleted at Bunny at once).

    UploadTarget:
      description: |
        The documented exception to "commands return only `{ id, version }`" (D28): a short-lived
        direct-upload link for the draft's own file, with the story's new version for the next
        `If-Match` (unchanged for a resume). Two kinds, by `provider`:

        - `bunny_tus` (video and audio, M2 plan PR 7): a link for the draft's own video (D80: api-user
          created it and put it on the draft; the browser never names one). The browser starts a TUS
          upload (`POST uploadUrl` with `headers`, then `PATCH` the bytes to the `Location` it gets
          back) straight to Bunny Stream (D68, Frankfurt, D89).
        - `bunny_s3` (images, M2 plan PR 10): an S3 presigned `PUT` to the images storage zone (D68,
          London) for the path api-user picked, `stories/<story id>/<random>.webp`, already on the
          draft. The browser sends the WebP's bytes with `headers` exactly; the link binds the path,
          the type, the exact size and its expiry (a few minutes), and works once (a second `PUT`
          answers 412).
      oneOf:
        - $ref: '#/components/schemas/UploadTargetTus'
        - $ref: '#/components/schemas/UploadTargetImage'

    UploadTargetImage:
      description: An image's presigned `PUT` (M2 plan PR 10).
      allOf:
        - $ref: '#/components/schemas/CommandResult'
        - type: object
          required: [provider, uploadUrl, method, headers, expiresAt, path]
          properties:
            provider:
              type: string
              enum: [bunny_s3]
              description: Bunny Storage's S3 endpoint, presigned (SigV4).
            uploadUrl:
              type: string
              format: uri
              example: https://uk-s3.storage.bunnycdn.com/heisreal-dev-image-store/stories/01JB/0f1e.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256
            method:
              type: string
              enum: [PUT]
            headers:
              type: object
              description: Headers for the `PUT`, exactly as given (the browser sets `Content-Length`).
              required: [Content-Type, If-None-Match]
              additionalProperties: false
              properties:
                Content-Type:
                  type: string
                  enum: [image/webp]
                If-None-Match:
                  type: string
                  enum: ['*']
            expiresAt:
              type: string
              format: date-time
              description: When the link stops working (a few minutes); ask again for a new picture after it.
            path:
              type: string
              description: The picture's path, now the story's (`StoryMine.image.path`).

    UploadTargetTus:
      description: A video or audio file's TUS link (M2 plan PR 7).
      allOf:
        - $ref: '#/components/schemas/CommandResult'
        - type: object
          required: [provider, uploadUrl, method, headers, expiresAt]
          properties:
            provider:
              type: string
              enum: [bunny_tus]
              description: Bunny Stream TUS upload.
            uploadUrl:
              type: string
              format: uri
              example: https://video.bunnycdn.com/tusupload
            method:
              type: string
              enum: [POST]
              description: The TUS creation request's method.
            headers:
              type: object
              description: Headers for the TUS creation request, exactly as given.
              required:
                [
                  AuthorizationSignature,
                  AuthorizationExpire,
                  VideoId,
                  LibraryId,
                ]
              additionalProperties: false
              properties:
                AuthorizationSignature:
                  type: string
                  description: sha256(libraryId + library key + AuthorizationExpire + VideoId), hex.
                AuthorizationExpire:
                  type: string
                  description: Unix seconds; about an hour away.
                VideoId:
                  type: string
                LibraryId:
                  type: string
            expiresAt:
              type: string
              format: date-time
              description: When the link stops working; ask again with `resume` to carry on after it.

    ModerationFeedback:
      type: object
      properties:
        feedbackToSubmitter:
          type: string
          maxLength: 2000
          description: Shown to the submitter. Pastoral tone expected.

    ModerationFeedbackRequired:
      type: object
      required: [feedbackToSubmitter]
      properties:
        feedbackToSubmitter:
          type: string
          minLength: 1
          maxLength: 2000
          description: Shown to the submitter. Pastoral tone expected.

    CreateConcern:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            [inappropriate, inaccurate, not_a_testimony, safeguarding, other]
        detail:
          type: string
          maxLength: 1000

    AssignRole:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    SiteVideoKey:
      type: string
      description: |
        A video that's part of the site itself, not a story, by a fixed key: `founder-intro` (the founder's
        introduction on About) or `next-steps` (the founder on taking a next step, on Next Steps). Its Bunny video sits in the library's `site-assets` collection and is set in
        OpenTofu (`site_videos`); a visitor can never name a video.
      enum: [founder-intro, next-steps]

    SiteVideo:
      type: object
      description: A signed, expiring player link for a site video (D52), as a story's `playbackUrl`.
      required: [key, playbackUrl, expiresAt]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SiteVideoKey'
        playbackUrl:
          type: string
          format: uri
          description: Bunny's player (`https://player.mediadelivery.net/embed/…?token=…&expires=…`).
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working (6–7 hours after it's issued). Don't keep it past this.

    SubmitStory:
      type: object
      description: |
        The optional body of `POST /v1/stories/{id}/submit` (plan 4e). `socialMediaSharingConsent` is the
        optional box at the end of the upload (one box naming every platform), ticked, with the version of
        the social media sharing consent the page showed. It is recorded on the story in the same write as
        the submission, with the database's time; a version that isn't the latest any more is `409`
        `agreement_version_changed` and nothing is submitted. Without it (no body, or `{}`) the story's
        choice is left as it is: it can't be taken back.
      additionalProperties: false
      properties:
        socialMediaSharingConsent:
          type: object
          additionalProperties: false
          required: [version]
          properties:
            version:
              type: integer
              minimum: 0

    LegalDocumentName:
      type: string
      description: |
        Plan 4e's four legal texts, each a series of immutable versions numbered from 0 (the latest is in
        force): `terms-of-use` (people agree before using their account; it says they must be 18 or over),
        `testimony-consent` (agreed before a person's first story and again for a newer version; covers every
        story they submit), `social-media-sharing-consent` (the optional box at the end of an upload, per
        story) and `privacy-notice` (shown on the site with its past versions; nobody agrees to it).
      enum: [terms-of-use, testimony-consent, social-media-sharing-consent, privacy-notice]

    LegalDocumentVersion:
      type: object
      description: One version of a legal text, without its words.
      required: [version, releaseDate]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
          description: 0, 1, 2..., in saving order (`/privacy/versions/{version}`).
        releaseDate:
          type: string
          format: date-time
          description: When it was saved, by the database's clock; it was in force from then.

    LegalDocument:
      type: object
      description: |
        A legal text (plan 4e): its latest version with the Markdown the site renders, and every version,
        newest first.
      required: [document, latest, versions]
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/LegalDocumentName'
        latest:
          $ref: '#/components/schemas/LegalDocumentVersionContent'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentVersion'

    LegalDocumentVersionContent:
      type: object
      description: One version of a legal text with its Markdown.
      required: [version, releaseDate, content]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        releaseDate:
          type: string
          format: date-time
        content:
          type: string
          description: Markdown (headings, paragraphs, bold, italic, lists, links, tables; no HTML).

    LegalDocumentVersionText:
      type: object
      description: One version of a legal text with its Markdown, and whether it is the latest.
      required: [document, version, releaseDate, content, latest]
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/LegalDocumentName'
        version:
          type: integer
          minimum: 0
        releaseDate:
          type: string
          format: date-time
        content:
          type: string
          description: Markdown.
        latest:
          type: boolean

    AdminLegalDocumentVersionList:
      type: object
      description: 'For `/admin/consent`: the latest version with its Markdown, and every version, newest first.'
      required: [document, latest, data]
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/LegalDocumentName'
        latest:
          $ref: '#/components/schemas/LegalDocumentVersionContent'
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentVersion'

    AgreementName:
      type: string
      description: 'What a person agrees to on their account (plan 4e): the terms of use, or the testimony consent.'
      enum: [terms-of-use, testimony-consent]

    Agree:
      type: object
      description: 'Command `Agree`: the version the page fetched and showed, which must still be the latest.'
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0

    Agreement:
      type: object
      description: A version someone agreed to, and when (the database's time).
      required: [version, agreedAt]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        agreedAt:
          type: string
          format: date-time

    AgreementState:
      type: object
      description: |
        Where the person stands with one text they agree to (plan 4e). `agreed` is `null` until they first
        agree. `upToDate` is `agreed.version == latestVersion`: when it's `false` the page shows the redline
        from `agreed.version` (or the full text, if `null`) to the latest, and asks them to agree.
      required: [agreed, latestVersion, upToDate]
      additionalProperties: false
      properties:
        agreed:
          oneOf:
            - $ref: '#/components/schemas/Agreement'
            - type: 'null'
        latestVersion:
          type: integer
          minimum: 0
        upToDate:
          type: boolean

    SubmissionSettingsValues:
      type: object
      description: |
        Every submission limit (W3, D94, D112, D113), as `UpdateSubmissionSettings` takes them and
        `GET /v1/admin/submission-settings` returns them. Each must be within its `bounds`, and
        `storyTextMin` ≤ `storyTextMax`, `themesMin` ≤ `themesMax`.
      required:
        [
          storyTextMin,
          storyTextMax,
          themesMin,
          themesMax,
          openDraftsMax,
          submissionsPer7Days,
          uploadRequestsPerHour,
          uploadsPer7Days,
          videoMaxBytes,
          audioMaxBytes,
          mediaMaxSeconds,
        ]
      additionalProperties: false
      properties:
        storyTextMin:
          type: integer
          description: "A written story's text, trimmed, to submit (characters)."
        storyTextMax:
          type: integer
          description: "A written story's text at most (characters)."
        themesMin:
          type: integer
          description: 'Themes a story needs when it is submitted, at least (checked only then).'
        themesMax:
          type: integer
          description: 'Themes a story may have when it is submitted, at most (checked only then).'
        openDraftsMax:
          type: integer
          description: 'Open drafts per person.'
        submissionsPer7Days:
          type: integer
          description: 'Stories submitted for review per person in any rolling 7 days.'
        uploadRequestsPerHour:
          type: integer
          description: 'New uploads per person in any rolling hour.'
        uploadsPer7Days:
          type: integer
          description: 'New uploads per person in any rolling 7 days.'
        videoMaxBytes:
          type: integer
          description: 'One video file at most (bytes).'
        audioMaxBytes:
          type: integer
          description: 'One audio file at most (bytes).'
        mediaMaxSeconds:
          type: integer
          description: 'One recording at most (seconds).'

    AdminThemes:
      type: object
      description: |
        Every category and theme for /admin/themes (themes plan v3): categories A–Z with `other` last,
        themes A–Z, each with how many stories carry it (any status) for the Save summary. `version`
        goes back in `If-Match` when saving.
      required: [version, categories]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
          description: The themes' version (`0` before the first save).
        categories:
          type: array
          items:
            type: object
            required: [id, name, themes]
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              themes:
                type: array
                items:
                  type: object
                  required: [id, name, highlighted, storyCount]
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    highlighted:
                      type: boolean
                    storyCount:
                      type: integer
                      minimum: 0
                      description: Stories (any status) that carry the theme.

    SaveThemes:
      type: object
      description: |
        `SaveThemes`: the whole finished picture of the categories and their themes (themes plan v3,
        A1). A new category or theme has a temporary id starting `new-`; every other id must exist.
        Anything missing from the picture is deleted (a deleted theme comes off every story; a
        deleted category's remaining themes move to Other, not highlighted). `other` must be there,
        named "Other". Names are tidied (trimmed, single spaces, first character capitalised) and must
        be 1–40 characters and unique, ignoring case (themes among themes, categories among
        categories); otherwise `400` with a pointer to the name.
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, name, themes]
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              themes:
                type: array
                maxItems: 500
                items:
                  type: object
                  required: [id, name, highlighted]
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    highlighted:
                      type: boolean

    SettingBounds:
      type: object
      required: [min, max]
      additionalProperties: false
      properties:
        min:
          type: integer
        max:
          type: integer

    AdminSubmissionSettings:
      type: object
      required: [version, updatedAt, changedBy, settings, bounds]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        changedBy:
          type: [string, 'null']
          description: The user record id of the last admin who saved them (Clerk holds names, D16); `null` if only the migrator has.
        settings:
          $ref: '#/components/schemas/SubmissionSettingsValues'
        bounds:
          type: object
          description: What each limit may be set to, inclusive.
          required:
            [
              storyTextMin,
              storyTextMax,
              themesMin,
              themesMax,
              openDraftsMax,
              submissionsPer7Days,
              uploadRequestsPerHour,
              uploadsPer7Days,
              videoMaxBytes,
              audioMaxBytes,
              mediaMaxSeconds,
            ]
          additionalProperties: false
          properties:
            storyTextMin:
              $ref: '#/components/schemas/SettingBounds'
            storyTextMax:
              $ref: '#/components/schemas/SettingBounds'
            themesMin:
              $ref: '#/components/schemas/SettingBounds'
            themesMax:
              $ref: '#/components/schemas/SettingBounds'
            openDraftsMax:
              $ref: '#/components/schemas/SettingBounds'
            submissionsPer7Days:
              $ref: '#/components/schemas/SettingBounds'
            uploadRequestsPerHour:
              $ref: '#/components/schemas/SettingBounds'
            uploadsPer7Days:
              $ref: '#/components/schemas/SettingBounds'
            videoMaxBytes:
              $ref: '#/components/schemas/SettingBounds'
            audioMaxBytes:
              $ref: '#/components/schemas/SettingBounds'
            mediaMaxSeconds:
              $ref: '#/components/schemas/SettingBounds'

    PublishLegalDocument:
      type: object
      description: |
        Command `PublishLegalVersion` (plan 4e): the next version of one legal text, its Markdown as the admin
        wrote it, in force at once. The database keeps it for ever, unchanged.
      required: [version, content]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
          description: |
            The number it is saved as: one after the latest the admin edited ("Save as version N?"). `409
            document_changed` if another admin saved that number meanwhile.
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Markdown (headings, paragraphs, bold, italic, lists, links, tables; no HTML). Line ends are stored as `\n`.

    Account:
      type: object
      description: |
        The signed-in person's account bootstrap (M2), built from the verified Clerk token and the
        SurrealDB `user` record only, with no call to Clerk's servers: `id` and `createdAt` come from
        the record (created on the person's first call), `role` from the token's claim (D1). Email and
        name stay in Clerk and are edited in Clerk's own account panel (D16, D81). There are no
        notification settings in M2 (D81: no emails in M2, D79), so `notificationPrefs` is absent.
      required: [id, role, createdAt, termsOfUse, testimonyConsent]
      properties:
        id:
          type: string
        version:
          type: 'null'
          description: Always `null`; the account has no database version, so it takes no `If-Match`.
        role:
          $ref: '#/components/schemas/Role'
        notificationPrefs:
          type: object
          description: |
            Not sent in M2 (D81). Reserved for notification settings, which would live in Clerk
            `privateMetadata` (D16), never in SurrealDB.
          additionalProperties:
            type: boolean
        createdAt:
          type: string
          format: date-time
        termsOfUse:
          description: |
            Plan 4e: the terms of use (they say you must be 18 or over). Until `upToDate`, the site shows the
            terms (or what changed since the version agreed) and one box, "I am 18 or over and agree to the
            terms of use", before the account can be used: the database refuses the person's writes until
            then.
          $ref: '#/components/schemas/AgreementState'
        testimonyConsent:
          description: |
            Plan 4e: the testimony consent, which covers every story the person submits. `agreed` is `null`
            until their first story. When it isn't `upToDate` the person agrees again (with the redline)
            before starting or changing a story; their published stories stay up meanwhile.
          $ref: '#/components/schemas/AgreementState'

    AccountPatch:
      type: object
      description: JSON Merge Patch (RFC 7396), applied to Clerk `privateMetadata` through Clerk's Backend API.
      additionalProperties: false
      properties:
        notificationPrefs:
          type: object
          additionalProperties:
            type: boolean

    AccountExport:
      type: object
      description: |
        "Download my data" (Art 15, Art 20; M2 plan PR 12): everything we hold about the person, read in
        their own session, with their sign-in details from Clerk. Nothing about anyone else. Times are
        ISO 8601 in UTC. `about.sections` explains each part in plain words, keyed like the parts.
      additionalProperties: false
      required:
        [
          about,
          account,
          signIn,
          stories,
          agreements,
          favourites,
          limits,
          submissions,
          uploads,
          requestKeys,
        ]
      properties:
        about:
          type: object
          additionalProperties: false
          required:
            [
              format,
              formatVersion,
              generatedAt,
              linksExpireAt,
              summary,
              sections,
              notIncluded,
            ]
          properties:
            format:
              type: string
              const: he-is-real-my-data
            formatVersion:
              type: integer
              const: 1
            generatedAt:
              type: string
              format: date-time
            linksExpireAt:
              type: [string, 'null']
              format: date-time
              description: When every media link in the file stops working; `null` while signing is off.
            summary:
              type: string
            sections:
              type: object
              description: One plain explanation per part of the file, keyed by the part's name.
              additionalProperties:
                type: string
            notIncluded:
              type: array
              description: What we hold or do that this file leaves out, and why.
              items:
                type: string
        account:
          type: object
          additionalProperties: false
          required: [id, createdAt, role]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            role:
              $ref: '#/components/schemas/Role'
        signIn:
          type: object
          description: What Clerk, our sign-in provider, holds about the person (read now, never stored).
          additionalProperties: false
          required:
            [
              clerkUserId,
              firstName,
              lastName,
              username,
              emailAddresses,
              phoneNumbers,
              connectedAccounts,
              profileImageUrl,
              twoFactorEnabled,
              createdAt,
              lastSignInAt,
              lastActiveAt,
            ]
          properties:
            clerkUserId:
              type: string
            firstName:
              type: [string, 'null']
            lastName:
              type: [string, 'null']
            username:
              type: [string, 'null']
            emailAddresses:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [emailAddress, primary, verified]
                properties:
                  emailAddress:
                    type: string
                  primary:
                    type: boolean
                  verified:
                    type: boolean
            phoneNumbers:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [phoneNumber, primary, verified]
                properties:
                  phoneNumber:
                    type: string
                  primary:
                    type: boolean
                  verified:
                    type: boolean
            connectedAccounts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [provider, emailAddress]
                properties:
                  provider:
                    type: string
                  emailAddress:
                    type: [string, 'null']
            profileImageUrl:
              type: [string, 'null']
              description: The picture the person gave Clerk; `null` for none (Clerk's default avatar).
            twoFactorEnabled:
              type: boolean
            createdAt:
              type: [string, 'null']
              format: date-time
            lastSignInAt:
              type: [string, 'null']
              format: date-time
            lastActiveAt:
              type: [string, 'null']
              format: date-time
        stories:
          type: array
          description: Every story of the person's, in every status, newest first.
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                slug,
                status,
                onSiteNow,
                title,
                description,
                body,
                bylineName,
                primaryFormat,
                themes,
                media,
                image,
                rejectionFeedback,
                moderation,
                createdAt,
                updatedAt,
                submittedAt,
                approvedAt,
                publishedAt,
                draftExpiresAt,
                socialMediaSharingConsent,
              ]
            properties:
              id:
                type: string
              slug:
                type: string
              status:
                $ref: '#/components/schemas/StoryStatus'
              onSiteNow:
                type: boolean
              title:
                type: string
              description:
                type: string
              body:
                type: [string, 'null']
              bylineName:
                type: [string, 'null']
              primaryFormat:
                $ref: '#/components/schemas/Format'
              themes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
              media:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      format,
                      bunnyVideoId,
                      playbackUrl,
                      thumbnailUrl,
                      width,
                      height,
                      durationSeconds,
                      processing,
                    ]
                  properties:
                    format:
                      type: string
                      enum: [video, audio]
                    bunnyVideoId:
                      type: [string, 'null']
                    playbackUrl:
                      type: [string, 'null']
                      format: uri
                    thumbnailUrl:
                      type: [string, 'null']
                      format: uri
                    width:
                      type: [integer, 'null']
                    height:
                      type: [integer, 'null']
                    durationSeconds:
                      type: [integer, 'null']
                    processing:
                      type: [string, 'null']
              image:
                type: [object, 'null']
                additionalProperties: false
                required: [url, width, height, alt]
                properties:
                  url:
                    type: [string, 'null']
                    format: uri
                    description: |
                      A one-hour link to the picture as published; `null` while the story isn't on the site
                      (a draft's path is the person's own write, so it is never signed).
                  width:
                    type: integer
                  height:
                    type: integer
                  alt:
                    type: [string, 'null']
              rejectionFeedback:
                type: [string, 'null']
              moderation:
                type: array
                description: Each moderation decision on the story, oldest first; never who made it.
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [decision, feedbackToSubmitter, storyVersion, decidedAt]
                  properties:
                    decision:
                      type: string
                      enum: [approve, reject, request_changes, escalate]
                    feedbackToSubmitter:
                      type: [string, 'null']
                    storyVersion:
                      type: integer
                    decidedAt:
                      type: string
                      format: date-time
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              submittedAt:
                type: [string, 'null']
                format: date-time
              approvedAt:
                type: [string, 'null']
                format: date-time
              publishedAt:
                type: [string, 'null']
                format: date-time
              draftExpiresAt:
                type: [string, 'null']
                format: date-time
              socialMediaSharingConsent:
                oneOf:
                  - $ref: '#/components/schemas/Agreement'
                  - type: 'null'
        agreements:
          type: object
          description: |
            Plan 4e: the versions of the terms of use and the testimony consent the person agreed to, and when
            (`null`: not agreed). Each version's words are public at `/terms` and on api-public-read.
          additionalProperties: false
          required: [termsOfUse, testimonyConsent]
          properties:
            termsOfUse:
              oneOf:
                - $ref: '#/components/schemas/Agreement'
                - type: 'null'
            testimonyConsent:
              oneOf:
                - $ref: '#/components/schemas/Agreement'
                - type: 'null'
        favourites:
          type: array
          description: |
            The person's hearts, newest first: which story and when. The story is its author's, so only
            its public path while it is public now.
          items:
            type: object
            additionalProperties: false
            required: [storyId, heartedAt, publicPath]
            properties:
              storyId:
                type: string
              heartedAt:
                type: string
                format: date-time
              publicPath:
                type: [string, 'null']
                description: '`/stories/<slug>` on the site while the story is public; else `null`.'
        limits:
          type: object
          additionalProperties: false
          required: [trusted, overrides, overridesChangedAt, effective]
          properties:
            trusted:
              type: boolean
            overrides:
              type: [object, 'null']
              description: |
                An admin's limits for this person only (D112), each `null` where the setting applies;
                `null` when there's no row for them.
              additionalProperties: false
              required:
                [
                  openDraftsMax,
                  submissionsPer7Days,
                  uploadRequestsPerHour,
                  uploadsPer7Days,
                ]
              properties:
                openDraftsMax:
                  type: [integer, 'null']
                submissionsPer7Days:
                  type: [integer, 'null']
                uploadRequestsPerHour:
                  type: [integer, 'null']
                uploadsPer7Days:
                  type: [integer, 'null']
            overridesChangedAt:
              type: [string, 'null']
              format: date-time
            effective:
              type: object
              description: The limits that apply to the person now (`fn::limits::effective`; `null` = no limit).
              additionalProperties: false
              required:
                [
                  openDraftsMax,
                  submissionsPer7Days,
                  uploadRequestsPerHour,
                  uploadsPer7Days,
                  videoMaxBytes,
                  audioMaxBytes,
                  mediaMaxSeconds,
                ]
              properties:
                openDraftsMax:
                  type: [integer, 'null']
                submissionsPer7Days:
                  type: [integer, 'null']
                uploadRequestsPerHour:
                  type: [integer, 'null']
                uploadsPer7Days:
                  type: [integer, 'null']
                videoMaxBytes:
                  type: [integer, 'null']
                audioMaxBytes:
                  type: [integer, 'null']
                mediaMaxSeconds:
                  type: [integer, 'null']
        submissions:
          type: array
          description: When the person sent a story for review, in the last 7 days (D113), oldest first.
          items:
            type: object
            additionalProperties: false
            required: [at]
            properties:
              at:
                type: string
                format: date-time
        uploads:
          type: array
          description: |
            Each upload the person started (D80), oldest first: a video or audio file
            (`bunnyVideoId`) or a picture (M2 plan PR 10; `imagePath`, its file in the images
            storage zone). The other one is `null`.
          items:
            type: object
            additionalProperties: false
            required:
              [
                bunnyVideoId,
                imagePath,
                storyId,
                format,
                contentType,
                sizeBytes,
                durationSeconds,
                requestedAt,
                renewedAt,
              ]
            properties:
              bunnyVideoId:
                type: [string, 'null']
              imagePath:
                type: [string, 'null']
              storyId:
                type: string
              format:
                type: string
                enum: [video, audio, image]
              contentType:
                type: string
              sizeBytes:
                type: integer
              durationSeconds:
                type: [integer, 'null']
              requestedAt:
                type: string
                format: date-time
              renewedAt:
                type: [string, 'null']
                format: date-time
        requestKeys:
          type: array
          description: The idempotency keys of the person's recent commands (D29); each lasts 24 hours.
          items:
            type: object
            additionalProperties: false
            required: [key, status, expiresAt]
            properties:
              key:
                type: string
              status:
                type: integer
              expiresAt:
                type: string
                format: date-time

    UserAdmin:
      type: object
      description: Joins the `user` record with Clerk (fetched at read time, never stored, D16).
      properties:
        id:
          type: string
        clerkUserId:
          type: [string, 'null']
          description: '`null` for a legacy person without a Clerk account (D22).'
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        acceptedSubmissions:
          type: integer
        createdAt:
          type: string
          format: date-time
        gdprDeletedAt:
          type: [string, 'null']
          format: date-time

    Health:
      type: object
      required: [status, service, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: api-public-read
        db:
          type: string
          enum: [up, down]
