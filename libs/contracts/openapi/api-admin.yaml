openapi: 3.1.0
info:
  title: He Is Real Today — api-admin
  version: 1.0.0-draft
  description: |
    **Moderation and admin.** The moderation queue and decisions, flag triage, role assignment, tag
    curation, and the legal documents' versions (the privacy policy, D20's DPA, and the terms of use). Its own service and database login (D13, D33). No featured or
    pinned stories (Joel, 2026-10-23: unfair to everyone else).

    - Clerk JWT on every route, with a minimum role (`x-required-role`) checked on each one
      (Moderator for moderation; Admin / SuperAdmin for the rest). Called directly by the browser (D31).
      The role is the session token's `role` claim (Clerk `publicMetadata.role`, D1); below the minimum
      is `403` with code `role_required`. api-admin never creates `user` records (D13): a person
      without one (no api-user call yet) gets `403` with code `unknown_person`.
    - May read the story write model (moderation needs pending stories); public reads stay on
      `api-public-read`.
    - Every path is under `/v1` except `/health` (D30). Errors are RFC 9457 `application/problem+json`.
    - Commands return `{ id, version }` (D28); modifying commands need `If-Match` (`412`/`428`) (D29).
    - Queries return an `ETag` and `Cache-Control: private, no-store`.
    - `x-requires-consent` marks routes guarded by `@RequiresConsent` (D21); every other route carries
      `@NoConsentRequired(reason)` in code.
    - `x-milestone` on each operation is the delivery milestone that builds it.

    Conventions: `docs/api-conventions.md`.
  contact:
    name: He Is Real Today
    url: https://www.heisreal.today

servers:
  - url: https://{host}
    description: The service's generated Cloud Run URL this phase (D31); no custom domain yet.
    variables:
      host:
        default: api-admin.run.app
        description: '`api-admin-<hash>.europe-west2.run.app`'

security:
  - clerkBearer: []

tags:
  - name: Health
    description: 'Liveness and readiness.'
  - name: Moderation
    description: 'The queue, pick-up lock, decisions and flags.'
  - name: Admin
    description: 'Users and roles.'
  - name: Tags
    description: 'Tag taxonomy writes.'
  - name: LegalDocuments
    description: 'The privacy policy and terms of use: their numbered versions and publishing (D121, D125).'
  - name: SubmissionSettings
    description: 'The submission limits everyone submits under (W3, D94, D112, D113), adjusted at /admin/limits.'

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealthAdmin
      summary: Liveness and readiness probe
      description: Unversioned (D30).
      security: []
      x-milestone: M0
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Health'
        '503':
          $ref: './components.yaml#/components/responses/HealthDown'

  # ------------------------------------------------------------------ moderation
  /v1/moderation/queue:
    get:
      tags: [Moderation]
      operationId: getModerationQueue
      summary: Pending submissions, oldest first
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of the queue.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StoryModeration'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'

  /v1/moderation/stories/{id}:
    get:
      tags: [Moderation]
      operationId: getModerationStory
      summary: A story under moderation
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The story write model, with lock state and derived consent.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/StoryModeration'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'

  /v1/moderation/stories/{id}/lock:
    post:
      tags: [Moderation]
      operationId: lockStory
      summary: Pick up (lock) a story for review
      description: |
        Command. A transaction-guarded update; on a RocksDB optimistic-transaction conflict the handler
        retries. `409` if another moderator holds the lock.
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/stories/{id}/release:
    post:
      tags: [Moderation]
      operationId: releaseStory
      summary: Release my lock back to the queue
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/stories/{id}/approve:
    post:
      tags: [Moderation]
      operationId: approveStory
      summary: Approve and publish a story
      description: |
        Command `ApproveStory`. Re-checks the submitter's consent in the ledger at this moment, not just
        at submission (D21), then creates the `publicStory` row, a `moderationReview` and an `auditLog`
        entry in one transaction. The caller must hold the lock (`409`). The submitter is emailed after
        the commit (address fetched from Clerk, D16).

        Approval waits for processing (A2): every video, audio file and image must be `ready`, and a
        video must have its width, height and duration, an audio file its duration. Otherwise `409`
        with `code: media_not_ready` (the database refuses it; nothing is written or published).
      x-required-role: Moderator
      x-requires-consent:
        subject: submitter
        types: [special_category_religious, publish, age_18plus]
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ModerationFeedback'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/stories/{id}/reject:
    post:
      tags: [Moderation]
      operationId: rejectStory
      summary: Reject a story
      description: Command `RejectStory`. Feedback to the submitter is required. The caller must hold the lock.
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ModerationFeedbackRequired'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/stories/{id}/request-changes:
    post:
      tags: [Moderation]
      operationId: requestStoryChanges
      summary: Send a story back to its submitter for changes
      description: Command `RequestStoryChanges` (→ `changes_requested`). Feedback is required. The caller must hold the lock.
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ModerationFeedbackRequired'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/stories/{id}/escalate:
    post:
      tags: [Moderation]
      operationId: escalateStory
      summary: Escalate a story to a senior moderator
      description: Command `EscalateStory`. Optional internal note; nothing is sent to the submitter.
      x-required-role: Moderator
      x-milestone: M3
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/moderation/flags:
    get:
      tags: [Moderation]
      operationId: getFlags
      summary: Flagged stories, by trust-weighted concern
      x-required-role: Moderator
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of flagged stories.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/FlaggedStory'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'

  # ------------------------------------------------------------------ admin
  /v1/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List and search users
      description: Joins the `user` records with Clerk's Backend API; email and name are never stored (D16).
      x-required-role: Admin
      x-milestone: M5
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: role
          in: query
          schema:
            $ref: './components.yaml#/components/schemas/Role'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of users.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/UserAdmin'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'

  /v1/admin/users/{id}/assign-role:
    post:
      tags: [Admin]
      operationId: assignRole
      summary: Assign a user's role
      description: |
        Command `AssignRole`. Clerk is the source of truth for roles (D1): this writes Clerk
        `publicMetadata.role` and an `auditLog` entry. Clerk holds no version, so there is no
        `If-Match` and the result's `version` is `null`.
      x-required-role: SuperAdmin
      x-milestone: M3
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (opaque).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AssignRole'
      responses:
        '200':
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'

  # ------------------------------------------------------------------ tags
  /v1/tags:
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      description: |
        CRUD create. The slug is the ID (`tag:<slug>`), so a repeat returns `409` rather than creating a
        duplicate; no `Idempotency-Key` is needed. Tags are seeded by migration in M1.
      x-required-role: Admin
      x-milestone: M5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateTag'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'

  /v1/tags/{slug}:
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: Rename or recategorise a tag
      description: Stories link tags by reference and fetch them at read time (D15), so nothing else changes.
      x-required-role: Admin
      x-milestone: M5
      parameters:
        - $ref: './components.yaml#/components/parameters/tagSlug'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/TagPatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Delete an unused tag
      description: '`409` while any story still uses the tag.'
      x-required-role: Admin
      x-milestone: M5
      parameters:
        - $ref: './components.yaml#/components/parameters/tagSlug'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  # ------------------------------------------------------------------ legal documents (D121, D125)
  /v1/admin/legal-documents/{document}/versions:
    parameters:
      - name: document
        in: path
        required: true
        schema:
          $ref: './components.yaml#/components/schemas/LegalDocumentName'
    get:
      tags: [LegalDocuments]
      operationId: listAdminLegalDocumentVersions
      summary: Every published version of one legal document, with who published it
      description: 'Newest first. Read-only: no route edits or deletes a version.'
      x-required-role: Admin
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The versions, and the one in force with its Markdown.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AdminLegalDocumentVersionList'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    post:
      tags: [LegalDocuments]
      operationId: publishLegalDocument
      summary: Publish the next version of one legal document
      description: |
        Command `PublishLegalDocument` (D125). Writes the version (numbered by the database, the next one,
        in force at once) and an audit row with the admin, in one transaction. The first version of a
        document may be published here (`basedOn: null`). Creates with a natural key take no
        `Idempotency-Key` (D29): a `basedOn` that isn't the version in force now (another admin published
        meanwhile) is `409 document_changed`, and nothing is written.
      x-required-role: Admin
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/PublishLegalDocument'
      responses:
        '201':
          description: Published.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/PublishedLegalDocument'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/admin/submission-settings:
    get:
      tags: [SubmissionSettings]
      operationId: getSubmissionSettings
      summary: The submission limits in force, with what each may be set to
      description: |
        The one record `submissionSettings:current`. Its `version` is the strong `ETag`; send it back in
        `If-Match` to save.
      x-required-role: Admin
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The limits, their version and their bounds.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AdminSubmissionSettings'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    put:
      tags: [SubmissionSettings]
      operationId: updateSubmissionSettings
      summary: Save every submission limit
      description: |
        Command `UpdateSubmissionSettings`. The whole set, each within the bounds `GET` returns, each
        minimum at most its maximum (`400` with the field otherwise). Saved only at the version read
        (`412 stale_version` if someone saved since, including at the same moment; `428` without
        `If-Match`). The database writes an `UpdateSubmissionSettings` audit row naming the admin and
        their role. New values apply to everyone's next action, drafts already started included
        (no grandfathering, Joel 2026-10-30).
      x-required-role: Admin
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/SubmissionSettingsValues'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session JWT, sent by the browser. Required on every route except `/health`; the minimum role is per operation.
