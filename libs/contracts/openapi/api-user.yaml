openapi: 3.1.0
info:
  title: He Is Real Today — api-user
  version: 1.0.0-draft
  description: |
    **The signed-in person's own data** (D33, renamed from `api-write`): every read that needs to know
    who you are (D35) and every command a person can issue, plus signed inbound webhooks.

    - Clerk JWT on every route except `/health` and `/v1/webhooks/*` (which are signature-verified).
      Called directly by the browser with the Clerk token (D31); `web` never calls it (D32).
    - Personal reads and the person's commands run in a SurrealDB session **as that person**, opened
      with their Clerk token, so the database checks ownership (D27, D13).
    - The token must be a session token of the configured Clerk instance (RS256, `iss`, `exp`/`nbf`)
      minted for an allowed origin (`azp`), with the `role` claim (D1); anything else is `401`. A role
      below the operation's `x-required-role` is `403` with code `role_required`. The person's first
      call creates their `user` record (only `clerkUserId`, D16).
    - Every path is under `/v1` except `/health` (D30). Errors are RFC 9457 `application/problem+json`.
    - Commands return `{ id, version }` (D28): `201` + `Location` for creates, `202` for async work.
      Modifying commands need `If-Match` (`412`/`428`), except account settings, which live in Clerk
      (last write wins); non-idempotent POSTs need `Idempotency-Key` (`422` on reuse with a different
      body) (D29).
    - Queries return an `ETag` (weak for collections) and `Cache-Control: private, no-store`.
    - Editing or uploading to a draft needs the caller's Art 9 consent; creating a draft and submitting
      also need the sign-up form in force accepted (18+ is asked there only, D93) and no newer testimony
      version requiring acceptance for new submissions; submitting also needs `publish` (D21, plan task
      2.3). A grant counts on any published or retired version that has its statement: a new version
      never stops it counting or takes a story off the site (D93). Per account, through each story's
      submitter; no story stores a consent version (D85, D86).
    - `x-requires-consent` marks routes guarded by `@RequiresConsent` (D21); every other route carries
      `@NoConsentRequired(reason)` in code. `x-required-role` is the minimum Clerk role.
    - `x-milestone` on each operation is the delivery milestone that builds it.

    Conventions: `docs/api-conventions.md`.
  contact:
    name: He Is Real Today
    url: https://www.heisreal.today

servers:
  - url: https://{host}
    description: The service's generated Cloud Run URL this phase (D31); no custom domain yet.
    variables:
      host:
        default: api-user.run.app
        description: '`api-user-<hash>.europe-west2.run.app`'

security:
  - clerkBearer: []

tags:
  - name: Health
    description: 'Liveness and readiness.'
  - name: My stories
    description: "The person's own stories in any status, read as the person (D27)."
  - name: Submission
    description: 'Create a draft, upload media, submit, edit, withdraw.'
  - name: Account
    description: 'Account settings, erasure, favourites and the feed.'
  - name: Consent
    description: 'Explicit, versioned consent (GDPR Art 9): grant and withdraw.'
  - name: Community
    description: '"This helped me" and concerns.'
  - name: Webhooks
    description: 'Inbound from Clerk and Stripe. Signature-verified, no Clerk JWT.'

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealthUser
      summary: Liveness and readiness probe
      description: Unversioned (D30).
      security: []
      x-milestone: M0
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Health'
        '503':
          $ref: './components.yaml#/components/responses/HealthDown'

  # ------------------------------------------------------------------ personal queries (D27, D35)
  /v1/account/stories:
    get:
      tags: [My stories]
      operationId: listMyStories
      summary: My submissions, any status
      description: |
        Drafts, pending, feedback and approved, newest first (by creation), read as the person (D27).
        `status` narrows it to one status: the submit flow lists the person's open drafts
        (`?status=draft`) to continue one.
      x-required-role: User
      x-milestone: M2
      parameters:
        - name: status
          in: query
          schema:
            $ref: './components.yaml#/components/schemas/StoryStatus'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of my stories.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StoryMine'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/account/stories/{id}:
    get:
      tags: [My stories]
      operationId: getMyStory
      summary: One of my stories
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: My story. The strong `ETag` is its `version`, for the next `If-Match` (D29).
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/StoryMine'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'

  /v1/account/limits:
    get:
      tags: [Submission]
      operationId: getMySubmissionLimits
      summary: The limits that apply to me (for the submit page)
      description: |
        The text and theme limits an admin sets (W3: `submissionSettings`) and the person's own D94
        limits (the settings, or the admin's override for them; D112): open drafts (`max` null =
        unlimited, as for a trusted submitter) and how many they have, and submissions per rolling 7
        days with when they may next submit (`nextAvailableAt` null = now). The submit page shows
        these numbers; nothing is hard-coded. Read as the person; needs no consent.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: My limits.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SubmissionLimits'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: My account (the bootstrap after each sign-in)
      description: |
        Query `GetAccount`, the account bootstrap: web's header calls it once each time a page loads
        signed in. Built from the verified token and the database only, never Clerk's Backend API.
        The person's first call creates their `user` record (only `clerkUserId`, D16), which is also
        what lets staff use api-admin. Needs no consent: it is how the site learns whether the
        sign-up form still has to be accepted (`signupConsent`, D73), and whether a newer testimony form
        needs accepting before a new story (`testimonyConsent`, D85: the banner after sign-in).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: 'My account. `version` is `null`: the account has no database version.'
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/Account'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    patch:
      tags: [Account]
      operationId: updateAccount
      summary: Update my account settings
      description: |
        **Not built in M2** (D81): there are no notification settings until emails arrive (D79), and
        name and email are changed in Clerk's own account panel.

        CRUD with JSON Merge Patch. The settings live in Clerk `privateMetadata` (D16) and `api-user`
        writes them through Clerk's Backend API; nothing is stored in SurrealDB. Email, name and country
        are changed through Clerk's own components. **No `If-Match`** (a documented exception to D29):
        Clerk holds no version, and these are single-owner settings, so the last write wins. The
        result's `version` is `null`.
      x-required-role: User
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Settings saved.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
    delete:
      tags: [Account]
      operationId: eraseAccount
      summary: Erase my account (GDPR)
      description: |
        Command `EraseAccount`. Deletes the person's stories, `publicStory` rows, reviews, edges and
        Clerk user; the consent ledger is kept as proof without personal data. Continues asynchronously.
      x-required-role: User
      x-milestone: M2
      responses:
        '202':
          $ref: './components.yaml#/components/responses/Accepted'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/account/consents:
    get:
      tags: [Consent]
      operationId: getMyConsents
      summary: My consent state and history
      description: |
        The current state per type and the append-only ledger, read in the person's own session (D27).
        "Current" is the latest ledger event per type (D17, D18), with the form version it was given on
        (D84); `counts` says whether a grant counts. `signup` says whether the sign-up
        form in force is accepted (D73: sign-in waits for it); `testimony` is the account's testimony
        version against the one in force, for the "update your consent" banner (D85).
      x-required-role: User
      x-milestone: M0
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Consent state.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ConsentState'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
    post:
      tags: [Consent]
      operationId: grantConsent
      summary: Grant (or re-affirm) one statement of the consent form in force
      description: |
        Command `GrantConsent`: appends one `granted` event to the ledger, in the person's own session: one
        statement (box) ticked on the form version shown (D84). `formVersion` must be the version of that
        form in force (`GET /v1/legal/forms/{form}` on api-public-read); a draft, retired, older or unknown
        version answers `409 form_version_not_in_force` (the database refuses anything but a published
        version too), and a statement the version doesn't have answers `409 statement_not_on_form`. D122: the
        event binds the privacy policy in force (and, on a sign-up version with the terms box, the terms of
        use in force); a `privacyPolicyVersion` or `termsVersion` that isn't the one in force answers
        `409 legal_document_not_in_force`. While no form is published no consent can be given. Used at sign-up, at the start of a draft, at submit
        and for re-consent. No `If-Match`: the ledger is append-only, so there is nothing to conflict with.
      x-required-role: User
      x-milestone: M0
      parameters:
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/GrantConsent'
      responses:
        '201':
          description: Recorded. `id` is the ledger event; `version` is `null`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'

  /v1/account/consents/{type}/withdraw:
    post:
      tags: [Consent]
      operationId: withdrawConsent
      summary: Withdraw a consent (as easy as giving it, Art 7(3))
      description: |
        Command `WithdrawConsent`: appends a `withdrawn` event, bound to the form version and DPA of the event
        it follows. Applies
        to all the person's stories (D17): withdrawing `publish` or `special_category_religious` deletes their
        `publicStory` rows in the same transaction, and from then on the database refuses every further
        processing step that needs that consent. Withdrawing again re-affirms it; a type that was never
        granted answers `409`.

        **Staged:** withdrawing `special_category_religious` will also start erasure (D39), continuing
        asynchronously. That is built in M2 and must be wired before real testimonies are accepted; until
        then the person's stories stay stored, unpublished and unprocessable.
      x-required-role: User
      x-milestone: M0
      parameters:
        - $ref: './components.yaml#/components/parameters/consentType'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      responses:
        '202':
          $ref: './components.yaml#/components/responses/Accepted'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'

  /v1/account/favourites:
    get:
      tags: [Account]
      operationId: listMyFavourites
      summary: My favourite stories (my hearts), newest heart first
      description: |
        The stories the person has hearted, as cards, newest heart first, read in the person's own
        session (D27). Hearts are private: nobody else can read them, not even the story's owner.
        Cards come from `publicStory` (C15), so a story that has stopped being public (withdrawn,
        hidden, unpublished) isn't listed; its heart stays stored until the person removes it.

        **Which of these are my favourites?** With `storyId` (1 to 50 of them), the answer lists only
        the hearted, public stories among them, in the same shape, with `nextCursor: null`: one request
        fills in the hearts on a page of cards (D83: web's server never knows who is looking, so the
        browser asks). `storyId` can't be combined with `cursor` or `limit`.
      x-required-role: User
      x-milestone: M2
      parameters:
        - name: storyId
          in: query
          description: Only these stories (ids from `StorySummary.id`). Repeat the parameter for each.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 64
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StorySummary'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/favourites/{storyId}:
    put:
      tags: [Account]
      operationId: addFavourite
      summary: Heart a story (add it to my favourites)
      description: |
        Idempotent relationship (CRUD, D28): hearting a story already hearted changes nothing. Only a
        story that is public now (`404` otherwise). Needs the sign-up form's consent, "store my account
        and favourites" and 18+ (D73; `403 consent_required`: send the person to the sign-up consent
        step). No `If-Match` (D29: nothing to overwrite).
      x-required-role: User
      x-requires-consent:
        subject: caller
        types: [account_data, age_18plus]
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Hearted.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    delete:
      tags: [Account]
      operationId: removeFavourite
      summary: Remove a heart
      description: |
        Idempotent: removing a heart that isn't there changes nothing. Works for any story, public or
        not, and needs no consent (removing data is always possible).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Removed (or wasn't a favourite).
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/helped/{storyId}:
    put:
      tags: [Community]
      operationId: markHelped
      summary: '"This helped me"'
      description: |
        Idempotent relationship (D28, naming rules). Feeds the hidden, trust-weighted quality signal;
        never shown as a public count.
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
    delete:
      tags: [Community]
      operationId: unmarkHelped
      summary: Undo "This helped me"
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Removed (or wasn't set).
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/feed:
    get:
      tags: [Account]
      operationId: getMyFeed
      summary: '"New for you" feed'
      description: Unseen stories for the person (needs "seen" tracking, M2 tasks 2.2/2.6).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StorySummary'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/tags:
    get:
      tags: [Submission]
      operationId: listStoryTags
      summary: Every tag a story can carry (for the submit form)
      description: |
        Every tag, by category (theme, journey, emotion) then name, for choosing a story's themes
        (how many: `GET /v1/account/limits`).
        Unlike api-public-read's `/v1/tags` (only tags a published story uses, D63), this lists them all.
        Read as the person (D27); needs no consent (tags aren't personal data).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Every tag (a few dozen at most, so unpaged).
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/Tag'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  # ------------------------------------------------------------------ the person's commands
  /v1/stories:
    post:
      tags: [Submission]
      operationId: createDraftStory
      summary: Create a draft story (before any upload)
      description: |
        Command `CreateDraftStory`, in the person's own session. The draft exists before any media
        upload, so an abandoned upload leaves recoverable context. `Location` is the story under
        `/v1/account/stories/{id}`. A draft is testimony content, so the person's current Art 9
        consent is checked first (`403` without it; plan task 2.3), with the sign-up form in force
        accepted and no newer testimony version requiring acceptance (D93).

        **Limits (D94, W3, D112):** open drafts per person (default 3: the admin's setting, or their
        override for this person; none for a trusted submitter); one more answers `409`
        `draft_limit_reached`. Text longer, or more themes, than the settings allow answers `400`
        (`/body`, `/tagSlugs`); so do unknown tags. The database enforces all of these too.
      x-required-role: User
      x-requires-consent:
        subject: caller
        types: [special_category_religious]
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateDraftStory'
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}:
    patch:
      tags: [Submission]
      operationId: editStory
      summary: Edit my story (draft or changes_requested only)
      description: |
        CRUD with JSON Merge Patch on the editable fields; never the status (D28). The database locks
        the content once the story leaves `draft`/`changes_requested` (`409` `story_locked`). Needs
        the person's current Art 9 consent (`403`). A stale `If-Match` answers `412`: the client
        re-reads, re-applies its change when nothing it touched has changed, and asks the person only
        on a real clash (D70). An edit that makes the text longer, or adds themes, beyond the settings'
        maximum (W3) answers `400` (`/body`, `/tagSlugs`); one that trims a draft that's still over a
        newly lowered maximum is accepted, so it can be fixed (Joel, 2026-10-30). Unknown tags answer
        `400` (`/tagSlugs`). Answers `ETag` with the new version. Also accepts
        `application/json`.
      x-required-role: User
      x-requires-consent:
        subject: caller
        types: [special_category_religious]
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/StoryPatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}/upload-url:
    post:
      tags: [Submission]
      operationId: requestUploadUrl
      summary: Get a short-lived direct-upload target for my draft
      description: |
        Command `RequestUpload`. The documented exception to "commands return `{ id, version }`": it also
        returns short-lived Bunny Stream TUS credentials. The client uploads straight to Bunny.net.
        Needs the person's current Art 9 consent (`403`).
      x-required-role: User
      x-requires-consent:
        subject: caller
        types: [special_category_religious]
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload target.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/UploadTarget'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/stories/{id}/submit:
    post:
      tags: [Submission]
      operationId: submitStory
      summary: Submit my draft for moderation
      description: |
        Command `SubmitStory`: moves `draft`/`changes_requested` → `pending` and publishes
        `story-submitted` for the worker tier. Needs the person's current Art 9, publish and age consent
        (D17); `403` if any is missing or withdrawn. A written story needs the settings' minimum of
        text (W3: default 200 characters, not counting leading and trailing spaces); shorter is `400`
        with `code: story_text_too_short` and an `errors` entry for `/body`. The database refuses it too.
        Every story needs the settings' number of themes (default 1–5; `400` `tags_required`,
        `/tagSlugs`). Every limit in force applies at submit, whatever the limits were when the draft
        was started (Joel, 2026-10-30: no grandfathering): longer than the text maximum is `400`
        `story_text_too_long`, more themes than the maximum `400` `too_many_tags`, each with the
        `limit` and a message that says it, so the person can edit the draft and submit.

        **Limit (D94, D112, D113):** stories submitted for review per rolling 7 days (default 1: the
        admin's setting, or their override for this person; none for a trusted submitter), counted
        from each story's first submission and kept for 7 days whatever happens to the story
        (withdrawing or deleting it doesn't free the week; sending a story back after "changes
        requested" isn't a new one). Otherwise `409` `weekly_submission_limit_reached` with
        `availableAt`. The database enforces it too. A story that isn't a draft (or `changes_requested`) answers `409`
        `story_not_submittable`. Publishing `story-submitted` to the worker tier waits for the
        async lane (plan PR 9); nothing is published yet.
      x-required-role: User
      x-requires-consent:
        subject: caller
        types: [special_category_religious, publish, age_18plus]
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/SubmitStory'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}/withdraw:
    post:
      tags: [Submission]
      operationId: withdrawStory
      summary: Withdraw my story
      description: Command `WithdrawStory`. Deletes its `publicStory` row in the same transaction.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/stories/{id}/concerns:
    post:
      tags: [Community]
      operationId: raiseConcern
      summary: Raise a concern about a published story
      description: Creates a `concern`; may put the story back in front of moderators (api-admin's flag queue).
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateConcern'
      responses:
        '201':
          description: Concern recorded. Concerns aren't readable by their author, so there is no `Location`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'

  # ------------------------------------------------------------------ webhooks
  /v1/webhooks/clerk:
    post:
      tags: [Webhooks]
      operationId: clerkWebhook
      summary: Clerk events (user.created, user.updated, user.deleted)
      description: |
        Verified with the Svix signature headers, not a Clerk JWT. Deduplicated on `svix-id` in the
        `idempotencyKey` table (D29): a redelivered event is acknowledged without being applied again.
      security: []
      x-milestone: M2
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Clerk event payload.
      responses:
        '204':
          description: Acknowledged (including duplicates).
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'

  /v1/webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: stripeWebhook
      summary: Stripe events (donations)
      description: Verified with `Stripe-Signature`. Deduplicated on `event.id` (D29).
      security: []
      x-milestone: M4
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload.
      responses:
        '204':
          description: Acknowledged (including duplicates).
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session JWT, sent by the browser. Required on every route except `/health` and webhooks.
