openapi: 3.1.0
info:
  title: He Is Real Today — api-user
  version: 1.0.0-draft
  description: |
    **The signed-in person's own data** (D33, renamed from `api-write`): every read that needs to know
    who you are (D35) and every command a person can issue, plus signed inbound webhooks.

    - Clerk JWT on every route except `/health` and `/v1/webhooks/*` (which are signature-verified).
      Called directly by the browser with the Clerk token (D31); `web` never calls it (D32).
    - Personal reads and the person's commands run in a SurrealDB session **as that person**, opened
      with their Clerk token, so the database checks ownership (D27, D13).
    - The token must be a session token of the configured Clerk instance (RS256, `iss`, `exp`/`nbf`)
      minted for an allowed origin (`azp`), with the `role` claim (D1); anything else is `401`. A role
      below the operation's `x-required-role` is `403` with code `role_required`. The person's first
      call creates their `user` record (only `clerkUserId`, D16).
    - Every path is under `/v1` except `/health` (D30). Errors are RFC 9457 `application/problem+json`.
    - Commands return `{ id, version }` (D28): `201` + `Location` for creates, `202` for async work.
      Modifying commands need `If-Match` (`412`/`428`), except account settings, which live in Clerk
      (last write wins); non-idempotent POSTs need `Idempotency-Key` (`422` on reuse with a different
      body) (D29).
    - Queries return an `ETag` (weak for collections) and `Cache-Control: private, no-store`.
    - **Agree first (plan 4e; Joel, 2026-11-01):** the database refuses the person's own writes until
      they have agreed to the latest terms of use (`403` `terms_agreement_required`), and their story
      writes (create, edit, upload, submit) until they have also agreed to the latest testimony consent
      (`403` `testimony_consent_required`). The page then shows what changed (a redline) and asks again
      (`POST /v1/account/agreements/{agreement}`). Removing data (deleting a story or a heart,
      withdrawing a story, deleting the account) never needs either. `x-required-role` is the minimum
      Clerk role.
    - `x-milestone` on each operation is the delivery milestone that builds it.

    Conventions: `docs/api-conventions.md`.
  contact:
    name: He Is Real Today
    url: https://www.heisreal.today

servers:
  - url: https://{host}
    description: The service's generated Cloud Run URL this phase (D31); no custom domain yet.
    variables:
      host:
        default: api-user.run.app
        description: '`api-user-<hash>.europe-west2.run.app`'

security:
  - clerkBearer: []

tags:
  - name: Health
    description: 'Liveness and readiness.'
  - name: My stories
    description: "The person's own stories in any status, read as the person (D27)."
  - name: Submission
    description: 'Create a draft, upload media, submit, edit, withdraw.'
  - name: Account
    description: 'Account settings, erasure, favourites and the feed.'
  - name: Agreements
    description: 'The terms of use and the testimony consent the person agrees to (plan 4e).'
  - name: Community
    description: '"This helped me" and concerns.'
  - name: Webhooks
    description: 'Inbound from Clerk and Stripe. Signature-verified, no Clerk JWT.'

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealthUser
      summary: Liveness and readiness probe
      description: Unversioned (D30).
      security: []
      x-milestone: M0
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Health'
        '503':
          $ref: './components.yaml#/components/responses/HealthDown'

  # ------------------------------------------------------------------ personal queries (D27, D35)
  /v1/account/stories:
    get:
      tags: [My stories]
      operationId: listMyStories
      summary: My submissions, any status
      description: |
        Drafts, pending, feedback and approved, newest first (by creation), read as the person (D27).
        `status` narrows it to one status: the submit flow lists the person's open drafts
        (`?status=draft`) to continue one. Each draft carries `draftExpiresAt`, when it will be
        deleted if nobody touches it (the profile shows it, R5).
      x-required-role: User
      x-milestone: M2
      parameters:
        - name: status
          in: query
          schema:
            $ref: './components.yaml#/components/schemas/StoryStatus'
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of my stories.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StoryMine'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/account/stories/{id}:
    get:
      tags: [My stories]
      operationId: getMyStory
      summary: One of my stories
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: |
            My story. The strong `ETag` is its `version`, for the next `If-Match` (D29). With a picture,
            api-user checks whether its file arrived (`image.uploaded`); never `304` while it hasn't.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/StoryMine'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'

  /v1/account/limits:
    get:
      tags: [Submission]
      operationId: getMySubmissionLimits
      summary: The limits that apply to me (for the submit page)
      description: |
        The text and theme limits an admin sets (W3: `submissionSettings`) and the person's own D94
        limits (the settings, or the admin's override for them; D112): open drafts (`max` null =
        unlimited, as for a trusted submitter) and how many they have, and submissions per rolling 7
        days with when they may next submit (`nextAvailableAt` null = now). How many submissions and
        video or audio uploads they made in the last 7 days (`usedIn7Days`), so the share page can say
        how many they have left before they reach the limit. The submit page shows these numbers;
        nothing is hard-coded. Read as the person; needs no agreement.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: My limits.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SubmissionLimits'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: My account (the bootstrap after each sign-in)
      description: |
        Query `GetAccount`, the account bootstrap: web's header calls it once each time a page loads
        signed in. Built from the verified token and the database only, never Clerk's Backend API.
        The person's first call creates their `user` record (only `clerkUserId`, D16), which is also
        what lets staff use api-admin. Needs no agreement: it is how the site learns whether the person
        must agree to the terms of use before using the account (`termsOfUse`), and whether a newer
        testimony consent needs agreeing before their next story (`testimonyConsent`; plan 4e).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: 'My account. `version` is `null`: the account has no database version.'
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/Account'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    patch:
      tags: [Account]
      operationId: updateAccount
      summary: Update my account settings
      description: |
        **Not built in M2** (D81): there are no notification settings until emails arrive (D79), and
        name and email are changed in Clerk's own account panel.

        CRUD with JSON Merge Patch. The settings live in Clerk `privateMetadata` (D16) and `api-user`
        writes them through Clerk's Backend API; nothing is stored in SurrealDB. Email, name and country
        are changed through Clerk's own components. **No `If-Match`** (a documented exception to D29):
        Clerk holds no version, and these are single-owner settings, so the last write wins. The
        result's `version` is `null`.
      x-required-role: User
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Settings saved.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
    delete:
      tags: [Account]
      operationId: eraseAccount
      summary: Erase my account (GDPR)
      description: |
        Command `EraseAccount` ("Delete my account", D39, D82). On api-user's own login, in one
        transaction: the person's stories (with their `publicStory` rows, reviews and others' hearts),
        their own hearts, limits, upload grants and idempotency keys go; the user record becomes a stub
        without the Clerk id, and a fingerprint of the Clerk id is kept so no token can recreate the
        account (D82). This is also how a person withdraws all consent (plan 4e): the user row's
        agreements go with it, and nothing kept (the tombstone, the audit row) records consent.
        Then the person's videos and pictures at Bunny and their Clerk account are deleted (D40); one
        that fails is retried later. `202` once the database half has committed; afterwards the
        person's token gets `401`. No `If-Match` or `Idempotency-Key` (a listed exception to D29): a
        repeat finds nothing to erase.
      x-required-role: User
      x-milestone: M2
      responses:
        '202':
          description: Erased; the deletions at Bunny and Clerk continue. No body.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/export:
    get:
      tags: [Account]
      operationId: exportMyData
      summary: Download my data (GDPR Art 15 and Art 20)
      description: |
        Query `ExportMyData`, the profile's **Download my data** (M2 plan PR 12): everything we hold about
        the signed-in person, as one JSON file that explains each part (`about.sections`) and what it
        leaves out (`about.notIncluded`). Synchronous: the data is small.

        - Read in the person's own database session (D27), so the database shows them their own rows
          and nobody else's: their `user` row, every story in every status with its text, themes and
          media, the moderation outcomes on their own stories (the decision, its feedback and when;
          never the moderator, whose field only api-admin can read), the versions of the terms of use
          and the testimony consent they agreed to and when (and, per story, the social media sharing
          consent), their hearts (only which story and when, and the story's public path
          while it's public; never another person's words), their submission limits, submission log,
          upload grants and recent idempotency keys.
        - Their sign-in details (names, email addresses, phone numbers, connected accounts) come from
          Clerk's Backend API at the time of the request (D16, D81: the data download is one of the
          three server jobs that may use Clerk's secret key); nothing from Clerk is stored.
        - **Media never passes through our servers.** Each video or audio item carries its Bunny
          Stream id and a signed player link, and each published picture a signed link (never a draft's
          path, which is the person's own write), valid for one hour
          (`about.linksExpireAt`; `null` links while media signing is off). We keep no original upload
          and no downloadable file of a video (Bunny's settings), so the player is how to watch it.
        - The audit log (ids only, D38) isn't included; `about.notIncluded` says so.

        No `ETag`: every copy is new, with fresh links. `Content-Disposition` names the file. Needs no
        agreement: access to your own data is always possible (Art 15). `503` `export_unavailable` when
        Clerk can't be reached: we send the whole file or nothing.
      x-required-role: User
      x-milestone: M2
      responses:
        '200':
          description: My data.
          headers:
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
            Content-Disposition:
              description: '`attachment; filename="he-is-real-my-data-<YYYY-MM-DD>.json"`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AccountExport'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '503':
          description: |
            `export_unavailable`: the sign-in details couldn't be read from Clerk just now. Try again in
            a moment.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/agreements/{agreement}:
    post:
      tags: [Agreements]
      operationId: agree
      summary: Agree to the latest version of the terms of use or the testimony consent
      description: |
        Command `Agree` (plan 4e), in the person's own session: points their `user.termsOfUse` or
        `user.testimonyConsent` at `version`, the version the page fetched and showed
        (`GET /v1/legal/documents/{document}` on api-public-read), with the database's time. The database
        accepts it only if that version is still the latest: if a newer one was saved meanwhile the answer
        is `409` `agreement_version_changed`, and the page fetches the latest and shows what changed (the
        redline) instead of sending the old one again. Agreements only move forward and are never
        withdrawn here: deleting the account withdraws them (Art 7(3)).

        Sign-up is one box, "I am 18 or over and agree to the terms of use" (`terms-of-use`); the
        testimony consent (`testimony-consent`) is agreed before the first story and again when a newer
        version is out, and covers every story the person submits. Agreeing to the version already agreed
        changes nothing and answers the same. No `If-Match` or `Idempotency-Key` (a listed exception to
        D29): the command is idempotent, and the version is the precondition.
      x-required-role: User
      x-milestone: M2
      parameters:
        - name: agreement
          in: path
          required: true
          schema:
            $ref: './components.yaml#/components/schemas/AgreementName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/Agree'
      responses:
        '200':
          description: Agreed (or already agreed to that version).
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AgreementState'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '409':
          description: |
            `agreement_version_changed`: `version` isn't the latest (a newer version was saved since the
            page fetched it, or it never existed). Fetch the latest, show what changed, and ask again.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/favourites:
    get:
      tags: [Account]
      operationId: listMyFavourites
      summary: My favourite stories (my hearts), newest heart first
      description: |
        The stories the person has hearted, as cards, newest heart first, read in the person's own
        session (D27). Hearts are private: nobody else can read them, not even the story's owner.
        Cards come from `publicStory` (C15), so a story that has stopped being public (withdrawn,
        hidden, unpublished) isn't listed; its heart stays stored until the person removes it.

        **Which of these are my favourites?** With `storyId` (1 to 50 of them), the answer lists only
        the hearted, public stories among them, in the same shape, with `nextCursor: null`: one request
        fills in the hearts on a page of cards (D83: web's server never knows who is looking, so the
        browser asks). `storyId` can't be combined with `cursor` or `limit`.
      x-required-role: User
      x-milestone: M2
      parameters:
        - name: storyId
          in: query
          description: Only these stories (ids from `StorySummary.id`). Repeat the parameter for each.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 64
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StorySummary'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/favourites/{storyId}:
    put:
      tags: [Account]
      operationId: addFavourite
      summary: Heart a story (add it to my favourites)
      description: |
        Idempotent relationship (CRUD, D28): hearting a story already hearted changes nothing. Only a
        story that is public now (`404` otherwise). Needs the latest terms of use agreed (`403`
        `terms_agreement_required`: the page keeps the heart on the device and asks the person to agree;
        plan 4e). No `If-Match` (D29: nothing to overwrite).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Hearted.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
    delete:
      tags: [Account]
      operationId: removeFavourite
      summary: Remove a heart
      description: |
        Idempotent: removing a heart that isn't there changes nothing. Works for any story, public or
        not, and needs no agreement (removing data is always possible).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Removed (or wasn't a favourite).
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/account/helped/{storyId}:
    put:
      tags: [Community]
      operationId: markHelped
      summary: '"This helped me"'
      description: |
        Idempotent relationship (D28, naming rules). Feeds the hidden, trust-weighted quality signal;
        never shown as a public count.
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
    delete:
      tags: [Community]
      operationId: unmarkHelped
      summary: Undo "This helped me"
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyIdRelation'
      responses:
        '204':
          description: Removed (or wasn't set).
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/feed:
    get:
      tags: [Account]
      operationId: getMyFeed
      summary: '"New for you" feed'
      description: Unseen stories for the person (needs "seen" tracking, M2 tasks 2.2/2.6).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StorySummary'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'

  /v1/themes:
    get:
      tags: [Submission]
      operationId: listStoryThemes
      summary: Every theme a story can carry (for the share form)
      description: |
        Every category and its themes, highlighted or not (themes plan v3): categories A–Z with Other
        last, themes A–Z; a category without themes is left out. The share form shows each
        category's highlighted themes first and the rest under "More themes" (how many to choose:
        `GET /v1/account/limits`). Unlike api-public-read's `/v1/themes`, which lists a theme that
        isn't highlighted only once a published story uses it, this lists them all. Read as the
        person (D27); needs no agreement (themes aren't personal data).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Every category with themes (a few dozen themes at most, so unpaged).
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/ThemeCategory'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  # ------------------------------------------------------------------ the person's commands
  /v1/stories:
    post:
      tags: [Submission]
      operationId: createDraftStory
      summary: Create a draft story (before any upload)
      description: |
        Command `CreateDraftStory`, in the person's own session. The draft exists before any media
        upload, so an abandoned upload leaves recoverable context. `Location` is the story under
        `/v1/account/stories/{id}`. A draft is testimony content, so the database first checks that the
        person has agreed to the latest terms of use and testimony consent (`403`
        `terms_agreement_required` / `testimony_consent_required`; plan 4e): nothing is stored before.

        **Limits (D94, W3, D112):** open drafts per person (default 3: the admin's setting, or their
        override for this person; none for a trusted submitter); one more answers `409`
        `draft_limit_reached`. Text longer than the settings allow answers `400` (`/body`); a theme
        that doesn't exist answers `400` `themes_changed` (`/themeIds`: "Themes have changed, please
        choose again"). The number of themes is checked only at submit. The database enforces these too.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateDraftStory'
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              $ref: './components.yaml#/components/headers/Location'
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}:
    patch:
      tags: [Submission]
      operationId: editStory
      summary: Edit my story (draft or changes_requested only)
      description: |
        CRUD with JSON Merge Patch on the editable fields; never the status (D28). The database locks
        the content once the story leaves `draft`/`changes_requested` (`409` `story_locked`). Needs
        the latest terms of use and testimony consent agreed (`403`, plan 4e). A stale `If-Match` answers `412`: the client
        re-reads, re-applies its change when nothing it touched has changed, and asks the person only
        on a real clash (D70). An edit that makes the text longer beyond the settings' maximum (W3)
        answers `400` (`/body`); one that trims a draft that's still over a newly lowered maximum is
        accepted, so it can be fixed (Joel, 2026-10-30). A theme that doesn't exist answers `400`
        `themes_changed` (`/themeIds`). Answers `ETag` with the new version. Also accepts
        `application/json`.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './components.yaml#/components/schemas/StoryPatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

    delete:
      tags: [Submission]
      operationId: deleteStory
      summary: Delete my draft, changes-requested, withdrawn or rejected story
      description: |
        Command `DeleteStory` (D71): the person deletes their own story while it's a `draft`,
        `changes_requested` (R8: sent back for changes, no need to withdraw it first), `withdrawn`
        or `rejected`, in their own session (D27). It goes everywhere in the same
        transaction: the story, its `publicStory` and `hiddenStory` rows, its moderation reviews and
        other people's hearts on it. The database's story permission refuses any other status
        (`pending`, `in_review`, `approved`: `409 story_not_deletable`, withdraw it first) and anyone else's story (`404`, as if it didn't exist). Needs no agreement (Art 17).

        Its video or audio at Bunny is deleted straight after the database commits: only the videos
        api-user made for this story (its upload grants, D80), never seeded or shared media. If Bunny
        can't be reached the video is left as an orphan for the clean-up sweep (media-runbook.md);
        the answer is still `204`. Its upload grants stay, so the upload limits still count them for
        7 days (D113). A retry after a lost answer gets `404`: it's gone.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/stories/{id}/upload-url:
    post:
      tags: [Submission]
      operationId: requestUploadUrl
      summary: Get a short-lived direct-upload target for my draft
      description: |
        Command `RequestUpload` (M2 plan PR 7; D65, D80). The documented exception to "commands
        return `{ id, version }`": it also returns short-lived Bunny Stream TUS credentials, and the
        client uploads straight to Bunny.net. Needs the latest terms of use and testimony consent agreed
        (`403`, plan 4e).

        api-user checks the story is the caller's, still editable (`409` `story_locked`) and at
        `If-Match` (`412`), and that it's a story of that format (`400`). Then, unless `resume`: it
        creates a video at Bunny (titled with the story id only, D69), records an upload grant on
        its own login and, in the same database write, makes it the draft's one video or audio
        file (the story's version steps once); the draft's previous file is deleted at Bunny at
        once. The browser never names a video, and the link binds only that one.

        **Limits (D113; admin settings, `SubmissionLimits.uploads`):** the file's size and length
        (`400` `validation_failed`, `/fileSizeBytes` or `/durationSeconds`), and new uploads per
        rolling hour and 7 days (`409` `upload_limit_reached` with `availableAt`); a trusted
        submitter has only the hourly one, and the ceilings for size and length. The database
        enforces them too. `503` `uploads_unavailable` when uploads are off.

        **Idempotency-Key (D29):** a new file's grant counts against those limits, so a retry
        after a lost answer must send the same key (and the same `If-Match` and body): it replays
        the same video and version, counting nothing new, even once the story has moved on. The
        same key with another body is `422`. If api-user loses the database's answer itself, it
        looks the key up again; `503` `upload_outcome_unknown` when it still can't tell, and the
        same key then settles it. A `resume` writes nothing and stores no key.

        **Images (M2 plan PR 10; D53, D65, D80):** `format: image` on any story: a written story's
        image, an audio story's picture or a video's own thumbnail (Joel, 2026-10-30). api-user picks
        the path, `stories/<story id>/<random>.webp`, and records an upload grant whose event puts it
        on the draft with its size and description, in the same write (the story's version steps
        once); then it returns a presigned `PUT` (`provider: bunny_s3`) binding that path, the type
        and the exact size. The size, pixel bounds and shape are checked by api-user and again by the
        database (`400`); a description is never required. `expectedImage` must be the story's
        picture now (`409` `image_changed` otherwise, checked again in the grant's write): a picture
        another tab put on or took off is never replaced by a request made for the one before. An
        image counts towards the hourly upload limit only, never the 7-day one (Joel, 2026-10-30).
        The previous image's file is not deleted: an approved story's public copy may still show
        it, so the clean-up sweep removes it later. `503` `uploads_unavailable` when image uploads
        are off.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload target.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/UploadTarget'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}/submit:
    post:
      tags: [Submission]
      operationId: submitStory
      summary: Submit my draft for moderation
      description: |
        Command `SubmitStory`: moves `draft`/`changes_requested` → `pending` and publishes
        `story-submitted` for the worker tier. Needs the latest terms of use and testimony consent agreed
        (`403` `terms_agreement_required` / `testimony_consent_required`, plan 4e); the testimony
        consent covers publishing every story the person submits. A written story needs the settings' minimum of
        text (W3: default 200 characters, not counting leading and trailing spaces); shorter is `400`
        with `code: story_text_too_short` and an `errors` entry for `/body`. The database refuses it too.
        Every story needs from themesMin to themesMax themes (default 1–5; otherwise `400`
        `theme_count`, `/themeIds`, "Choose 1–5 themes"), checked only here (themes plan v3); a theme
        deleted since it was chosen answers `400` `themes_changed` ("Themes have changed, please choose
        again"). Every limit in force applies at submit, whatever the limits were when the draft was
        started (Joel, 2026-10-30: no grandfathering): longer than the text maximum is `400`
        `story_text_too_long` with the `limit` and a message that says it, so the person can edit the
        draft and submit.

        **Limit (D94, D112, D113):** stories submitted for review per rolling 7 days (default 1: the
        admin's setting, or their override for this person; none for a trusted submitter), counted
        from each story's first submission and kept for 7 days whatever happens to the story
        (withdrawing or deleting it doesn't free the week; sending a story back after "changes
        requested" isn't a new one). Otherwise `409` `weekly_submission_limit_reached` with
        `availableAt`. The database enforces it too. A story that isn't a draft (or `changes_requested`) answers `409`
        `story_not_submittable`. Publishing `story-submitted` to the worker tier waits for the
        async lane (plan PR 9); nothing is published yet.

        **Video and audio (M2 plan PR 7):** no body: the story's file is the one its last
        `/upload-url` put on it (D80; `mediaRef` is gone). api-user asks Bunny whether it arrived:
        `409` `media_not_uploaded` until it has (or after a failed upload), `409`
        `media_processing` until Bunny has read the file's length, `409` `media_failed` if Bunny
        couldn't read it, and `409` `media_over_limit` if it's bigger or longer than the
        limits in force now (D113; "new rules apply to everyone", Joel 2026-10-30), from the
        size the browser declared and Bunny's own length. `503` `uploads_unavailable` when api-user
        can't reach Bunny's settings.

        **A picture (M2 plan PR 10), on any type:** api-user checks its file arrived in the images
        zone: `400` `image_not_uploaded` if it never did (the person adds it again, or removes it),
        `503` `uploads_unavailable` when the zone gives no clear answer.

        **Social media sharing (plan 4e):** the optional body's `socialMediaSharingConsent` is the box at
        the end of the upload, ticked, with the version the page showed: it is recorded on this story in
        the same write as the submission, with the database's time (both or neither; a replay records
        nothing again). A version that isn't the latest any more is `409` `agreement_version_changed` and
        nothing is submitted. It can't be withdrawn: withdrawing or deleting the story stops any future
        use. The same key with another body is `422`.
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/SubmitStory'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{id}/withdraw:
    post:
      tags: [Submission]
      operationId: withdrawStory
      summary: Withdraw my story
      description: |
        Command `WithdrawStory`: a story waiting for review, in review, sent back for changes or
        published becomes `withdrawn`, in the person's own session (D27). Its `publicStory` row is
        deleted in the same transaction, so it's gone from the site on the next request (D51). Its
        content is untouched and it needs no agreement. Anything else (a draft: delete it instead; a
        rejected or already withdrawn story) answers `409 story_not_withdrawable`. A withdrawn story
        stays withdrawn: publishing it again comes with M3's moderation (D61). Then it can be
        deleted (`DELETE /v1/stories/{id}`).
      x-required-role: User
      x-milestone: M2
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/CommandApplied'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '412':
          $ref: './components.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'

  /v1/stories/{id}/concerns:
    post:
      tags: [Community]
      operationId: raiseConcern
      summary: Raise a concern about a published story
      description: Creates a `concern`; may put the story back in front of moderators (api-admin's flag queue).
      x-required-role: User
      x-milestone: M6
      parameters:
        - $ref: './components.yaml#/components/parameters/storyId'
        - $ref: './components.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateConcern'
      responses:
        '201':
          description: Concern recorded. Concerns aren't readable by their author, so there is no `Location`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/CommandResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/IdempotencyKeyReused'

  # ------------------------------------------------------------------ webhooks
  /v1/webhooks/clerk:
    post:
      tags: [Webhooks]
      operationId: clerkWebhook
      summary: Clerk events (user.deleted erases the person)
      description: |
        Verified with the Svix signature headers over the raw body (5 minutes' tolerance), not a Clerk
        JWT; a bad signature answers `400`. `user.deleted` erases the person exactly as
        `DELETE /v1/account` does, without deleting them at Clerk again (D39); every other event is
        acknowledged and ignored (nothing from Clerk is stored, D16). Deduplicated on `svix-id` in the
        `idempotencyKey` table (D29): a redelivered event is acknowledged without being applied again.
        `503` until the endpoint's signing secret is set (Svix retries).
      security: []
      x-milestone: M2
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Clerk event payload.
      responses:
        '204':
          description: Acknowledged (including duplicates, and events other than `user.deleted`).
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: stripeWebhook
      summary: Stripe events (donations)
      description: Verified with `Stripe-Signature`. Deduplicated on `event.id` (D29).
      security: []
      x-milestone: M4
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload.
      responses:
        '204':
          description: Acknowledged (including duplicates).
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session JWT, sent by the browser. Required on every route except `/health` and webhooks.
