openapi: 3.1.0
info:
  title: He Is Real Today — api-public-read
  version: 1.0.0-draft
  description: |
    **Anonymous public queries only** (D33, D35). No authentication, no personal reads: anything that
    needs to know who you are is on `api-user`. Reads only read models and reference data
    (`publicStory`, `tag`, published `dpaVersion` and consent form versions, D26, D84), through a database
    login that sees nothing else (D13). Scales on its own.

    - Called by the browser, and server-side by `web` to prerender pages (D32).
    - Every path is under `/v1` except `/health` (D30). Errors are RFC 9457 `application/problem+json`.
    - Queries return an `ETag` and `Cache-Control: no-store` (D51); shared caching (`public, max-age=60,
      stale-while-revalidate=300`) only when turned on for Go live (D56).
    - Public stories are addressed by slug; an old slug answers `301` (D30).
    - Cursor pagination (`?limit=&cursor=` → `{ data, nextCursor }`), no totals, no engagement metrics.
    - `x-milestone` on each operation is the delivery milestone that builds it.

    Conventions: `docs/api-conventions.md`.
  contact:
    name: He Is Real Today
    url: https://www.heisreal.today

servers:
  - url: https://{host}
    description: The service's generated Cloud Run URL this phase (D31); no custom domain yet.
    variables:
      host:
        default: api-public-read.run.app
        description: '`api-public-read-<hash>.europe-west2.run.app`'

# Anonymous only: no operation accepts credentials.
security: []

tags:
  - name: Health
    description: 'Liveness and readiness.'
  - name: Stories
    description: 'Published stories, read from `publicStory`.'
  - name: Tags
    description: 'The tag taxonomy.'
  - name: Legal
    description: 'The legal documents (privacy policy, terms of use) with their numbered versions, and the consent forms.'
  - name: Site
    description: 'Media that is part of the site itself, not stories.'

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealthPublicRead
      summary: Liveness and readiness probe
      description: Unversioned (D30).
      x-milestone: M0
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Health'
        '503':
          $ref: './components.yaml#/components/responses/HealthDown'

  /v1/stories:
    get:
      tags: [Stories]
      operationId: browseStories
      summary: Browse and search published stories
      description: |
        Story cards for browse and home, newest first by default. Approved stories only (the
        `publicStory` read model, D26). Full-text search is `q` (BM25 on title, description and
        text; English stemming, any script). Keyset pages: `nextCursor` gives the next page and
        works only with the same `q`, `tag`, `format` and `sort` (any `limit`); a cursor used with
        others is `400 invalid_cursor`, and so is any changed cursor (every field is checked). Ties
        in the sort are broken by ID, so pages never overlap.
        Unknown or repeated parameters are `400`. No totals (D30). Browse loads at most two more
        pages on its own, then shows a button (D55).

        **Cards by id** (M2): with `id` (1 to 50, on its own), the cards of the stories among them
        that are public now, newest first, with `nextCursor: null`. web uses it for the hearts a
        signed-out person keeps on their device ("My favourites" without an account); it learns
        nothing about who asks.
      x-milestone: M1
      parameters:
        - name: id
          in: query
          description: Only these stories (`StorySummary.id`), on their own. Repeat it for each.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_]{1,64}$'
        - name: q
          in: query
          description: Full-text search, trimmed; blank = no search. At most 200 characters.
          schema:
            type: string
            maxLength: 200
        - name: tag
          in: query
          description: Tag ID (`Tag.id`, opaque). Repeat it for several; a story must have all of them. An unknown tag gives no stories.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              pattern: '^[A-Za-z0-9_]{1,64}$'
        - name: format
          in: query
          description: Only stories of this format.
          schema:
            $ref: './components.yaml#/components/schemas/Format'
        - name: sort
          in: query
          description: Default `relevance` with `q`, otherwise `latest`. `relevance` needs `q`.
          schema:
            type: string
            enum: [latest, oldest, relevance]
        - $ref: './components.yaml#/components/parameters/limit'
        - $ref: './components.yaml#/components/parameters/cursor'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/StorySummary'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{slug}:
    get:
      tags: [Stories]
      operationId: getStoryBySlug
      summary: Get a published story by slug
      description: |
        The one route built in M0 (task 0.9). A previous slug returns `301` to the current one; an
        unknown or malformed slug is `404` with code `story_not_found`. Media and image URLs are
        signed and expire (D52, M1 step 5): see `MediaPlayback`. They expire at least 6 hours after the
        response, rounded up to the hour, so the body (and its ETag) changes at most once an hour.
      x-milestone: M0
      parameters:
        - $ref: './components.yaml#/components/parameters/storySlug'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Public story detail.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/RepresentationETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/StoryPublic'
        '301':
          $ref: './components.yaml#/components/responses/MovedToCurrentSlug'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/stories/{slug}/related:
    get:
      tags: [Stories]
      operationId: getRelatedStories
      summary: Related stories (shared tags)
      description: |
        Three cards for the story page's sidebar: the published stories sharing the most tags,
        then the newest. Never the story itself; filled with the newest stories when few share a
        tag. A previous slug answers `301` to the current one's `/related`. Takes no query
        parameters (`400`).
      x-milestone: M1
      parameters:
        - $ref: './components.yaml#/components/parameters/storySlug'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Related story cards.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 3
                    items:
                      $ref: './components.yaml#/components/schemas/StorySummary'
        '301':
          $ref: './components.yaml#/components/responses/MovedToCurrentSlug'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List the tags in use
      description: |
        Every tag at least one published story uses, by category (theme, journey, emotion) then
        name, and the main themes (`main`, O5) that browse shows first. A tag with no published story is left out, so
        none leads to an empty page; it comes back when a published story uses it (D63). No
        story counts (no totals in public responses, D30, D62). Takes no query parameters
        (`400`).
      x-milestone: M1
      parameters:
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The tags in use (a few dozen at most, so unpaged).
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                type: object
                required: [data, main]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/Tag'
                  main:
                    type: array
                    description: |
                      The main themes' IDs in priority order (O5, Joel 2026-10-31): the first
                      `mainThemesCount` an admin set at /admin/themes, leaving out any no published story
                      uses (D63, so each is also in `data`). Browse shows these first and every other theme
                      behind "More themes"; when it's empty (none set, or none used), every theme is behind
                      "More themes".
                    items:
                      type: string
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/legal/dpa:
    get:
      tags: [Legal]
      operationId: getDpa
      summary: The privacy document in force, with its words, and its published history
      description: |
        The privacy document ("DPA") a person reads before consenting, with its text as published (the
        database keeps a copy of `libs/legal/dpa/<id>.md`, kept in step by the migration, D84). Published
        standard versions only (D20); drafts are never visible here. Dev's placeholder version is served in
        dev only (D75). `history` lists every published version, newest first, without text.
      x-milestone: M2
      parameters:
        - name: version
          in: query
          description: A specific version ID (e.g. `v1`); omit for the one in force.
          schema:
            type: string
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The version in force (or the one asked for), and the published history.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                type: object
                required: [current, history]
                properties:
                  current:
                    $ref: './components.yaml#/components/schemas/DpaDocument'
                  history:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/DpaVersion'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/legal/forms/{form}:
    get:
      tags: [Legal]
      operationId: getConsentForm
      summary: The consent form in force, with its words and features
      description: |
        The version of a consent form a person ticks (D84): `signup` after Clerk's sign-up (D73), `testimony`
        at the start of a draft and at submit (D67), and the optional `social` (sharing beyond
        heisreal.today, D93) whenever the person chooses. Grants name this version (`POST /v1/account/consents`),
        so a client shows exactly this text and these statements. Published versions only (D20); dev's
        placeholder versions in dev only (D75).
      x-milestone: M2
      parameters:
        - name: form
          in: path
          required: true
          description: Which form.
          schema:
            $ref: './components.yaml#/components/schemas/ConsentForm'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The version in force.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ConsentFormVersion'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/legal/documents/{document}:
    get:
      tags: [Legal]
      operationId: getLegalDocument
      summary: A legal document in force, with its words, and every version
      description: |
        D121, D125: the privacy policy (`privacy`, the privacy document of D20 and D75) or the terms of use
        (`terms`). The version in force with the Markdown `/privacy` and `/terms` render, and every version
        that counts, newest first (their "Previous versions"). Dev's placeholders in dev only (D75).
      x-milestone: M2
      parameters:
        - name: document
          in: path
          required: true
          schema:
            $ref: './components.yaml#/components/schemas/LegalDocumentName'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The document.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/CollectionETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/LegalDocument'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/legal/documents/{document}/versions/{number}:
    get:
      tags: [Legal]
      operationId: getLegalDocumentVersion
      summary: One version of a legal document, with its words
      description: |
        D125: any version that counts, by its number, with its Markdown (`/privacy/versions/{number}`,
        `/terms/versions/{number}`): versions are kept for ever, so a person can read what they agreed to.
      x-milestone: M2
      parameters:
        - name: document
          in: path
          required: true
          schema:
            $ref: './components.yaml#/components/schemas/LegalDocumentName'
        - name: number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The version.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/RepresentationETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/LegalDocumentVersionText'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'

  /v1/site-videos/{key}:
    get:
      tags: [Site]
      operationId: getSiteVideo
      summary: A signed player link for a site video
      description: |
        A signed, expiring Bunny player link (D52) for one of the site's own videos, by key: the founder's
        introduction on About and the founder's video on Next Steps. Only the listed keys; a key with no video set in this environment, or with
        media signing off, is `404` (the page then shows its placeholder). Takes no query parameters (`400`).
      x-milestone: M2
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: './components.yaml#/components/schemas/SiteVideoKey'
        - $ref: './components.yaml#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: The signed link and when it expires.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/RepresentationETag'
            Cache-Control:
              $ref: './components.yaml#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SiteVideo'
        '304':
          $ref: './components.yaml#/components/responses/NotModified'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '5XX':
          $ref: './components.yaml#/components/responses/ServerError'
