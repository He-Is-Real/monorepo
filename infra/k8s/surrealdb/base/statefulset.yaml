# Single-node SurrealDB on RocksDB with a persistent disk (Option A in
# project/context/research/surrealdb-kubernetes-options.html).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
spec:
  serviceName: surrealdb
  replicas: 1 # RocksDB is single-writer: never scale this above 1.
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
    spec:
      serviceAccountName: surrealdb
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60 # let RocksDB flush cleanly
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb
          args:
            - start
            - --log=info
            # Startup init (init.surql.tmpl): system users, service logins, removal of old
            # users. Runs on every start before the server answers anything, so a restart
            # with a new init is also the moment every older session ends (D13 B cutover).
            - --import-file=/init/init.surql
            - rocksdb:///data/surreal.db
          env:
            # Durability: fsync every commit before acknowledging it, so an
            # abrupt stop (Spot reclaim, crash) never loses confirmed writes.
            # This is SurrealDB's default; pinned so an upgrade can't change it.
            - name: SURREAL_DATASTORE_SYNC_DATA
              value: every
            # Creates the root user on first start only (ignored once a root user exists).
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: surrealdb-root
                  key: SURREAL_USER
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: surrealdb-root
                  key: SURREAL_PASS
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: init
              mountPath: /init
              readOnly: true
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
        # Readiness of the identities (D13 B): the pod is Ready only when the startup init
        # succeeded with the intended credentials (identity_check.py). SurrealDB serves even after
        # a failed import and /health doesn't tell, so this is what keeps a pod with wrong
        # identities out of DNS. The SurrealDB image has no shell or client that could run this
        # as an exec probe; this is the cloud-sdk image already pinned for backups (python3).
        - name: identity-check
          image: google/cloud-sdk
          command: [python3, /check/identity_check.py, --serve]
          env:
            - name: SURREAL_ENDPOINT
              value: http://127.0.0.1:8000
            - name: IDENTITY_CREDENTIALS
              value: /init/credentials.json
            - name: IDENTITY_EXPECTED_FILE
              value: /init/identity-hash # set by Terraform on GKE; absent locally
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          envFrom:
            - configMapRef:
                name: surrealdb-settings
          readinessProbe:
            exec:
              command: [python3, /check/identity_check.py]
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 1
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
            - name: check
              mountPath: /check
              readOnly: true
      volumes:
        - name: check
          configMap:
            name: surrealdb-identity-check
        # On GKE, Terraform points this at surrealdb-init-<identity hash> and puts the same hash
        # in a pod annotation: a new init config restarts the pod, which can only start once
        # External Secrets Operator has rendered that new Secret (never a stale one).
        - name: init
          secret:
            secretName: surrealdb-init
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
