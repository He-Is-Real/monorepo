# Headless service: gives the StatefulSet pod a stable DNS name
# (surrealdb.database.svc.cluster.local). Internal only - never exposed publicly.
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: surrealdb
  ports:
    - name: http
      port: 8000
      targetPort: http
