# One Kubernetes service account per workload, so each gets only the access it needs.
# The gke overlay annotates these for Workload Identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surrealdb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surrealdb-init
automountServiceAccountToken: false
---
# Needs a Google identity: uploads backups to Cloud Storage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surrealdb-backup
