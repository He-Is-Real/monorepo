# External Secrets Operator reads Secret Manager as the surrealdb-secrets
# service account (Workload Identity). Its Google service account needs
# roles/secretmanager.secretAccessor on the surreal-* secrets only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surrealdb-secrets
  annotations:
    iam.gke.io/gcp-service-account: SET_BY_KUSTOMIZE
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: SET_BY_KUSTOMIZE
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: surrealdb-secrets
          clusterProjectID: SET_BY_KUSTOMIZE
          clusterName: SET_BY_KUSTOMIZE
          clusterLocation: SET_BY_KUSTOMIZE
