# Syncs Secret Manager secrets into the Kubernetes Secrets the base manifests
# consume. Secret Manager stays the source of truth; refreshed hourly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-root
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURREAL_USER: root
        SURREAL_PASS: '{{ .root }}'
  data:
    - secretKey: root
      remoteRef:
        key: surreal-root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURREAL_USER: backup
        SURREAL_PASS: '{{ .backup }}'
  data:
    - secretKey: backup
      remoteRef:
        key: surreal-backup-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-migrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-migrator
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURREAL_USER: migrator
        SURREAL_PASS: '{{ .migrator }}'
  data:
    - secretKey: migrator
      remoteRef:
        key: surreal-migrator-password
---
# Renders base/init.surql.tmpl with the system users' and every service's password, for
# SurrealDB's startup init. Terraform applies a copy named after the identity config hash
# (surrealdb-init-<hash>, target Secret too), so a new config can't be served by a stale Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-init
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      # For the identity-check sidecar (statefulset.yaml): the same passwords, to prove the init
      # stored them. Terraform adds `identity-hash` (the expected identity config) on GKE.
      data:
        credentials.json: '{"migrator": {{ .migrator | toJson }}, "backup": {{ .backup | toJson }}, "services": {"api_public_read": {{ .api_public_read | toJson }}, "api_user": {{ .api_user | toJson }}, "api_admin": {{ .api_admin | toJson }}, "workflow": {{ .workflow | toJson }}}}'
      templateFrom:
        - configMap:
            name: surrealdb-init-template
            items:
              - key: init.surql
                templateAs: Values
  data:
    - secretKey: api_public_read
      remoteRef:
        key: surreal-api-public-read-password
    - secretKey: api_user
      remoteRef:
        key: surreal-api-user-password
    - secretKey: api_admin
      remoteRef:
        key: surreal-api-admin-password
    - secretKey: workflow
      remoteRef:
        key: surreal-workflow-password
    - secretKey: backup
      remoteRef:
        key: surreal-backup-password
    - secretKey: migrator
      remoteRef:
        key: surreal-migrator-password
