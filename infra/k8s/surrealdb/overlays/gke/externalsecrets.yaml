# Syncs Secret Manager secrets into the Kubernetes Secrets the base manifests
# consume. Secret Manager stays the source of truth; refreshed hourly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-root
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURREAL_USER: root
        SURREAL_PASS: '{{ .root }}'
  data:
    - secretKey: root
      remoteRef:
        key: surreal-root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURREAL_USER: backup
        SURREAL_PASS: '{{ .backup }}'
  data:
    - secretKey: backup
      remoteRef:
        key: surreal-backup-password
---
# Renders base/init.surql.tmpl with every service's password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surrealdb-init
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: surrealdb-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: surrealdb-init-template
            items:
              - key: init.surql
                templateAs: Values
  data:
    - secretKey: api_read
      remoteRef:
        key: surreal-api-read-password
    - secretKey: api_write
      remoteRef:
        key: surreal-api-write-password
    - secretKey: api_admin
      remoteRef:
        key: surreal-api-admin-password
    - secretKey: workflow
      remoteRef:
        key: surreal-workflow-password
    - secretKey: backup
      remoteRef:
        key: surreal-backup-password
    - secretKey: migrator
      remoteRef:
        key: surreal-migrator-password
