# Local Kubernetes (kind / k3d / minikube). Secrets are created beforehand by
# scripts/local-secrets.mjs from the *dev* GCP project using your gcloud login.
#   node infra/k8s/surrealdb/scripts/local-secrets.mjs --project heisreal-dev
#   kubectl apply -k infra/k8s/surrealdb/overlays/local
#   kubectl -n database port-forward svc/surrealdb 8000:8000
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - ../../base
patches:
  # No Cloud Storage or Workload Identity locally, so no backup CronJob.
  - target:
      kind: CronJob
      name: surrealdb-backup
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: surrealdb-backup
  - target:
      kind: StatefulSet
      name: surrealdb
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 100m
          memory: 256Mi
