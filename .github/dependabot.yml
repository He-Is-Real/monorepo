version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Matches the Node LTS runtime; bumped together with it by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      nx:
        patterns: ['nx', '@nx/*']
      nestjs:
        patterns: ['@nestjs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tools/docker
    schedule:
      interval: weekly
    ignore:
      # Node majors are chosen by hand: LTS only (24 now). Patches/minors still flow.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/live/dev/*
    schedule:
      interval: weekly
