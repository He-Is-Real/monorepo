name: OpenTofu apply

# Merge → plan every root unattended → one approval per wave with changes → apply exactly the
# saved plan (D54, D57). Never auto-applies: an approval in the `dev` environment means "I read
# this plan and choose to apply it" (self-approval is expected; Claude may approve dev applies).
#
# Correct by construction, no selection logic:
#   - One run at a time (one concurrency group, never cancelled in progress). GitHub keeps at
#     most one pending run and drops older pending ones; nothing is lost, because...
#   - ...every run plans every root (gcp, cluster, bunny, stripe; images only when dispatched
#     with `images`; never bootstrap, which is local-only). Unchanged roots plan "No changes"
#     and skip their apply.
#   - One target per run: `target` resolves main's HEAD once and every job checks out that SHA
#     ($GITHUB_SHA and workflow_run.head_sha are never used).
#   - Wave 1: gcp, bunny and stripe plan in parallel; one approval (approve-1) covers their
#     applies, and gcp applies after bunny (bunny grants gcp's services access to keys they
#     read). stripe (donations' Stripe sandbox objects) depends on nothing and nothing waits on it.
#     Wave 2: cluster (and images) plan after gcp's apply, against its fresh outputs; a second
#     approval (approve-2) only if they change.
#   - Superseded: if main moves while a run waits, its plan summaries say "reject this run",
#     and the approve jobs re-check main after the click and apply nothing (go=false). The
#     `superseded` job then warns and fails on purpose, so the run is red, not a green tick that
#     looks like a deploy.
#   - Failed, rejected, stale or superseded stops every later stage (tools/scripts/tf-stage.sh);
#     "no changes" and "not selected" stop nothing.
#   - Every plan is checked for locations outside the UK (D119's interim guard): `tf.sh <root>
#     plan` runs tools/scripts/tf-location-check.sh on the saved plan, and a plan that creates or
#     updates anything outside the UK exits 1, so it fails and never reaches an approval. For
#     bunny that happens inside the masked path, and the report (addresses and locations only)
#     goes to the private log with the rest.
#   - Every Release Images completion, success or failure, triggers a full run: it may replace
#     a pending push run in the queue, so it must plan everything too.
#   - "Dev behavioural tests" is dispatched once per deploy, after its final wave, and only by a
#     run that started after the target's Release Images succeeded (job `behavioural`).
#
# Recover from anything (a failed, rejected or superseded run): dispatch this workflow.
#
# Public repository: logs are world-readable. gcp, cluster and images plans hold no secrets and
# go to the log. Bunny output never does: the jobs mask the Bunny keys, keep raw output in
# gs://heisreal-dev-tfstate/dev/bunny/logs/ and publish only `tf.sh bunny plan-summary`. No
# Bunny plan is ever an artifact.
#
# Identities: tf-deployer (gcp, cluster, images, stripe) and tf-bunny (bunny) are available only to
# this file and tofu-drift.yml on main (deploy_gate and bunny_gate in modules/bootstrap).

on:
  # No paths filter: every new main gets a run, so a superseded run always has a successor.
  push:
    branches: [main]
  workflow_run:
    workflows: [Release Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      images:
        description: Also build and push snapshot images to apps-scratch (the images root)
        type: boolean
        default: false

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: tofu-apply
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail: any failing command fails the step

env:
  DEPLOYER: tf-deployer@heisreal-dev.iam.gserviceaccount.com
  TF_BUNNY: tf-bunny@heisreal-dev.iam.gserviceaccount.com
  # KMS-encrypted saved plans. tf-deployer can't reach dev/bunny/; tf-bunny can reach nothing
  # else. Unapproved plans expire after 7 days (lifecycle rules in modules/bootstrap/state.tf).
  PLANS: gs://heisreal-dev-tfstate/plans
  BUNNY_PLANS: gs://heisreal-dev-tfstate/dev/bunny/plans
  BUNNY_LOGS: gs://heisreal-dev-tfstate/dev/bunny/logs
  RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      actions: read # Release Images' run for the target
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - id: main
        run: |
          sha="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Target: main at \`$sha\` (event: $GITHUB_EVENT_NAME)" >> "$GITHUB_STEP_SUMMARY"
      # Whether the target's images exist before anything plans: gcp picks up the newest images,
      # so only a run that starts after the target's Release Images succeeded deploys them all
      # (`behavioural` below). Otherwise that completion triggers another run, which will.
      # Never blocks a deploy: if the lookup fails, the output is empty and no test is dispatched.
      - id: images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          images="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/images.yml/runs?head_sha=$SHA&per_page=10" \
            --jq '[.workflow_runs[] | if .status == "completed" then .conclusion else "pending" end]
                  | if index("success") then "success" else (.[0] // "pending") end')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Release Images for the target: $images" >> "$GITHUB_STEP_SUMMARY"

  # ---- Wave 1: gcp and bunny ----------------------------------------------------------------

  plan-gcp:
    needs: target
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      object: ${{ steps.plan.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: tools/scripts/tf.sh gcp init -input=false
      # Full refresh. Image entries set to "main" resolve to the newest image in apps at plan
      # time, so this picks up the newest release whatever triggered the run. changes: false on
      # exit 0, true on exit 2 (plan saved); anything else fails the job.
      - id: plan
        run: |
          code=0
          tools/scripts/tf.sh gcp plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color || code=$?
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          {
            echo "### dev/gcp at \`$SHA\`"
            [ "$main" = "$SHA" ] || echo "**⚠ superseded by $main: reject this run; the next run plans again.**"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
          0)
            echo changes=false >> "$GITHUB_OUTPUT"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
            ;;
          2)
            object="$PLANS/gcp/$RUN.tfplan"
            gcloud storage cp --no-user-output-enabled "$RUNNER_TEMP/tfplan" "$object"
            { echo changes=true; echo "object=$object"; } >> "$GITHUB_OUTPUT"
            { echo '```'; tools/scripts/tf.sh gcp plan-summary "$RUNNER_TEMP/tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo "plan failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          esac

  plan-bunny:
    needs: target
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-bunny)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      object: ${{ steps.plan.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.TF_BUNNY }}
      # Before any tofu step: every bunny-* secret is masked from here on.
      - run: tools/scripts/tf.sh bunny-mask secrets
      # init, mask the keys that exist only in state, then plan. All tofu output goes to the
      # private log; the public log and summary get only plan-summary, an exit code and the log's
      # name.
      - id: plan
        run: |
          log="$RUNNER_TEMP/bunny.log"
          code=0 step=init
          tools/scripts/tf.sh bunny init -input=false > "$log" 2>&1 || code=$?
          if [ "$code" -eq 0 ]; then
            step=mask
            tools/scripts/tf.sh bunny-mask state || code=$?
          fi
          if [ "$code" -eq 0 ]; then
            step=plan
            tools/scripts/tf.sh bunny plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color >> "$log" 2>&1 || code=$?
          fi
          gcloud storage cp --no-user-output-enabled "$log" "$BUNNY_LOGS/$RUN-plan-bunny.log" ||
            echo "::warning::could not copy the private log"
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          {
            echo "### dev/bunny at \`$SHA\`"
            [ "$main" = "$SHA" ] || echo "**⚠ superseded by $main: reject this run; the next run plans again.**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$step" = plan ] && [ "$code" -eq 0 ]; then
            echo changes=false >> "$GITHUB_OUTPUT"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$step" = plan ] && [ "$code" -eq 2 ]; then
            object="$BUNNY_PLANS/$RUN.tfplan"
            gcloud storage cp --no-user-output-enabled "$RUNNER_TEMP/tfplan" "$object"
            { echo changes=true; echo "object=$object"; } >> "$GITHUB_OUTPUT"
            { echo '```'; tools/scripts/tf.sh bunny plan-summary "$RUNNER_TEMP/tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$step failed (exit $code), log: $BUNNY_LOGS/$RUN-plan-bunny.log" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Stripe's sandbox (donations): the plan holds Stripe IDs and public URLs only. The API key is
  # read by the root itself, ephemerally; it's masked first in case an error ever quotes it.
  plan-stripe:
    needs: target
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      object: ${{ steps.plan.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: tools/scripts/tf.sh stripe-mask
      - run: tools/scripts/tf.sh stripe init -input=false
      - id: plan
        run: |
          code=0
          tools/scripts/tf.sh stripe plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color || code=$?
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          {
            echo "### dev/stripe at \`$SHA\`"
            [ "$main" = "$SHA" ] || echo "**⚠ superseded by $main: reject this run; the next run plans again.**"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
          0)
            echo changes=false >> "$GITHUB_OUTPUT"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
            ;;
          2)
            object="$PLANS/stripe/$RUN.tfplan"
            gcloud storage cp --no-user-output-enabled "$RUNNER_TEMP/tfplan" "$object"
            { echo changes=true; echo "object=$object"; } >> "$GITHUB_OUTPUT"
            { echo '```'; tools/scripts/tf.sh stripe plan-summary "$RUNNER_TEMP/tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo "plan failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          esac

  approve-1:
    needs: [target, plan-gcp, plan-bunny, plan-stripe]
    # always(): a failed plan on one side doesn't stop the other side's approval.
    if: >-
      always() && needs.target.result == 'success' &&
      ((needs.plan-gcp.result == 'success' && needs.plan-gcp.outputs.changes == 'true') ||
      (needs.plan-bunny.result == 'success' && needs.plan-bunny.outputs.changes == 'true') ||
      (needs.plan-stripe.result == 'success' && needs.plan-stripe.outputs.changes == 'true'))
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    environment: dev # pauses for approval: read the gcp, bunny and stripe plan summaries first
    permissions: {}
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          main="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$main" = "$SHA" ]; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Superseded::superseded by $main: not applying"
            echo "superseded by $main: not applying" >> "$GITHUB_STEP_SUMMARY"
            echo go=false >> "$GITHUB_OUTPUT"
          fi

  # After bunny (Codex, #117): gcp's services read keys the bunny root grants them access to
  # (e.g. api-user's link-signing keys), so a revision that needs a new grant must not start
  # before it exists. gcp applies once bunny applied, or had nothing to change; a failed or
  # cancelled bunny plan or apply holds gcp back (stage-gcp then blocks wave 2; dispatch to
  # recover).
  apply-gcp:
    needs: [target, plan-gcp, plan-bunny, approve-1, apply-bunny]
    if: >-
      always() && needs.plan-gcp.result == 'success' && needs.plan-gcp.outputs.changes == 'true' &&
      needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true' &&
      (needs.apply-bunny.result == 'success' ||
      (needs.apply-bunny.result == 'skipped' && needs.plan-bunny.result == 'success' &&
      needs.plan-bunny.outputs.changes == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    env:
      OBJECT: ${{ needs.plan-gcp.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      # Exactly the saved plan; OpenTofu refuses it if state changed meanwhile (stale).
      - run: |
          tools/scripts/tf.sh gcp init -input=false
          gcloud storage cp --no-user-output-enabled "$OBJECT" "$RUNNER_TEMP/tfplan"
          tools/scripts/tf.sh gcp apply -input=false -no-color "$RUNNER_TEMP/tfplan"
      # Only after a successful apply: a failed job keeps its plan so "Re-run failed jobs" works.
      # Unused plans expire through the bucket's 7-day lifecycle rule.
      - run: gcloud storage rm --no-user-output-enabled "$OBJECT" || true

  apply-bunny:
    needs: [target, plan-bunny, approve-1]
    if: >-
      always() && needs.plan-bunny.result == 'success' && needs.plan-bunny.outputs.changes == 'true' &&
      needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-bunny)
    env:
      SHA: ${{ needs.target.outputs.sha }}
      OBJECT: ${{ needs.plan-bunny.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.TF_BUNNY }}
      - run: tools/scripts/tf.sh bunny-mask secrets
      - run: |
          log="$RUNNER_TEMP/bunny.log"
          code=0 step=init
          tools/scripts/tf.sh bunny init -input=false > "$log" 2>&1 || code=$?
          if [ "$code" -eq 0 ]; then
            step=mask
            tools/scripts/tf.sh bunny-mask state || code=$?
          fi
          if [ "$code" -eq 0 ]; then
            step=download
            gcloud storage cp --no-user-output-enabled "$OBJECT" "$RUNNER_TEMP/tfplan" >> "$log" 2>&1 || code=$?
          fi
          if [ "$code" -eq 0 ]; then
            step=apply
            tools/scripts/tf.sh bunny apply -input=false -no-color "$RUNNER_TEMP/tfplan" >> "$log" 2>&1 || code=$?
          fi
          gcloud storage cp --no-user-output-enabled "$log" "$BUNNY_LOGS/$RUN-apply-bunny.log" ||
            echo "::warning::could not copy the private log"
          if [ "$code" -eq 0 ]; then
            echo "### dev/bunny applied at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$step failed (exit $code), log: $BUNNY_LOGS/$RUN-apply-bunny.log" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # Only after a successful apply: a failed job keeps its plan so "Re-run failed jobs" works.
      # Unused plans expire through the bucket's 7-day lifecycle rule.
      - run: gcloud storage rm --no-user-output-enabled "$OBJECT" || true

  apply-stripe:
    needs: [target, plan-stripe, approve-1]
    if: >-
      always() && needs.plan-stripe.result == 'success' && needs.plan-stripe.outputs.changes == 'true' &&
      needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    env:
      OBJECT: ${{ needs.plan-stripe.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: tools/scripts/tf.sh stripe-mask
      # Exactly the saved plan; OpenTofu refuses it if state changed meanwhile (stale).
      - run: |
          tools/scripts/tf.sh stripe init -input=false
          gcloud storage cp --no-user-output-enabled "$OBJECT" "$RUNNER_TEMP/tfplan"
          tools/scripts/tf.sh stripe apply -input=false -no-color "$RUNNER_TEMP/tfplan"
      # Only after a successful apply: a failed job keeps its plan so "Re-run failed jobs" works.
      # Unused plans expire through the bucket's 7-day lifecycle rule.
      - run: gcloud storage rm --no-user-output-enabled "$OBJECT" || true

  stage-gcp:
    needs: [target, plan-gcp, approve-1, apply-gcp]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      - id: stage
        env:
          PREV: "${{ needs.target.result == 'success' && 'ok' || 'blocked: target' }}"
          PLAN: ${{ needs.plan-gcp.result }}
          CHANGES: ${{ needs.plan-gcp.outputs.changes }}
          GO: ${{ needs.approve-1.outputs.go }}
          APPLY: ${{ needs.apply-gcp.result }}
        run: |
          result="$(tools/scripts/tf-stage.sh "$PREV" true "$PLAN" "$CHANGES" "$GO" "$APPLY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "gcp: $result" | tee -a "$GITHUB_STEP_SUMMARY"

  # Summary only: nothing waits on bunny.
  stage-bunny:
    needs: [target, plan-bunny, approve-1, apply-bunny]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      - id: stage
        env:
          PREV: "${{ needs.target.result == 'success' && 'ok' || 'blocked: target' }}"
          PLAN: ${{ needs.plan-bunny.result }}
          CHANGES: ${{ needs.plan-bunny.outputs.changes }}
          GO: ${{ needs.approve-1.outputs.go }}
          APPLY: ${{ needs.apply-bunny.result }}
        run: |
          result="$(tools/scripts/tf-stage.sh "$PREV" true "$PLAN" "$CHANGES" "$GO" "$APPLY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "bunny: $result" | tee -a "$GITHUB_STEP_SUMMARY"

  # Summary only: nothing waits on stripe.
  stage-stripe:
    needs: [target, plan-stripe, approve-1, apply-stripe]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      - id: stage
        env:
          PREV: "${{ needs.target.result == 'success' && 'ok' || 'blocked: target' }}"
          PLAN: ${{ needs.plan-stripe.result }}
          CHANGES: ${{ needs.plan-stripe.outputs.changes }}
          GO: ${{ needs.approve-1.outputs.go }}
          APPLY: ${{ needs.apply-stripe.result }}
        run: |
          result="$(tools/scripts/tf-stage.sh "$PREV" true "$PLAN" "$CHANGES" "$GO" "$APPLY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "stripe: $result" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---- Wave 2: cluster (and images), after gcp's apply ----------------------------------------
  # W1 = stage-gcp is ok AND approve-1 was skipped (nothing in wave 1 changed) or approved and
  # not superseded. stage-gcp alone isn't enough: it says ok on its no-changes branch even when
  # approve-1 was rejected for bunny.

  plan-cluster:
    needs: [target, stage-gcp, approve-1]
    if: >-
      always() && needs.stage-gcp.outputs.result == 'ok' &&
      (needs.approve-1.result == 'skipped' || (needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true'))
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      object: ${{ steps.plan.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: tools/scripts/tf.sh cluster init -input=false
      - id: plan
        run: |
          code=0
          tools/scripts/tf.sh cluster plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color || code=$?
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          {
            echo "### dev/cluster at \`$SHA\`"
            [ "$main" = "$SHA" ] || echo "**⚠ superseded by $main: reject this run; the next run plans again.**"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
          0)
            echo changes=false >> "$GITHUB_OUTPUT"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
            ;;
          2)
            object="$PLANS/cluster/$RUN.tfplan"
            gcloud storage cp --no-user-output-enabled "$RUNNER_TEMP/tfplan" "$object"
            { echo changes=true; echo "object=$object"; } >> "$GITHUB_OUTPUT"
            { echo '```'; tools/scripts/tf.sh cluster plan-summary "$RUNNER_TEMP/tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo "plan failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          esac

  # Snapshot images (apps-scratch), opt-in: planning builds every app and the apply pushes
  # development builds. Releases to apps stay with images.yml.
  plan-images:
    needs: [target, stage-gcp, approve-1]
    if: >-
      always() && needs.stage-gcp.outputs.result == 'ok' &&
      (needs.approve-1.result == 'skipped' || (needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true')) &&
      github.event_name == 'workflow_dispatch' && inputs.images
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      object: ${{ steps.plan.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built once: the apply untars this exact output (tar keeps .next, symlinks and modes,
      # which upload-artifact would drop) and checks each tag against the plan.
      # Every image service (tools/scripts/image-services.txt): the same list is archived here
      # and checked after the untar, so a new service can't be built but left out.
      - run: |
          services="$(tools/scripts/image-services.sh)"
          pnpm nx run-many -t prune -p $services
          tar -cpzf "$RUNNER_TEMP/images-dist.tgz" $(printf 'apps/%s/dist ' $services)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/images-dist.tgz
          retention-days: 7
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: tools/scripts/tf.sh images init -input=false
      - id: plan
        run: |
          code=0
          tools/scripts/tf.sh images plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color || code=$?
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          {
            echo "### dev/images at \`$SHA\`"
            [ "$main" = "$SHA" ] || echo "**⚠ superseded by $main: reject this run; the next run plans again.**"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
          0)
            echo changes=false >> "$GITHUB_OUTPUT"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
            ;;
          2)
            object="$PLANS/images/$RUN.tfplan"
            gcloud storage cp --no-user-output-enabled "$RUNNER_TEMP/tfplan" "$object"
            { echo changes=true; echo "object=$object"; } >> "$GITHUB_OUTPUT"
            { echo '```'; tools/scripts/tf.sh images plan-summary "$RUNNER_TEMP/tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo "plan failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          esac

  approve-2:
    needs: [target, stage-gcp, approve-1, plan-cluster, plan-images]
    # A skipped plan-images (not requested) has no `changes`, so only cluster counts then.
    if: >-
      always() && needs.stage-gcp.outputs.result == 'ok' &&
      (needs.approve-1.result == 'skipped' || (needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true')) &&
      ((needs.plan-cluster.result == 'success' && needs.plan-cluster.outputs.changes == 'true') ||
      (needs.plan-images.result == 'success' && needs.plan-images.outputs.changes == 'true'))
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.target.outputs.sha }}
    environment: dev # pauses for approval: read the cluster (and images) plan summaries first
    permissions: {}
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          main="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$main" = "$SHA" ]; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Superseded::superseded by $main: not applying"
            echo "superseded by $main: not applying" >> "$GITHUB_STEP_SUMMARY"
            echo go=false >> "$GITHUB_OUTPUT"
          fi

  apply-cluster:
    needs: [target, plan-cluster, approve-2]
    if: >-
      always() && needs.plan-cluster.result == 'success' && needs.plan-cluster.outputs.changes == 'true' &&
      needs.approve-2.result == 'success' && needs.approve-2.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    env:
      OBJECT: ${{ needs.plan-cluster.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: |
          tools/scripts/tf.sh cluster init -input=false
          gcloud storage cp --no-user-output-enabled "$OBJECT" "$RUNNER_TEMP/tfplan"
          tools/scripts/tf.sh cluster apply -input=false -no-color "$RUNNER_TEMP/tfplan"
      # Only after a successful apply: a failed job keeps its plan so "Re-run failed jobs" works.
      # Unused plans expire through the bucket's 7-day lifecycle rule.
      - run: gcloud storage rm --no-user-output-enabled "$OBJECT" || true

  apply-images:
    needs: [target, plan-images, approve-2]
    if: >-
      always() && needs.plan-images.result == 'success' && needs.plan-images.outputs.changes == 'true' &&
      needs.approve-2.result == 'success' && needs.approve-2.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    env:
      OBJECT: ${{ needs.plan-images.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      # The build output plan-images planned; no rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-dist-${{ github.run_id }}
          path: ${{ runner.temp }}
      - run: tar -xpzf "$RUNNER_TEMP/images-dist.tgz" -C "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/tofu
        with:
          service_account: ${{ env.DEPLOYER }}
      - run: |
          tools/scripts/tf.sh images init -input=false
          gcloud storage cp --no-user-output-enabled "$OBJECT" "$RUNNER_TEMP/tfplan"
          planned="$(tools/scripts/tf.sh images show -json "$RUNNER_TEMP/tfplan")"
          for svc in $(tools/scripts/image-services.sh); do
            want="$(jq -r --arg a "terraform_data.image[\"$svc\"]" \
              '.resource_changes[] | select(.address == $a) | .change.after.triggers_replace.tag' <<< "$planned")"
            got="$(tools/scripts/image-tag.sh "$svc")"
            [ "$got" = "$want" ] || { echo "::error::$svc: build output is $got, the plan has $want"; exit 1; }
          done
          tools/scripts/tf.sh images apply -input=false -no-color "$RUNNER_TEMP/tfplan"
      # Only after a successful apply: a failed job keeps its plan so "Re-run failed jobs" works.
      # Unused plans expire through the bucket's 7-day lifecycle rule.
      - run: gcloud storage rm --no-user-output-enabled "$OBJECT" || true

  stage-cluster:
    needs:
      [target, stage-gcp, approve-1, plan-cluster, approve-2, apply-cluster]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      - id: stage
        env:
          PREV: >-
            ${{ (needs.stage-gcp.outputs.result == 'ok' &&
            (needs.approve-1.result == 'skipped' || (needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true')))
            && 'ok' || 'blocked: wave 1' }}
          PLAN: ${{ needs.plan-cluster.result }}
          CHANGES: ${{ needs.plan-cluster.outputs.changes }}
          GO: ${{ needs.approve-2.outputs.go }}
          APPLY: ${{ needs.apply-cluster.result }}
        run: |
          result="$(tools/scripts/tf-stage.sh "$PREV" true "$PLAN" "$CHANGES" "$GO" "$APPLY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "cluster: $result" | tee -a "$GITHUB_STEP_SUMMARY"

  stage-images:
    needs: [target, stage-gcp, approve-1, plan-images, approve-2, apply-images]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      - id: stage
        env:
          PREV: >-
            ${{ (needs.stage-gcp.outputs.result == 'ok' &&
            (needs.approve-1.result == 'skipped' || (needs.approve-1.result == 'success' && needs.approve-1.outputs.go == 'true')))
            && 'ok' || 'blocked: wave 1' }}
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.images && 'true' || 'false' }}
          PLAN: ${{ needs.plan-images.result }}
          CHANGES: ${{ needs.plan-images.outputs.changes }}
          GO: ${{ needs.approve-2.outputs.go }}
          APPLY: ${{ needs.apply-images.result }}
        run: |
          result="$(tools/scripts/tf-stage.sh "$PREV" "$SELECTED" "$PLAN" "$CHANGES" "$GO" "$APPLY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "images: $result" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---- After a deploy: the dev behavioural suite (T3) -----------------------------------------
  # Once per deploy, after its final run (tools/scripts/tf-behavioural.sh). This job needs every
  # stage, so it starts only after the last wave; and it dispatches only when:
  #   - the target's Release Images had succeeded when this run started (`target`), so this run
  #     rolled out the target's images. A push run starts before them (#79: its cluster apply
  #     changed the schema while the old dev-seed image still ran, and the tests failed); the
  #     run their completion triggers is the final one;
  #   - every root's stage is ok (nothing failed, was rejected, went stale or was superseded, so
  #     no half-deployed dev);
  #   - something was applied: in this run, or in an earlier run since "Dev behavioural tests"
  #     last started (a push run's applies are tested by the run after Release Images).
  # Then dispatch "Dev behavioural tests": it resets dev to the dummy dataset and tests the real
  # site, the real API and real Bunny together. stripe isn't part of it: those tests never
  # reach Stripe, and web gets the Buy Button IDs from gcp. A dispatch, not a call: only a dispatched run on
  # main may sign in as ci-dev-seeder (dev_seed_gate in modules/bootstrap), so this needs no new
  # identity or secret. It queues behind any reset (concurrency `dev-data`).
  behavioural:
    needs:
      - target
      - apply-gcp
      - apply-bunny
      - apply-cluster
      - apply-images
      - stage-gcp
      - stage-bunny
      - stage-cluster
      - stage-images
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # list runs and jobs; dispatch dev-behavioural-tests.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      # Did an earlier run apply anything after "Dev behavioural tests" last started? Unsure (the
      # history can't be read back that far) counts as yes.
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending="$(tools/scripts/tf-pending.sh)"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "Applied by an earlier run since the tests last started: $pending" >> "$GITHUB_STEP_SUMMARY"
      - id: decide
        # One variable per value, passed as separate quoted arguments: a stage job that never
        # published its result gives an empty argument (not ok), never a shorter list.
        env:
          IMAGES: ${{ needs.target.outputs.images }}
          PENDING: ${{ steps.pending.outputs.pending }}
          STAGE_GCP: ${{ needs.stage-gcp.outputs.result }}
          STAGE_BUNNY: ${{ needs.stage-bunny.outputs.result }}
          STAGE_CLUSTER: ${{ needs.stage-cluster.outputs.result }}
          STAGE_IMAGES: ${{ needs.stage-images.outputs.result }}
          APPLY_GCP: ${{ needs.apply-gcp.result }}
          APPLY_BUNNY: ${{ needs.apply-bunny.result }}
          APPLY_CLUSTER: ${{ needs.apply-cluster.result }}
          APPLY_IMAGES: ${{ needs.apply-images.result }}
        run: |
          decision="$(tools/scripts/tf-behavioural.sh "${IMAGES:-}" "${PENDING:-}" \
            "${STAGE_GCP:-}" "${STAGE_BUNNY:-}" "${STAGE_CLUSTER:-}" "${STAGE_IMAGES:-}" -- \
            "${APPLY_GCP:-}" "${APPLY_BUNNY:-}" "${APPLY_CLUSTER:-}" "${APPLY_IMAGES:-}")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "Dev behavioural tests: $decision" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.decide.outputs.decision == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev-behavioural-tests.yml --repo "$GITHUB_REPOSITORY" --ref main

  # ---- Superseded after approval ---------------------------------------------------------------
  # Joel, 2026-10-23: a superseded run must not end green. A workflow can't set a neutral
  # conclusion (only Checks API check runs can), and cancelling itself would need actions: write
  # and cut the stage summaries short. So this last job warns, writes the summary line and fails.
  # Safe: protect-main requires only ci.yml's `main` check on pull requests; this workflow runs on
  # main and is never required, and the newer run starts as soon as this one ends.
  superseded:
    needs:
      - target
      - approve-1
      - approve-2
      - plan-gcp
      - plan-bunny
      - plan-stripe
      - plan-cluster
      - plan-images
      - apply-gcp
      - apply-bunny
      - apply-stripe
      - apply-cluster
      - apply-images
      - stage-gcp
      - stage-bunny
      - stage-stripe
      - stage-cluster
      - stage-images
    if: always() && (needs.approve-1.outputs.go == 'false' || needs.approve-2.outputs.go == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the newer run's number
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          sparse-checkout: tools/scripts
      # Each root's real results, so the summary says exactly what applied and what failed.
      - env:
          GH_TOKEN: ${{ github.token }}
          GCP: ${{ needs.plan-gcp.result }},${{ needs.plan-gcp.outputs.changes }},${{ needs.apply-gcp.result }}
          BUNNY: ${{ needs.plan-bunny.result }},${{ needs.plan-bunny.outputs.changes }},${{ needs.apply-bunny.result }}
          STRIPE: ${{ needs.plan-stripe.result }},${{ needs.plan-stripe.outputs.changes }},${{ needs.apply-stripe.result }}
          CLUSTER: ${{ needs.plan-cluster.result }},${{ needs.plan-cluster.outputs.changes }},${{ needs.apply-cluster.result }}
          IMAGES: ${{ needs.plan-images.result }},${{ needs.plan-images.outputs.changes }},${{ needs.apply-images.result }}
        run: |
          newer="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tofu-apply.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID)] | max_by(.run_number) | .run_number // empty" \
            2>/dev/null)" || newer=''
          {
            read -r message
            read -r advice
          } < <(tools/scripts/tf-superseded.sh "$newer" "gcp=$GCP" "bunny=$BUNNY" "stripe=$STRIPE" "cluster=$CLUSTER" "images=$IMAGES")
          echo "::warning title=Superseded::$message"
          {
            echo "### ⚠ $message"
            echo "$advice"
            echo 'This job fails on purpose so a superseded run is never green.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Failing on purpose: superseded, not deployed. $advice"
          exit 1
