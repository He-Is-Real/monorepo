name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CACHE_DIRECTORY: .nx/cache

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx build cache across runs (branch-scoped: PRs read main's cache, never write it).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ hashFiles('pnpm-lock.yaml') }}-

      # Base/head SHAs so `nx affected` only runs what a change touches.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint test build typecheck validate

      # Proves the Dockerfiles still build; pushing happens in _images.yml.
      - run: pnpm nx affected -t container

      - name: Validate Kubernetes manifests against schemas
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          for overlay in base overlays/local overlays/gke overlays/gke-dev; do
            kubectl kustomize "infra/k8s/surrealdb/${overlay}" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
