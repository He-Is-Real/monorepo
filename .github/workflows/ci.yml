name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  NX_CACHE_PATHS: |
    .nx/cache
    .nx/workspace-data/*.db
  # Keep in step with mise.toml. Checksum from the release's CHECKSUMS file.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # Keep in step with mise.toml (tf.sh refuses any other OpenTofu version).
  TOFU_VERSION: 1.13.2
  # Keep in step with mise.toml. From gitleaks_8.30.1_checksums.txt (read 2026-10-22).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Everything but the browser tests, which run beside it in shards (e2e-build, e2e).
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx build cache across runs: every run restores main's latest, only main
      # saves (so PR entries can't evict it). The cache index goes with it; no
      # lockfile hash in the key, as Nx already hashes dependency versions per
      # project. The nx-ci- prefix keeps it apart from _images.yml.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_PATHS }}
          key: nx-ci-${{ github.sha }}
          restore-keys: nx-ci-
      - run: tools/scripts/nx-cache-adopt.sh

      # Used by the surrealdb-k8s:validate target.
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Secret scanning with the default rules plus Bunny keys (.gitleaks.toml), which GitHub's
      # own scanning doesn't know. Also used by tools/scripts/tests/gitleaks-bunny.test.mjs.
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
      # The commits this PR or push adds. A new branch's first push has no `before`: last commit.
      - name: Scan new commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            range=-1
          else
            range="$BASE_SHA..$GITHUB_SHA"
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range"

      # Base/head SHAs so `nx affected` only runs what a change touches.
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - run: pnpm nx format:check
      # The WIF condition gating tf-cluster-planner (D42), against GitHub OIDC claim fixtures.
      - run: node --test infra/terraform/modules/bootstrap/tests/*.test.mjs
      # tf.sh (identities, refusals, Bunny redaction) against stub binaries; the gitleaks Bunny
      # rule; workflow permissions.
      - run: node --test tools/scripts/tests/*.test.mjs
      # For terraform:test: `tofu test` of every module with tests (D42, D48, D49, D52 and the
      # migration and identity hashes), offline with mock providers or plan-only runs, so it
      # blocks merges here rather than in tofu-plan.yml (not a required check). No sign-in.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: pnpm nx affected -t lint test build typecheck validate

      # Schema and permission tests against a real SurrealDB (libs/database). The target starts
      # the image pinned by tag + digest in infra/k8s/surrealdb/base/kustomization.yaml with
      # `docker run` (preinstalled on ubuntu-latest), so CI tests the version the cluster runs.
      # Not a `services:` container: those can't pass SurrealDB its `start` arguments.
      - run: pnpm nx affected -t test-integration

      # Proves the Dockerfiles still build; pushing happens in _images.yml.
      - run: pnpm nx affected -t container

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_PATHS }}
          key: nx-ci-${{ github.sha }}

  # Responsive and walking-skeleton checks (apps/web/e2e): the built site against a stub
  # api-public-read on Chromium, across the device matrix in light and dark. Only when web is
  # affected. This job builds the site once (web:prune, through the Nx cache) and hands it to the
  # shards below, so no shard builds.
  e2e-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      # Always web=true or web=false; an Nx error fails the job (and so `main`).
      - id: affected
        run: |
          projects=$(pnpm nx show projects --affected --withTarget=e2e; exit 137) # THROWAWAY
          if grep -qx web <<<"$projects"; then web=true; else web=false; fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
      # Restore only: `checks` builds web too and saves the cache on main.
      - if: steps.affected.outputs.web == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_PATHS }}
          key: nx-ci-${{ github.sha }}
          restore-keys: nx-ci-
      - if: steps.affected.outputs.web == 'true'
        run: tools/scripts/nx-cache-adopt.sh
      - if: steps.affected.outputs.web == 'true'
        run: pnpm nx run web:prune
      # One file: the standalone server is ~1,700 small files, and a tar keeps its symlinks.
      - if: steps.affected.outputs.web == 'true'
        run: tar -cf "$RUNNER_TEMP/web-dist.tar" -C apps/web dist
      - if: steps.affected.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist.tar
          if-no-files-found: error
          retention-days: 1

  # The suite split across machines. Each shard runs its part exactly as a local run does (same
  # config: 4 workers, no retries); only the reporters differ (a blob report to merge).
  e2e:
    needs: e2e-build
    if: needs.e2e-build.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser, cached per Playwright version (the system libraries come from apt each
      # time). Headless runs use Chromium's headless shell, so that's all we install.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # One shard saves, so the others don't race it for the same key.
      - if: steps.browsers.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/web-dist.tar" -C apps/web

      # Playwright directly, not `nx run web:e2e`, which would build the site again.
      - run: pnpm exec playwright test -c apps/web/e2e/playwright.config.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Kept a day: e2e-report merges them into one artifact each.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-screenshots-${{ matrix.shard }}
          path: test-output/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-blob-${{ matrix.shard }}
          path: test-output/e2e/blob
          if-no-files-found: ignore
          retention-days: 1

  # The shards' results in one place. When a test failed, one HTML report of the whole suite with
  # each failure's trace and screenshot. Screenshots (4 sizes, JPEG) on every web-affected run as
  # one artifact. Both kept 7 days, never committed (T8). Every step runs unless cancelled, so a
  # missing piece (say, no screenshots because the browser didn't start) doesn't skip the rest.
  e2e-report:
    needs: [e2e-build, e2e]
    if: always() && needs.e2e-build.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-e2e-blob-*
          merge-multiple: true
          path: test-output/e2e/blob
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-output/e2e/report
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright merge-reports -c apps/web/e2e/playwright.config.ts --reporter html test-output/e2e/blob
      - if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-report
          path: test-output/e2e/report
          retention-days: 7

      # Download and upload rather than upload-artifact/merge, which fails when there's nothing to
      # merge. The shard parts aren't deleted (they expire after a day), so after "Re-run failed
      # jobs" this takes each shard's latest part and the set is complete.
      - if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-e2e-screenshots-*
          merge-multiple: true
          path: test-output/e2e/screenshots
      - if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-screenshots
          path: test-output/e2e/screenshots
          if-no-files-found: warn
          retention-days: 7

  # The required check (protect-main requires `main`). Fails closed: `checks` and `e2e-build` must
  # pass; the browser jobs must pass when web is affected and may be skipped only when e2e-build
  # said web=false.
  main:
    needs: [checks, e2e-build, e2e, e2e-report]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.e2e-build.result }}
          WEB: ${{ needs.e2e-build.outputs.web }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          echo "checks=$CHECKS e2e-build=$BUILD web=$WEB e2e=$E2E e2e-report=$REPORT"
          [ "$CHECKS" = success ] && [ "$BUILD" = success ] || exit 1
          case "$WEB" in
            true) [ "$E2E" = success ] && [ "$REPORT" = success ] ;;
            false) [ "$E2E" = skipped ] && [ "$REPORT" = skipped ] ;;
            *) exit 1 ;;
          esac
