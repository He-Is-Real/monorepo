name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  NX_CACHE_PATHS: |
    .nx/cache
    .nx/workspace-data/*.db
  # Keep in step with mise.toml. Checksum from the release's CHECKSUMS file.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # Keep in step with mise.toml. From gitleaks_8.30.1_checksums.txt (read 2026-10-22).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx build cache across runs: every run restores main's latest, only main
      # saves (so PR entries can't evict it). The cache index goes with it; no
      # lockfile hash in the key, as Nx already hashes dependency versions per
      # project. The nx-ci- prefix keeps it apart from _images.yml.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_PATHS }}
          key: nx-ci-${{ github.sha }}
          restore-keys: nx-ci-
      - run: tools/scripts/nx-cache-adopt.sh

      # Used by the surrealdb-k8s:validate target.
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Secret scanning with the default rules plus Bunny keys (.gitleaks.toml), which GitHub's
      # own scanning doesn't know. Also used by tools/scripts/tests/gitleaks-bunny.test.mjs.
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
      # The commits this PR or push adds. A new branch's first push has no `before`: last commit.
      - name: Scan new commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            range=-1
          else
            range="$BASE_SHA..$GITHUB_SHA"
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range"

      # Base/head SHAs so `nx affected` only runs what a change touches.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: pnpm nx format:check
      # The WIF condition gating tf-cluster-planner (D42), against GitHub OIDC claim fixtures.
      - run: node --test infra/terraform/modules/bootstrap/tests/*.test.mjs
      # tf.sh (identities, refusals, Bunny redaction) against stub binaries; the gitleaks Bunny
      # rule; workflow permissions.
      - run: node --test tools/scripts/tests/*.test.mjs
      - run: pnpm nx affected -t lint test build typecheck validate

      # Schema and permission tests against a real SurrealDB (libs/database). The target starts
      # the image pinned by tag + digest in infra/k8s/surrealdb/base/kustomization.yaml with
      # `docker run` (preinstalled on ubuntu-latest), so CI tests the version the cluster runs.
      # Not a `services:` container: those can't pass SurrealDB its `start` arguments.
      - run: pnpm nx affected -t test-integration

      # Responsive and walking-skeleton checks (apps/web/e2e): the built site against a stub
      # api-public-read on Chromium, across the device matrix in light and dark. Only when web
      # is affected; the screenshots are uploaded for review.
      - id: e2e
        run: |
          if pnpm nx show projects --affected --withTarget=e2e | grep -qx web; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.e2e.outputs.web == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.e2e.outputs.web == 'true'
        run: pnpm nx run web:e2e
      - if: always() && steps.e2e.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e
          path: test-output/e2e
          retention-days: 14

      # Proves the Dockerfiles still build; pushing happens in _images.yml.
      - run: pnpm nx affected -t container

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_PATHS }}
          key: nx-ci-${{ github.sha }}
