name: OpenTofu plan

# Pull requests only, read-only advice: never applies, never touches bunny or stripe. What merges is
# planned again on main by tofu-apply.yml, which plans every root and asks before each apply.
#
# Every PR first gets offline checks that fail loudly: fmt, validate of every root, the
# encryption key names, the Bunny keys' sensitivity, and every Kustomize overlay rendered and
# schema-checked. ci.yml's required job runs the modules' `tofu test` (terraform:test) and the
# database integration suite.
# Then the roots the PR touches (tools/scripts/tf-roots.sh) are planned without a refresh or
# lock as tf-planner (gcp, images). bunny and stripe are never planned here: tf-bunny is only
# available on main, and tf-planner can't read the Stripe key. bootstrap is planned and applied
# locally.
#
# Every plan also gets the UK location check (D119's interim guard): `tf.sh <root> plan` runs
# tools/scripts/tf-location-check.sh on it. In dev a finding is a warning in the step summary and
# the plan goes on; outside dev it fails the plan.
#
# The cluster plan (D42) is a separate job. Its kustomization diffs are server-side dry runs,
# which Kubernetes authorises like real writes, so it runs as tf-cluster-planner, which can
# create/patch in the `database` namespace (modules/cluster/planner_rbac.tf). It runs only for
# this repository's own PRs, in the protected `cluster-plan` environment (a maintainer approves
# each run), and the Google identity can only be obtained from this workflow in that
# environment (cluster_plan_gate in modules/bootstrap).

on:
  pull_request:
    paths:
      [
        'infra/**',
        'libs/database/schema/**',
        'libs/legal/**',
        'tools/scripts/tf*.sh',
        'tools/scripts/image-tag.sh',
        '.github/actions/tofu/**',
        '.github/workflows/tofu-*.yml',
        'mise.toml',
      ]

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail: any failing command fails the step

env:
  # Keep in step with mise.toml (tf.sh refuses any other OpenTofu version).
  TOFU_VERSION: 1.13.2
  # Keep in step with mise.toml and ci.yml (Renovate bumps all three; the checksum by hand, from
  # the release's CHECKSUMS file).
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not .github/actions/tofu: this job never signs in.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra/terraform
      - name: Validate every root
        run: |
          for dir in infra/terraform/live/dev/*/; do
            root="$(basename "$dir")"
            echo "::group::$root"
            tools/scripts/tf.sh "$root" init -backend=false -input=false
            tools/scripts/tf.sh "$root" validate
            echo "::endgroup::"
          done
      # validate doesn't evaluate the encryption block (S6), so at least pin the key names (only
      # bunny uses tofu-bunny) and that state and plans are enforced, with no plaintext method or
      # fallback. Plans against the real backend test the rest.
      - name: Check the encryption config
        run: |
          key_only() { # key_only <root> <key> <other key>
            local file="infra/terraform/live/dev/$1/encryption.tf"
            grep -q "cryptoKeys/$2\"" "$file" || { echo "::error file=$file::must use $2"; exit 1; }
            if grep -q "$3" "$file"; then echo "::error file=$file::must not use $3"; exit 1; fi
            [ "$(grep -c 'enforced *= *true' "$file")" -eq 2 ] ||
              { echo "::error file=$file::state and plan must both be enforced"; exit 1; }
          }
          key_only bunny tofu-bunny tofu-state
          for root in bootstrap gcp images cluster stripe; do key_only "$root" tofu-state tofu-bunny; done
          if git grep -n -E 'method +"unencrypted"|fallback +\{' -- 'infra/terraform/*.tf'; then
            echo "::error::no plaintext method or fallback: every state is encrypted (D54)"
            exit 1
          fi
      # S11: CI's Bunny jobs print only plan-summary, and that relies on the five Bunny key
      # attributes being sensitive in the locked bunnynet provider. (The Stream pull zone's key,
      # read through data.bunnynet_pullzone, isn't marked sensitive: the module wraps it in
      # sensitive() and `tf.sh bunny-mask state` masks it by type.) A scratch root with only the
      # bunny root's lock file: `providers schema` evaluates the encryption block (it calls
      # KMS), and this job has no Google credentials.
      - name: Check the Bunny keys are sensitive
        run: |
          schema="$(mktemp -d)"
          cp infra/terraform/live/dev/bunny/.terraform.lock.hcl "$schema/"
          printf 'terraform {\n  required_providers {\n    bunnynet = { source = "BunnyWay/bunnynet" }\n  }\n}\n' > "$schema/main.tf"
          tofu -chdir="$schema" init -backend=false -input=false > /dev/null
          tofu -chdir="$schema" providers schema -json |
            jq -e '.provider_schemas["registry.opentofu.org/bunnyway/bunnynet"].resource_schemas
              | [.bunnynet_stream_library.block.attributes.api_key,
                 .bunnynet_stream_library.block.attributes.api_key_readonly,
                 .bunnynet_storage_zone.block.attributes.password,
                 .bunnynet_storage_zone.block.attributes.password_readonly,
                 .bunnynet_pullzone.block.attributes.token_auth_key]
              | map(.sensitive == true) | length == 5 and all'
      # What the cluster root would apply, rendered and schema-checked (instead of a plan).
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render and check every Kustomize overlay
        run: infra/k8s/surrealdb/scripts/validate.sh
      # The cluster planner's RBAC + dry-run-only admission policy (D42), against a real API
      # server in a throwaway kind cluster (preinstalled on ubuntu-latest).
      - name: Test the planner's dry-run-only policy
        run: infra/terraform/modules/cluster/tests/planner-dry-run-only.sh

  # Which roots this PR touches. Selection is fine here: a PR plan is advice, and main plans
  # every root again after the merge.
  roots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gcp: ${{ steps.roots.outputs.gcp }}
      images: ${{ steps.roots.outputs.images }}
      cluster: ${{ steps.roots.outputs.cluster }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
      - id: roots
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          roots="$(tools/scripts/tf-roots.sh changed "$BASE" "$HEAD")"
          for root in gcp images cluster; do
            if grep -qx "$root" <<< "$roots"; then echo "$root=true"; else echo "$root=false"; fi
          done >> "$GITHUB_OUTPUT"
          {
            echo "### Roots this PR touches"
            echo '```'
            echo "${roots:-none}"
            echo '```'
            echo "bunny, stripe: planned after merge on main (tofu-apply.yml); bootstrap: plan and apply locally."
          } >> "$GITHUB_STEP_SUMMARY"

  plan-gcp:
    needs: [validate, roots]
    # Fork PRs get no Google identity (GitHub issues no OIDC token to forks).
    if: needs.roots.outputs.gcp == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-planner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tofu
        with:
          service_account: tf-planner@heisreal-dev.iam.gserviceaccount.com
      # -refresh=false: compares the code with the last applied state without reading live
      # objects (the planner can't read Kubernetes Secrets or secret values). tofu-apply.yml
      # always plans with a full refresh. -lock=false: the planner can read state but not lock.
      # 2>&1: OpenTofu writes errors to stderr, which tee would otherwise miss.
      - name: tofu plan (gcp)
        run: |
          tools/scripts/tf.sh gcp init -input=false
          code=0
          tools/scripts/tf.sh gcp plan -input=false -refresh=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || code=$?
          { echo "### dev/gcp"; echo '```'; grep -E '^(Plan:|No changes|Error)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  plan-images:
    needs: [validate, roots]
    if: needs.roots.outputs.images == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-planner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The images root hashes each service's pruned build output (tools/scripts/image-tag.sh).
      - run: pnpm nx run-many -t prune -p $(tools/scripts/image-services.sh)
      - uses: ./.github/actions/tofu
        with:
          service_account: tf-planner@heisreal-dev.iam.gserviceaccount.com
      - name: tofu plan (images)
        run: |
          tools/scripts/tf.sh images init -input=false
          code=0
          tools/scripts/tf.sh images plan -input=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || code=$?
          { echo "### dev/images"; echo '```'; grep -E '^(Plan:|No changes|Error)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  plan-cluster:
    needs: [validate, roots]
    # Never for forks (no OIDC token for them either). Pauses for a maintainer's approval.
    # CLUSTER_PLAN_ENABLED (repository variable) is set once the cluster-plan environment is
    # protected and the bootstrap/cluster roots have created the identity and its RBAC, so the
    # job never runs, or creates the environment, before the gate exists.
    if: >-
      vars.CLUSTER_PLAN_ENABLED == 'true' && needs.roots.outputs.cluster == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cluster-plan
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-cluster-planner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tofu
        with:
          service_account: tf-cluster-planner@heisreal-dev.iam.gserviceaccount.com
      # -refresh=false and -lock=false as above. A failing plan (e.g. a forbidden dry run) fails
      # the step.
      - name: tofu plan (cluster)
        run: |
          tools/scripts/tf.sh cluster init -input=false
          code=0
          tools/scripts/tf.sh cluster plan -input=false -refresh=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || code=$?
          { echo "### dev/cluster"; echo '```'; grep -E '^(Plan:|No changes|Error)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
