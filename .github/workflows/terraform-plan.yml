name: Terraform plan

# Automatic, read-only. Never applies: applies are manual (terraform-apply.yml)
# or from a local developer machine.

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform-*.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform-*.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every root
        run: |
          for root in infra/terraform/live/dev/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

  plan:
    needs: validate
    # Fork PRs get no Google identity (GitHub issues no OIDC token to forks).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [gcp, cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-planner@heisreal-dev.iam.gserviceaccount.com
      # -refresh=false: compares the code with the last applied state without
      # reading live objects (the planner can't read Kubernetes Secrets or
      # secret values). The manual apply job always plans with a full refresh.
      # -lock=false: the planner can read state but not take the lock.
      - name: terraform plan (${{ matrix.root }})
        working-directory: infra/terraform/live/dev/${{ matrix.root }}
        run: |
          terraform init -input=false
          terraform plan -input=false -refresh=false -lock=false -no-color | tee plan.txt
          { echo "### dev/${{ matrix.root }}"; echo '```'; grep -E '^(Plan:|No changes)' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
