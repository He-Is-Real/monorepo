name: Terraform plan

# Automatic, read-only. Never applies: applies are manual (terraform-apply.yml)
# or from a local developer machine. Runs OpenTofu (D54) through tools/scripts/tf.sh;
# the file keeps its name because the bootstrap sign-in gates pin it.
#
# Every PR first gets offline checks that fail loudly: fmt, validate of every
# root, `tofu test` of the pure modules (Job and identity naming), and
# every Kustomize overlay rendered and schema-checked (ci.yml runs the database
# integration suite).
#
# The cluster plan (D42) is a separate job. Its kustomization diffs are
# server-side dry runs, which Kubernetes authorises like real writes, so it runs
# as tf-cluster-planner, which can create/patch in the `database` namespace
# (modules/cluster/planner_rbac.tf). It therefore runs only for this
# repository's own PRs and pushes to main, in the protected `cluster-plan`
# environment (a maintainer approves each run), and the Google identity can
# only be obtained from this workflow in that environment (WIF condition in
# modules/bootstrap/ci_identity.tf).

on:
  pull_request:
    paths:
      [
        'infra/**',
        'libs/database/schema/**',
        'libs/legal/**',
        '.github/workflows/terraform-*.yml',
        'tools/scripts/tf.sh',
        'mise.toml',
      ]
  push:
    branches: [main]
    paths:
      [
        'infra/**',
        'libs/database/schema/**',
        'libs/legal/**',
        '.github/workflows/terraform-*.yml',
        'tools/scripts/tf.sh',
        'mise.toml',
      ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with mise.toml (tf.sh refuses any other OpenTofu version).
  TOFU_VERSION: 1.13.2
  # Keep in step with mise.toml and ci.yml. Checksum from the release's CHECKSUMS file.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: any failing command fails the step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra/terraform
      - name: Validate every root
        run: |
          set -euo pipefail
          for dir in infra/terraform/live/dev/*/; do
            root="$(basename "$dir")"
            echo "::group::$root"
            tools/scripts/tf.sh "$root" init -backend=false -input=false
            tools/scripts/tf.sh "$root" validate
            echo "::endgroup::"
          done
      # The migrate Job's and the identity config's names change iff their content does (D14,
      # D13 B). No providers, no cloud access.
      # bunny-state-guard: who may hold inherited object reads (the bunny root's pre-plan check).
      - name: Test the pure modules
        run: |
          set -euo pipefail
          for module in db-migration db-identity bunny-state-guard; do
            tofu -chdir="infra/terraform/modules/$module" init -backend=false -input=false
            tofu -chdir="infra/terraform/modules/$module" test
          done
      # What the cluster root would apply, rendered and schema-checked (instead of a plan).
      - name: Install kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render and check every Kustomize overlay
        run: infra/k8s/surrealdb/scripts/validate.sh
      # The cluster planner's RBAC + dry-run-only admission policy (D42), against a real API
      # server in a throwaway kind cluster (preinstalled on ubuntu-latest).
      - name: Test the planner's dry-run-only policy
        run: infra/terraform/modules/cluster/tests/planner-dry-run-only.sh

  plan:
    needs: validate
    # Fork PRs get no Google identity (GitHub issues no OIDC token to forks).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cluster: the plan-cluster job below. bunny: validate only, never planned here (its plan
        # needs the Bunny account key and its state holds keys; infra/terraform/README.md).
        root: [gcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-planner@heisreal-dev.iam.gserviceaccount.com
      # -refresh=false: compares the code with the last applied state without
      # reading live objects (the planner can't read Kubernetes Secrets or
      # secret values). The manual apply job always plans with a full refresh.
      # -lock=false: the planner can read state but not take the lock.
      - name: tofu plan (${{ matrix.root }})
        # pipefail: without it the step's status is tee's, so a failing plan
        # showed green. 2>&1: OpenTofu writes errors to stderr, which tee
        # would otherwise miss. The summary is still written, then the plan's
        # own exit code decides the step.
        env:
          ROOT: ${{ matrix.root }}
        run: |
          set -o pipefail
          tools/scripts/tf.sh "$ROOT" init -input=false
          code=0
          tools/scripts/tf.sh "$ROOT" plan -input=false -refresh=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || code=$?
          { echo "### dev/$ROOT"; echo '```'; grep -E '^(Plan:|No changes|Error:)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  plan-cluster:
    needs: validate
    # Never for forks (no OIDC token for them either). Pauses for a maintainer's approval.
    # CLUSTER_PLAN_ENABLED (repository variable) is set once the cluster-plan environment is
    # protected and the bootstrap/cluster roots have created the identity and its RBAC, so the
    # job never runs, or creates the environment, before the gate exists.
    if: >-
      vars.CLUSTER_PLAN_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: cluster-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-cluster-planner@heisreal-dev.iam.gserviceaccount.com
      # -refresh=false and -lock=false as above. pipefail and 2>&1: a failing plan
      # (e.g. a forbidden dry run) fails the step instead of showing tee's status.
      - name: tofu plan (cluster)
        shell: bash
        run: |
          set -euo pipefail
          tools/scripts/tf.sh cluster init -input=false
          status=0
          tools/scripts/tf.sh cluster plan -input=false -refresh=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || status=$?
          { echo "### dev/cluster"; echo '```'; grep -E '^(Plan:|No changes|Error)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
