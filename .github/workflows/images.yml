name: Release Images

# Every push to main builds the services whose code changed and pushes them to
# apps. Dev's "main" entries pick them up on the next manual gcp apply;
# deploying is never automatic (AGENTS.md).

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  # Skips the image job when no service could have changed since the last
  # successful run (docs, Terraform, ...). Only a gate: the content-hash tag
  # in _images.yml still decides what is pushed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # nx-set-shas looks up the last successful images.yml run
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          workflow-id: images.yml
      - id: check
        shell: bash # -eo pipefail: if Nx fails, fail rather than skip a release
        run: |
          # Services Nx sees as changed (their code, libs, deps or Dockerfile),
          # plus the files outside Nx that change how images are tagged/built.
          affected=$(pnpm -s nx show projects --affected --with-target container --json)
          services=$(jq -er 'join(" ")' <<<"$affected")
          other=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- tools/scripts/image-tag.sh .github/workflows/_images.yml .github/workflows/images.yml)
          echo "Affected services: ${services:-none}. Image tooling changed: ${other:-no}."
          if [ -n "$services$other" ]; then build=true; else build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  images:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/_images.yml
    with:
      repository: apps
      # Only pushes to main may use it (push_gate in the bootstrap root).
      service_account: ci-image-pusher@heisreal-dev.iam.gserviceaccount.com
