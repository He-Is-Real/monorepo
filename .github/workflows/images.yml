name: Release Images

# Every push to main: builds the services whose code changed and pushes them to
# apps, in one job (_images.yml). Its completion, success or failure, starts the
# dev deploy (tofu-apply.yml), so it runs on every merge, also when nothing needs
# building (that path only checks out, installs and asks Nx: under a minute).

on:
  push:
    branches: [main]

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  images:
    # A called workflow can only lower what its caller grants.
    permissions:
      contents: read
      actions: read # nx-set-shas looks up the last successful images.yml run
      id-token: write
    uses: ./.github/workflows/_images.yml
    with:
      repository: apps
      changed_only: true
      # Only pushes to main may use it (push_gate in the bootstrap root).
      service_account: ci-image-pusher@heisreal-dev.iam.gserviceaccount.com
