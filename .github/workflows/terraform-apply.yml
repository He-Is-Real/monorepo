name: Terraform apply (manual)

# Manual only: Actions -> "Terraform apply (manual)" -> Run workflow, on main.
# 1. plan: a full-refresh plan, shown in the run summary and saved to the
#    (private) state bucket.
# 2. apply: waits for the "dev" environment approval (self-approval is fine:
#    the gate is that applies are deliberate, not peer review), then applies
#    exactly the saved plan. OpenTofu refuses it if state changed meanwhile.
# Runs OpenTofu (D54) through tools/scripts/tf.sh; the file keeps its name because
# the bootstrap sign-in gates pin it.
# Only a manual run of this file on main can obtain the deployer identity
# (deploy_gate in the bootstrap root). Images come from what main commits in
# live/dev/gcp/images.auto.tfvars; there is no override here.

on:
  workflow_dispatch:
    inputs:
      root:
        description: OpenTofu root to apply (infra/terraform/live/dev/<root>)
        type: choice
        options: [gcp, cluster]

# Nothing by default; each job asks for what it uses (tools/scripts/tests/workflows.test.mjs).
permissions: {}

concurrency:
  group: tf-apply-dev # one apply at a time
  cancel-in-progress: false

env:
  ROOT: ${{ inputs.root }}
  # Keep in step with mise.toml (tf.sh refuses any other OpenTofu version).
  TOFU_VERSION: 1.13.2
  PLAN_OBJECT: gs://heisreal-dev-tfstate/plans/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.root }}.tfplan

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-deployer@heisreal-dev.iam.gserviceaccount.com
      - id: plan
        name: tofu plan (${{ inputs.root }})
        run: |
          tools/scripts/tf.sh "$ROOT" init -input=false
          set +e
          tools/scripts/tf.sh "$ROOT" plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -no-color > "$RUNNER_TEMP/plan.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/plan.txt"
          [ "$code" -eq 1 ] && exit 1
          { echo "### dev/$ROOT"; echo '```'; grep -E '^\s+# |^(Plan:|No changes)' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            gcloud storage cp "$RUNNER_TEMP/tfplan" "$PLAN_OBJECT"
            echo changes=true >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: plan
    permissions:
      contents: read
      id-token: write # keyless Google auth (tf-deployer)
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: dev # pauses for approval: read the plan above first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-deployer@heisreal-dev.iam.gserviceaccount.com
      - name: tofu apply (${{ inputs.root }})
        run: |
          tools/scripts/tf.sh "$ROOT" init -input=false
          gcloud storage cp "$PLAN_OBJECT" "$RUNNER_TEMP/tfplan"
          tools/scripts/tf.sh "$ROOT" apply -input=false -no-color "$RUNNER_TEMP/tfplan"
          gcloud storage rm "$PLAN_OBJECT"
