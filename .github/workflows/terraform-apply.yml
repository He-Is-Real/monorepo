name: Terraform apply (manual)

# Manual only: Actions -> "Terraform apply (manual)" -> Run workflow, on main.
# 1. plan: a full-refresh plan, shown in the run summary and saved to the
#    (private) state bucket.
# 2. apply: waits for the "dev" environment approval (self-approval is fine:
#    the gate is that applies are deliberate, not peer review), then applies
#    exactly the saved plan. Terraform refuses it if state changed meanwhile.
# Only a manual run of this file on main can obtain the deployer identity
# (deploy_gate in the bootstrap root). Images come from what main commits in
# live/dev/gcp/images.auto.tfvars; there is no override here.

on:
  workflow_dispatch:
    inputs:
      root:
        description: Terraform root to apply (infra/terraform/live/dev/<root>)
        type: choice
        options: [gcp, cluster]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-apply-dev # one apply at a time
  cancel-in-progress: false

env:
  WORKDIR: infra/terraform/live/dev/${{ inputs.root }}
  PLAN_OBJECT: gs://heisreal-dev-tfstate/plans/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.root }}.tfplan

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-deployer@heisreal-dev.iam.gserviceaccount.com
      - id: plan
        name: terraform plan (${{ inputs.root }})
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan -no-color > plan.txt
          code=$?
          set -e
          cat plan.txt
          [ "$code" -eq 1 ] && exit 1
          { echo "### dev/${{ inputs.root }}"; echo '```'; grep -E '^\s+# |^(Plan:|No changes)' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            gcloud storage cp tfplan "$PLAN_OBJECT"
            echo changes=true >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: dev # pauses for approval: read the plan above first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/236063168938/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tf-deployer@heisreal-dev.iam.gserviceaccount.com
      - name: terraform apply (${{ inputs.root }})
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false
          gcloud storage cp "$PLAN_OBJECT" tfplan
          terraform apply -input=false -no-color tfplan
          gcloud storage rm "$PLAN_OBJECT"
