# Command-line tools the repo needs beyond pnpm (Joel, 2026-10-25: pin them all, keep them updated).
# `mise install` in this directory installs them. CI pins the same versions for the tools it uses.
[tools]
node = "24" # same major as .nvmrc; pnpm comes from package.json's packageManager (corepack)
kubeconform = "0.8.0"
opentofu = "1.13.2"
gitleaks = "8.30.1"
# Vendor CLIs used by hand (docs/tooling-and-accounts.md). CI doesn't need them.
"npm:clerk" = "4.1.0"
"npm:@bunny.net/cli" = "0.21.1"
"npm:resend-cli" = "2.26.2"
dapr = "1.19.1" # the media worker on Joel's machine (docs/runbooks/media.md, "Media ready")
"github:axiomhq/cli" = "0.23.0" # read logs in Axiom (docs/tooling-and-accounts.md, "Axiom")

[env]
# The Axiom CLI queries our EU edge (org "He Is Real", dataset heisreal-dev; docs/tooling-and-accounts.md).
AXIOM_EDGE_REGION = "eu-central-1.aws.edge.axiom.co"
